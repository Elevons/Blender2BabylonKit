<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Babylon Level</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0a; }
      #app { width: 100vw; height: 100vh; display: block; touch-action: none; }
      #bjs-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #e8e8e8;
        font: 14px/1.4 system-ui, sans-serif;
        transition: opacity 0.25s ease;
      }
      #bjs-loading[data-hidden="true"] {
        opacity: 0;
        pointer-events: none;
      }
      .bjs-loading-panel {
        width: min(360px, calc(100vw - 48px));
      }
      .bjs-loading-status {
        margin-bottom: 12px;
        letter-spacing: 0.02em;
      }
      .bjs-loading-track {
        height: 4px;
        background: #2a2a2a;
        overflow: hidden;
      }
      .bjs-loading-bar {
        height: 100%;
        width: 0%;
        background: #e8e8e8;
        transform-origin: left center;
      }
      .bjs-loading-bar[data-indeterminate="true"] {
        width: 40%;
        animation: bjs-loading-indeterminate 1.1s ease-in-out infinite;
      }
      .bjs-loading-pct {
        margin-top: 8px;
        font-size: 12px;
        color: #9a9a9a;
        min-height: 1.2em;
      }
      @keyframes bjs-loading-indeterminate {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="bjs-loading" role="status" aria-live="polite" aria-busy="true">
      <div class="bjs-loading-panel">
        <div class="bjs-loading-status" id="bjs-loading-status">Loading…</div>
        <div class="bjs-loading-track">
          <div class="bjs-loading-bar" id="bjs-loading-bar" data-indeterminate="true"></div>
        </div>
        <div class="bjs-loading-pct" id="bjs-loading-pct"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

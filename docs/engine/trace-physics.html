<style>
/* ─────────────────────────────────────────────
   RESET & BASE
   ───────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {

  font-family: monospace;
  overflow: hidden;
}

/* ─────────────────────────────────────────────

   ───────────────────────────────────────────── */
#app {
  display: flex;

  height: 100vh;

   TOOLBAR
   ───────────────────────────────────────────── */
#toolbar {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 12px;
  background: #111109;
  border-bottom: 1px solid #2a2820;
  flex-shrink: 0;
  flex-wrap: wrap;
}

/* Button group wrapper */
.tg { display: flex; align-items: center; gap: 4px; }

/* Muted group label (e.g. "mode", "file") */
.tlbl {
  font-size: 9px;
  color: #4a4838;
  letter-spacing: .08em;
  margin-right: 1px;
}

/* Toolbar button — default state */
.tb {
  background: #1a1a12;
  border: 1px solid #2e2c20;
  color: #887858;
  font-size: 10px;
  font-family: inherit;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: all .12s;
  white-space: nowrap;
}
.tb:hover    { border-color: #c8a84a; color: #e0c878; }
.tb.on       { border-color: #c8a84a; color: #f0d060; background: #1c1b0e; }
.tb:disabled { opacity: .3; cursor: default; }

/* Vertical rule between toolbar groups */
.tsep {
  width: 1px;
  height: 18px;
  background: #2a2820;
  margin: 0 3px;
  flex-shrink: 0;
}

/* Zoom percentage label — clickable to reset */
#zoom-lbl {
  font-size: 10px;
  color: #5a5040;
  min-width: 36px;
  text-align: center;
  cursor: pointer;
  padding: 4px 2px;
}
#zoom-lbl:hover { color: #a09070; }

/* Editable diagram title in toolbar */
#title-bar {
  font-size: 10px;
  color: #5a5040;
  padding: 0 4px;
  cursor: pointer;
  border: 1px solid transparent;
  border-radius: 3px;
  outline: none;
  background: transparent;
}
#title-bar:hover { border-color: #3a3428; color: #a09070; }
#title-bar:focus { border-color: #7a6830; color: #c8c09a; background: #161612; }

/* ─────────────────────────────────────────────
   WORKSPACE  (canvas area + side panel, side by side)
   ───────────────────────────────────────────── */
#workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ─────────────────────────────────────────────
   CANVAS AREA
   ───────────────────────────────────────────── */
#ca {
  flex: 1;
  position: relative;
  overflow: hidden;
}
canvas#cv {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: block;
}

/* Minimap overlay — bottom-right corner */
#minimap {

  bottom: 10px; right: 10px;
  width: 130px; height: 86px;
  background: #111109;
  border: 1px solid #2a2820;
  border-radius: 4px;
  overflow: hidden;
  pointer-events: none;
}
canvas#mm { display: block; width: 100%; height: 100%; }

/* Keyboard shortcut hint — bottom-left corner */
#hint {
  position: absolute;
  bottom: 10px; left: 12px;
  font-size: 10px;
  color: #2e2c20;
  pointer-events: none;
  max-width: 340px;
  line-height: 1.5;
}

/* ─────────────────────────────────────────────
   SIDE PANEL  (slides in from the right edge)
   ───────────────────────────────────────────── */
#panel {
  width: 0;
  overflow: hidden;
  background: #111109;

  transition: width .18s ease;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
#panel.open { width: 230px; }

/* Fixed-width inner container prevents layout reflow during slide animation */

  flex-direction: column;

  height: 100%;

/* "+ add row" button inside panel */

  border: 1px solid #2e1818;

// =============================================================================
const DIAGRAM_DATA = {"title":"Trace — Physics: collider → Havok body","nodes":[{"id":1,"x":40,"y":40,"w":190,"h":56,"label":"1. _serialize_components","sub":"export.py","desc":"EXPORT — every component becomes one dict. The COLLIDER case converts center (x,y,z)→(x,z,−y), swaps size axes, converts the rotation quaternion, and attaches trigger events. Output: the manifest's components array.","meta":[["File","blender_addon/export.py"],["Line","120"]],"code":"def _serialize_components(obj, output_dir):\n    comps = []\n    for c in obj.bjs_components:\n        if not c.enabled:\n            continue\n        d = {\"type\": c.comp_type}\n\n        if c.comp_type == 'TAG':\n            d[\"tag\"] = c.tag\n\n        elif c.comp_type == 'COLLIDER':\n            # Authored in Blender axes (Z-up); convert offset + size + rotation to\n            # Babylon Y-up so the runtime body matches the viewport preview.\n            cx, cy, cz = c.collider_center\n            sx, sy, sz = c.collider_size\n            q = mathutils.Euler(c.collider_rotation, 'XYZ').to_quaternion()\n            d.update({\n                \"shape\": c.collider_shape,\n                \"isTrigger\": bool(c.is_trigger),\n                \"autoFit\": bool(c.auto_fit),\n                \"size\": [sx, sz, sy],        # extents: y<->z axes swap\n                \"radius\": c.collider_radius,\n                \"height\": c.collider_height,\n                \"center\": [cx, cz, -cy],     # offset: (x, y, z) -> (x, z, -y)\n                \"rotation\": [q.x, q.z, -q.y, q.w],  # quaternion xyzw, axis Z-up -> Y-up\n            })\n            if c.is_trigger and len(c.trigger_events) > 0:\n                d[\"events\"] = [{\n                    \"target\": ensure_object_id(ev.target) if ev.target else None,\n                    \"message\": ev.message,\n                    \"filterTag\": ev.filter_tag,\n                } for ev in c.trigger_events]\n\n        elif c.comp_type == 'RIGIDBODY':\n            d.update({\n                \"bodyType\": c.body_type,\n                \"mass\": c.mass,\n                \"friction\": c.friction,\n                \"restitution\": c.restitution,\n                \"linearDamping\": c.linear_damping,\n                \"angularDamping\": c.angular_damping,\n            })\n\n        elif c.comp_type == 'SCRIPT':\n            d[\"script\"] = c.script_name\n            d[\"path\"] = c.script_path\n            d[\"vars\"] = _serialize_vars(c)\n\n        elif c.comp_type == 'CAMERA':\n            d.update({\n                \"cameraType\": c.cam_type,\n                \"attachControl\": bool(c.cam_attach_control),\n                \"keys\": {\n                    \"scheme\": c.cam_key_scheme,\n                    \"up\": c.cam_key_up, \"down\": c.cam_key_down,\n                    \"left\": c.cam_key_left, \"right\": c.cam_key_right,\n                },\n                \"useBlenderTransform\": bool(c.cam_use_blender_transform),\n                \"followMode\": c.cam_follow_mode,\n                \"speed\": c.cam_speed,\n                \"inertia\": c.cam_inertia,\n                \"radius\": c.cam_radius,\n                \"lowerRadius\": c.cam_lower_radius,\n                \"upperRadius\": c.cam_upper_radius,\n                \"target\": ensure_object_id(c.cam_target) if c.cam_target else None,\n                \"distance\": c.cam_distance,\n                \"height\": c.cam_height,\n                \"rotationOffset\": c.cam_rotation_offset,\n            })\n\n        elif c.comp_type == 'CONSTRAINT':\n            px, py, pz = c.con_pivot\n            d.update({\n                \"constraintType\": c.con_type,\n                \"target\": ensure_object_id(c.con_target) if c.con_target else None,\n                \"pivot\": [px, pz, -py],  # owner-local, converted to Babylon Y-up\n                \"axis\": _CONSTRAINT_AXIS_TO_BABYLON[c.con_axis],\n                \"collision\": bool(c.con_collision),\n                \"useLimits\": bool(c.con_use_limits),\n                \"min\": c.con_min,   # degrees (hinge) / meters (slider, spring)\n                \"max\": c.con_max,\n                \"stiffness\": c.con_stiffness,\n                \"damping\": c.con_damping,\n                \"motor\": bool(c.con_motor),\n                \"motorSpeed\": c.con_motor_speed,   # deg/s (hinge) / m/s (slider)\n                \"motorMaxForce\": c.con_motor_force,\n            })\n\n        elif c.comp_type == 'AUDIO':\n            d.update({\n                \"file\": _copy_audio_file(c.audio_file, output_dir),\n                \"volume\": c.audio_volume,\n                \"loop\": bool(c.audio_loop),\n                \"autoPlay\": bool(c.audio_autoplay),\n                \"spatial\": bool(c.audio_spatial),\n                \"maxDistance\": c.audio_max_distance,\n                \"playbackRate\": c.audio_rate,\n            })\n\n        comps.append(d)\n    return comps","file":"blender_addon/export.py","line":120},{"id":2,"x":300,"y":40,"w":190,"h":56,"label":"2. The manifest (data between the two halves)","sub":"data","desc":"Already Babylon-space (Y-up). The runtime never converts axes — that happened once, at export.","meta":[["Kind","data contract"]],"code":"{ \"type\": \"COLLIDER\", \"shape\": \"BOX\", \"isTrigger\": false, \"autoFit\": true,\n  \"size\": [1,1,1], \"radius\": 0.5, \"height\": 2, \"center\": [0,0,0],\n  \"rotation\": [0,0,0,1] },\n{ \"type\": \"RIGIDBODY\", \"bodyType\": \"DYNAMIC\", \"mass\": 1,\n  \"friction\": 0.5, \"restitution\": 0.2,\n  \"linearDamping\": 0, \"angularDamping\": 0 }","file":"","line":0},{"id":3,"x":560,"y":40,"w":190,"h":56,"label":"3. ApplyComponents","sub":"entityBuilder.ts","desc":"LOAD, per entity — receives Entity + Component[]. ClassifyComponents sorts them; collider/body pair goes to BuildPhysics; the returned PhysicsBody lands on entity.body.","meta":[["File","packages/engine/src/core/loader/entityBuilder.ts"],["Line","153"]],"code":"/**\n * Interpret an entity's components: build one physics body from any COLLIDER /\n * RIGIDBODY, register authored trigger reactions, queue sound creation, set the\n * tag, and instantiate SCRIPT behaviors (deferring their entity references).\n * Returns the deferred references for the second pass.\n */\nfunction ApplyComponents(\n  entity: Entity,\n  components: Component[],\n  scene: Scene,\n  registry: BehaviorRegistry,\n  context: LoadContext\n): PendingRef[]\n{\n  const { collider, body, scripts, audioComponents, constraintComponents } =\n    ClassifyComponents(entity, components);\n\n  if (collider !== undefined || body !== undefined)\n  {\n    entity.body = BuildPhysics(entity.node, collider, body, scene);\n  }\n\n  // Authored trigger reactions need the plugin observable; wired in a post-pass.\n  if (collider !== undefined && collider.isTrigger\n      && collider.events !== undefined && collider.events.length > 0)\n  {\n    context.triggerRegistrations.push({ sourceEntity: entity, events: collider.events });\n  }\n\n  // Sound creation is async (fetch + decode); collected and awaited after the loop.\n  for (const audioComponent of audioComponents)\n  {\n    context.audioTasks.push(ApplyAudio(entity, audioComponent, context.baseUrl));\n  }\n\n  // Joints need BOTH bodies to exist; built in a post-pass (FinalizeLevel).\n  for (const constraintComponent of constraintComponents)\n  {\n    context.constraintRegistrations.push({ ownerEntity: entity, component: constraintComponent });\n  }\n\n  return InstantiateScripts(entity, scripts, scene, registry, context.defaultInputMap);\n}","file":"packages/engine/src/core/loader/entityBuilder.ts","line":153},{"id":4,"x":560,"y":190,"w":190,"h":56,"label":"4. BuildPhysics","sub":"physics.ts","desc":"The dispatcher. In: node + ColliderComponent? + RigidBodyComponent? + scene. Builds the shared BodyBuildInput, picks one of three shape paths, applies dynamics. Out: PhysicsBody | undefined.","meta":[["File","packages/engine/src/subsystems/physics.ts"],["Line","479"]],"code":"/**\n * Combine a COLLIDER and/or RIGIDBODY component into a single Havok physics body\n * on the given node. Either may be absent:\n *   collider only  -> static (or trigger) body\n *   rigidbody only -> dynamic body, auto-fit box collider\n *   both           -> shape from collider, dynamics from rigidbody\n *\n * The body is attached directly to the entity node. This relies on the level\n * being imported right-handed (LevelLoader sets scene.useRightHandedSystem), so\n * the node's world matrix has no handedness mirror and Havok can decompose it\n * cleanly for both placement and orientation.\n */\nexport function BuildPhysics(\n  node: TransformNode,\n  collider: ColliderComponent | undefined,\n  body: RigidBodyComponent | undefined,\n  scene: Scene\n): PhysicsBody | undefined\n{\n  // getPhysicsEngine() is a Babylon \"Nullable\" that can be undefined at runtime,\n  // so test truthiness rather than `=== null`.\n  if (!scene.getPhysicsEngine())\n  {\n    console.warn(\n      `[bjs] physics not enabled; skipping body for \"${node.name}\". ` +\n      `Call EnableHavokPhysics(scene) before loading.`\n    );\n    return undefined;\n  }\n\n  const shapeKind = collider?.shape ?? \"BOX\";\n  const input = BuildBodyInput(node, collider, body, scene);\n\n  let physicsBody: PhysicsBody | undefined;\n  if (shapeKind === \"CONVEX\" || shapeKind === \"MESH\")\n  {\n    physicsBody = BuildGeometryShapeBody(input, shapeKind);\n  }\n  else if (collider === undefined || collider.autoFit)\n  {\n    physicsBody = BuildAutoFitBody(input, shapeKind);\n  }\n  else\n  {\n    physicsBody = AttachShape(BuildManualShape(collider, scene), input);\n  }\n\n  if (physicsBody === undefined)\n  {\n    return undefined;\n  }\n\n  ApplyBodyDynamics(physicsBody, input.motion, body);\n  return physicsBody;\n}","file":"packages/engine/src/subsystems/physics.ts","line":479},{"id":5,"x":300,"y":190,"w":190,"h":56,"label":"5. BuildBodyInput","sub":"physics.ts","desc":"The data every path shares: motion type, mass (DYNAMIC only), material, isTrigger, and the geometry facts (isMesh / hasGeometry via the ownership rule below).","meta":[["File","packages/engine/src/subsystems/physics.ts"],["Line","376"]],"code":"/** Gather the shared per-body inputs (dynamics, material, geometry facts) once. */\nfunction BuildBodyInput(\n  node: TransformNode,\n  collider: ColliderComponent | undefined,\n  body: RigidBodyComponent | undefined,\n  scene: Scene\n): BodyBuildInput\n{\n  const isMesh = node instanceof AbstractMesh && (node as AbstractMesh).getTotalVertices() > 0;\n\n  return {\n    node,\n    collider,\n    scene,\n    motion: MotionTypeFor(body),\n    mass: body !== undefined && body.bodyType === \"DYNAMIC\" ? body.mass : 0,\n    friction: body?.friction ?? 0.5,\n    restitution: body?.restitution ?? 0.2,\n    isTrigger: collider !== undefined && collider.isTrigger,\n    isMesh,\n    hasGeometry: isMesh || OwnedColliderMeshes(node).length > 0,\n  };\n}","file":"packages/engine/src/subsystems/physics.ts","line":376},{"id":6,"x":40,"y":190,"w":190,"h":56,"label":"6. OwnedColliderMeshes","sub":"physics.ts","desc":"THE ownership rule (v0.29.1): include a descendant mesh only if no node on its path up carries bjs_id — multi-material submeshes yes, parented child entities no.","meta":[["File","packages/engine/src/subsystems/physics.ts"],["Line","79"]],"code":"/**\n * The meshes whose geometry this node's collider should use: the node's own\n * mesh and its multi-material submeshes, but NOT meshes belonging to child\n * *entities* parented under it in Blender.\n *\n * The two cases look identical in the scene graph (both are descendant meshes),\n * so we discriminate by GUID: the glTF loader gives every authored object a\n * `bjs_id` in node.metadata.gltf.extras, while material-split submeshes\n * (`<name>_primitive0`, ...) inherit none. A descendant is \"owned\" only if no\n * node on its path up to `node` carries a bjs_id — i.e. it isn't, and isn't\n * under, a separate entity.\n */\nfunction OwnedColliderMeshes(node: TransformNode): Mesh[]\n{\n  const owned: Mesh[] = [];\n\n  for (const descendant of node.getChildMeshes(false))\n  {\n    if (!(descendant instanceof Mesh) || descendant.getTotalVertices() === 0)\n    {\n      continue;\n    }\n\n    // Walk up to `node`; if any intermediate node is its own entity, this mesh\n    // belongs to that child entity, not to us.\n    let belongsToChildEntity = false;\n    let ancestor: TransformNode | null = descendant;\n    while (ancestor !== null && ancestor !== node)\n    {\n      if (ancestor.metadata?.gltf?.extras?.[ID_KEY] !== undefined)\n      {\n        belongsToChildEntity = true;\n        break;\n      }\n      ancestor = ancestor.parent as TransformNode | null;\n    }\n\n    if (!belongsToChildEntity)\n    {\n      owned.push(descendant);\n    }\n  }\n\n  return owned;\n}","file":"packages/engine/src/subsystems/physics.ts","line":79},{"id":7,"x":40,"y":340,"w":190,"h":56,"label":"7. BuildAutoFitBody","sub":"physics.ts","desc":"Default path. Real mesh → PhysicsAggregate sizes the primitive. Multi-material wrapper → FitColliderShape over ComputeLocalBounds (an aggregate would crash on the non-mesh node).","meta":[["File","packages/engine/src/subsystems/physics.ts"],["Line","430"]],"code":"/**\n * Auto-fit primitive case: a PhysicsAggregate sizes the shape for real meshes;\n * multi-material wrapper nodes get a hierarchy-fitted shape instead (an\n * aggregate would call getTotalVertices on the non-mesh node and crash).\n */\nfunction BuildAutoFitBody(input: BodyBuildInput, shapeKind: ColliderComponent[\"shape\"]): PhysicsBody | undefined\n{\n  if (!input.hasGeometry)\n  {\n    console.warn(`[bjs] \"${input.node.name}\" has no mesh geometry to fit a collider.`);\n    return undefined;\n  }\n\n  if (input.isMesh)\n  {\n    const aggregate = new PhysicsAggregate(\n      input.node,\n      MapShapeType(shapeKind),\n      { mass: input.mass, friction: input.friction, r // =============================================================================
// CANVAS & DOM REFERENCES
// =============================================================================
const cv   = document.getElementById('cv');   // main diagram canvas
const ctx  = cv.getContext('2d');
const mmEl = document.getElementById('mm');   // minimap canvas
const mctx = mmEl.getContext('2d');
const ca   = document.getElementById('ca');   // canvas container div

// =============================================================================
// STATE
// =============================================================================

// Graph data
let nodes = [];   // [{ id, x, y, w, h, label, sub, desc, meta:[['k','v']…] }]
let edges = [];   // [{ id, src, tgt, label }]
let nid   = 1;    // auto-incrementing id counter for nodes and edges

// Interaction
let mode      = 'select';  // 'select' | 'node' | 'edge'
let sel       = null;      // { type:'node'|'edge', id } — currently selected item
let selNodeId = null;      // id of selected node (drives connected-edge highlight)
let edgeSrc   = null;      // node id awaiting second click when drawing an edge
let drag      = null;      // node object currently being dragged
let dragOffsetX = 0;  // distance from mouse to node origin X at drag start
let dragOffsetY = 0;  // distance from mouse to node origin Y at drag start
let isPanning = false;
let mouseWorld = { x: 0, y: 0 };  // current mouse in world space (used for ghost edge)

// Viewport transform  —  world → screen:  screenX = worldX * zoom + panX
let panX = 0;
let panY = 0;
let zoom = 1;

// =============================================================================
// HISTORY  (undo / redo)
// =============================================================================
const undoStack = [];  // past graph states, oldest → newest
const redoStack = [];  // states popped by undo, available to redo

/** Serialise the current graph and push it onto the undo stack. */
function snapshot() {
  undoStack.push(JSON.stringify({ nodes, edges, nid }));
  redoStack.length = 0;  // any new action invalidates the redo stack
  if (undoStack.length > 80) undoStack.shift();
  refreshUndoRedo();
}

/** Restore the graph from a serialised snapshot string. */
const restoreSnapshot = str => {
  const saved = JSON.parse(str);
  nodes = saved.nodes; edges = saved.edges; nid = saved.nid;
};

function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify({ nodes, edges, nid }));
  restoreSnapshot(undoStack.pop());
  clearSelection(); draw(); refreshUndoRedo();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify({ nodes, edges, nid }));
  restoreSnapshot(redoStack.pop());
  clearSelection(); draw(); refreshUndoRedo();
}

/** Enable/disable the undo and redo toolbar buttons to match stack state. */
function refreshUndoRedo() {
  document.getElementById('btn-undo').disabled = !undoStack.length;
  document.getElementById('btn-redo').disabled = !redoStack.length;
}

// =============================================================================
// KEYBOARD SHORTCUTS
// =============================================================================
document.addEventListener('keydown', e => {
  const ctrl   = e.ctrlKey || e.metaKey;
  const typing = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);

  if (ctrl && e.key === 'z' && !e.shiftKey)                       { e.preventDefault(); undo(); }
  if (ctrl && (e.key === 'y' || (e.key === 'z' && e.shiftKey)))   { e.preventDefault(); redo(); }
  if (ctrl && e.key === 's')                                       { e.preventDefault(); exportSelf(); }
  if (e.key === 'Escape')                                          { edgeSrc = null; draw(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && !typing)   { e.preventDefault(); deleteSelected(); }
});

// =============================================================================
// MATH & GEOMETRY HELPERS
// =============================================================================

/** Live canvas pixel dimensions (read each frame — canvas can be resized). */
const canvasW = () => cv.width;
const canvasH = () => cv.height;

/** Clamp value between lo and hi. */
const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));

/** Euclidean distance between two points. */
const dist = (ax, ay, bx, by) => Math.sqrt((bx - ax) ** 2 + (by - ay) ** 2);

/** Convert screen (canvas-pixel) coordinates to world space. */
const toWorld  = (screenX, screenY) => ({ x: (screenX - panX) / zoom, y: (screenY - panY) / zoom });

/** Convert world coordinates to screen (canvas-pixel) space. */
const toScreen = (worldX,  worldY)  => ({ x: worldX * zoom + panX,    y: worldY * zoom + panY    });

/** Horizontal centre of a node rectangle. */
const nodeCentreX = n => n.x + n.w / 2;

/** Vertical centre of a node rectangle. */
const nodeCentreY = n => n.y + n.h / 2;

/**
 * Axis-aligned bounding box of all nodes, expanded by `padding` on every side.
 * Returns { minX, minY, maxX, maxY } or null when there are no nodes.
 */
function nodeBounds(padding = 0) {
  if (!nodes.length) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.forEach(n => {
    minX = Math.min(minX, n.x - padding);
    minY = Math.min(minY, n.y - padding);
    maxX = Math.max(maxX, n.x + n.w + padding);
    maxY = Math.max(maxY, n.y + n.h + padding);
  });
  return { minX, minY, maxX, maxY };
}

/**
 * Compute the quadratic-bezier geometry for an edge.
 * Returns { x1, y1, x2, y2, cpx, cpy, mx, my }  (mx/my = midpoint for label placement)
 * or null if either endpoint node is missing from the nodes array.
 *
 * Geometry overview:
 *
 *   source centre ──► unit vector ──► x1/y1 (point on source box wall)
 *                                         ↓  curve
 *   target centre ◄── unit vector ◄── x2/y2 (point on target box wall, + arrowhead gap)
 *                          ↑
 *                     control point lifted above the straight midpoint
 *                     by 18% of the horizontal separation, giving a
 *                     gentle arc that grows with distance.
 */
function edgeEP(e) {
  const src = nodes.find(n => n.id === e.src);
  const tgt = nodes.find(n => n.id === e.tgt);
  if (!src || !tgt) return null;

  // Vector from source centre to target centre
  const dx = nodeCentreX(tgt) - nodeCentreX(src);
  const dy = nodeCentreY(tgt) - nodeCentreY(src);

  // Normalised direction (unit vector)
  const length = Math.sqrt(dx * dx + dy * dy) || 1;
  const unitX  = dx / length;
  const unitY  = dy / length;

  // Straight-line midpoint between the two centres
  const midX = (nodeCentreX(src) + nodeCentreX(tgt)) / 2;
  const midY = (nodeCentreY(src) + nodeCentreY(tgt)) / 2;

  // Arc height: lift the control point above the midpoint.
  // Using horizontal separation (dx) means wider edges arc higher.
  const arcLift       = Math.abs(dx) * 0.18;
  const labelLift     = Math.abs(dx) * 0.09;  // label sits halfway up the arc
  const ARROWHEAD_GAP = 7;

  // Where the line exits the source box wall
  const startX = nodeCentreX(src) + unitX * src.w / 2;
  const startY = nodeCentreY(src) + unitY * src.h / 2;

  // Where the line enters the target box wall (pulled back for the arrowhead)
  const endX = nodeCentreX(tgt) - unitX * (tgt.w / 2 + ARROWHEAD_GAP);
  const endY = nodeCentreY(tgt) - unitY * (tgt.h / 2 + ARROWHEAD_GAP);

  return {
    x1: startX,  y1: startY,
    x2: endX,    y2: endY,
    cpx: midX,   cpy: midY - arcLift,
    mx:  midX,   my:  midY - labelLift,
  };
}

// =============================================================================
// HIT TESTING
// =============================================================================

/**
 * Return the topmost node whose bounding box contains world point (wx, wy),
 * or null. Iterates in reverse so later-drawn (visually on top) nodes win.
 */
function hitNode(wx, wy) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const withinX = wx >= n.x && wx <= n.x + n.w;
    const withinY = wy >= n.y && wy <= n.y + n.h;
    if (withinX && withinY) return n;
  }
  return null;
}

/** Return the first edge whose midpoint is within 14px of (wx, wy), or null. */
const hitEdge = (wx, wy) => edges.find(e => {
  const ep = edgeEP(e);
  return ep && dist(wx, wy, ep.mx, ep.my) < 14;
}) ?? null;

// =============================================================================
// VIEWPORT  (zoom, pan, fit)
// =============================================================================

/** Resize both canvases to fill their container and redraw. */
function resize() {
  const bounds  = ca.getBoundingClientRect();
  cv.width      = bounds.width;
  cv.height     = bounds.height;
  mmEl.width    = 130;
  mmEl.height   = 86;
  draw();
}
new ResizeObserver(resize).observe(ca);

/**
 * Zoom by `delta` (positive = in, negative = out), pivoting around the
 * screen point (pivotX, pivotY).  Omit pivot to use the canvas centre.
 */
function zoomBy(delta, pivotX = canvasW() / 2, pivotY = canvasH() / 2) {
  const newZoom = clamp(zoom + delta, 0.1, 4);
  // Keep the world point under the pivot stationary
  const worldX = (pivotX - panX) / zoom;
  const worldY = (pivotY - panY) / zoom;
  zoom = newZoom;
  panX = pivotX - worldX * zoom;
  panY = pivotY - worldY * zoom;
  document.getElementById('zoom-lbl').textContent = Math.round(zoom * 100) + '%';
  draw();
}

/** Reset zoom to 100% with a comfortable top-left origin. */
function resetView() {
  zoom = 1; panX = 60; panY = 60;
  document.getElementById('zoom-lbl').textContent = '100%';
  draw();
}

/** Zoom and pan so all nodes fill the canvas with generous padding. */
function fitView() {
  const b = nodeBounds(60);
  if (!b) { resetView(); return; }
  const boundsW = b.maxX - b.minX;
  const boundsH = b.maxY - b.minY;
  zoom = clamp(Math.min(canvasW() / boundsW, canvasH() / boundsH), 0.1, 4);
  panX = canvasW() / 2 - ((b.minX + b.maxX) / 2) * zoom;
  panY = canvasH() / 2 - ((b.minY + b.maxY) / 2) * zoom;
  document.getElementById('zoom-lbl').textContent = Math.round(zoom * 100) + '%';
  draw();
}

// =============================================================================
// INTERACTION MODE
// =============================================================================

const HINTS = {
  select: 'Click to select · Drag to move · Double-click canvas to add node · Scroll to zoom · Drag empty space to pan',
  node:   'Click canvas to place a node · Esc to cancel',
  edge:   'Click source node, then target node · Esc to cancel',
};

function setMode(m) {
  mode = m; edgeSrc = null;
  ['select', 'node', 'edge'].forEach(x =>
    document.getElementById('btn-' + x).classList.toggle('on', x === m)
  );
  cv.style.cursor = m === 'node' ? 'crosshair' : m === 'edge' ? 'cell' : 'default';
  document.getElementById('hint').textContent = HINTS[m];
  draw();
}

// =============================================================================
// CANVAS EVENTS
// =============================================================================

// ── Helpers ──────────────────────────────────────────────────────────────────

/** Extract the canvas-relative world position from a mouse event. */
function worldFromEvent(e) {
  const bounds = cv.getBoundingClientRect();
  return toWorld(e.clientX - bounds.left, e.clientY - bounds.top);
}

/**
 * Create a new node object centred on world point (wx, wy).
 * Does not add it to the nodes array — caller does that.
 */
function makeNode(wx, wy) {
  return {
    id:    nid++,
    x:     wx - 55,
    y:     wy - 19,
    w:     110,
    h:     38,
    label: 'Node ' + (nid - 1),
    sub:   '',
    desc:  '',
    meta:  [],
  };
}

// ── mousedown handlers, one per mode ─────────────────────────────────────────

/**
 * Node mode: clicking empty canvas places a new node.
 * Clicking an existing node does nothing (avoids accidental stacking).
 */
function onMouseDownNodeMode(w) {
  if (hitNode(w.x, w.y)) return;  // don't stack on top of an existing node
  snapshot();
  const n = makeNode(w.x, w.y);
  nodes.push(n);
  selectNode(n);
  draw();
}

/**
 * Edge mode: first click records the source, second click on a different
 * node creates the edge.  Clicking the same node twice cancels.
 */
function onMouseDownEdgeMode(w) {
  const hit = hitNode(w.x, w.y);
  if (!hit) return;  // must click a node

  if (!edgeSrc) {
    edgeSrc = hit.id;   // waiting for second click
  } else if (edgeSrc === hit.id) {
    edgeSrc = null;     // same node clicked again — cancel
  } else {
    snapshot();
    edges.push({ id: nid++, src: edgeSrc, tgt: hit.id, label: '' });
    edgeSrc = null;     // edge created
  }
  draw();
}

/**
 * Select mode: clicking a node selects it and begins a drag.
 * Clicking an edge selects it.  Clicking empty space clears selection and
 * starts panning.
 */
function onMouseDownSelectMode(w) {
  const hitN = hitNode(w.x, w.y);
  if (hitN) {
    selectNode(hitN);
    drag = hitN;
    dragOffsetX = w.x - hitN.x;
    dragOffsetY = w.y - hitN.y;
    draw();
    return;
  }

  const hitE = hitEdge(w.x, w.y);
  if (hitE) {
    selectEdge(hitE);
    draw();
    return;
  }

  // Empty canvas — clear selection and start panning
  clearSelection();
  isPanning = true;
  cv.style.cursor = 'grabbing';
  draw();
}

// ── Event listeners ───────────────────────────────────────────────────────────

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const bounds = cv.getBoundingClientRect();
  zoomBy(-e.deltaY * 0.001, e.clientX - bounds.left, e.clientY - bounds.top);
}, { passive: false });

cv.addEventListener('mousemove', e => {
  const bounds = cv.getBoundingClientRect();
  mouseWorld = toWorld(e.clientX - bounds.left, e.clientY - bounds.top);

  if (drag) {
    drag.x = mouseWorld.x - dragOffsetX;
    drag.y = mouseWorld.y - dragOffsetY;
    draw();
    return;
  }
  if (isPanning) {
    panX += e.movementX;
    panY += e.movementY;
    draw();
    return;
  }
  if (mode === 'edge' && edgeSrc) { draw(); return; }  // redraw ghost edge
  if (mode === 'select') cv.style.cursor = hitNode(mouseWorld.x, mouseWorld.y) ? 'grab' : 'default';
});

cv.addEventListener('mousedown', e => {
  if (e.button === 2) return;  // ignore right-click

  // Alt+click or middle-click → pan regardless of mode
  if (e.altKey || e.button === 1) {
    isPanning = true;
    cv.style.cursor = 'grabbing';
    return;
  }

  const w = worldFromEvent(e);
  if (mode === 'node')   onMouseDownNodeMode(w);
  if (mode === 'edge')   onMouseDownEdgeMode(w);
  if (mode === 'select') onMouseDownSelectMode(w);
});

cv.addEventListener('mouseup', () => {
  if (drag) snapshot();  // commit drag position to history
  drag = null;
  isPanning = false;
  cv.style.cursor = mode === 'node' ? 'crosshair' : mode === 'edge' ? 'cell' : 'default';
});

cv.addEventListener('mouseleave', () => { drag = null; isPanning = false; });

// Double-click on empty canvas in select mode → quick-add a node
cv.addEventListener('dblclick', e => {
  if (mode !== 'select') return;
  const w = worldFromEvent(e);
  if (hitNode(w.x, w.y)) return;  // don't trigger on a node
  snapshot();
  const n = makeNode(w.x, w.y);
  nodes.push(n);
  selectNode(n);
  draw();
});

// =============================================================================
// SELECTION HELPERS
// =============================================================================

const selectNode  = n => { sel = { type: 'node', id: n.id }; selNodeId = n.id; openNodePanel(n); };
const selectEdge  = e => { sel = { type: 'edge', id: e.id }; selNodeId = null;  openEdgePanel(e); };
const clearSelection = () => { sel = null; selNodeId = null; closePanel(); };

// =============================================================================
// DRAW  —  main render pass (background → edges → nodes → minimap)
// =============================================================================

/**
 * Trace a rounded-rectangle path on context c.
 * Does not stroke or fill — caller decides.
 */
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);      c.arcTo(x + w, y,     x + w, y + r,     r);
  c.lineTo(x + w, y + h - r);  c.arcTo(x + w, y + h, x + w - r, y + h, r);
  c.lineTo(x + r, y + h);      c.arcTo(x,     y + h, x,     y + h - r, r);
  c.lineTo(x, y + r);          c.arcTo(x,     y,     x + r, y,         r);
  c.closePath();
}

/**
 * Return text clipped to fit within maxW pixels at the given font size,
 * appending "…" if truncation is needed.
 */
function clipText(text, maxW, c, fs) {
  c.font = `${fs}px monospace`;
  if (c.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && c.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

function draw() {
  ctx.clearRect(0, 0, canvasW(), canvasH());

  // Background
  ctx.fillStyle = '#0c0c0a';
  ctx.fillRect(0, 0, canvasW(), canvasH());

  // Dot grid  —  drawn in screen space so it tiles correctly during pan/zoom
  const DOT_SPACING = 28 * zoom;
  const dotSize     = Math.max(1, 1.3 * zoom);
  const gridOffsetX = ((panX % DOT_SPACING) + DOT_SPACING) % DOT_SPACING;
  const gridOffsetY = ((panY % DOT_SPACING) + DOT_SPACING) % DOT_SPACING;
  ctx.fillStyle = '#151512';
  for (let x = gridOffsetX - DOT_SPACING; x < canvasW(); x += DOT_SPACING)
    for (let y = gridOffsetY - DOT_SPACING; y < canvasH(); y += DOT_SPACING)
      ctx.fillRect(x, y, dotSize, dotSize);

  // All world-space drawing below this point
  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(zoom, zoom);

  // — Edges
  edges.forEach(e => {
    const ep = edgeEP(e);
    if (!ep) return;

    // An edge is "lit" if directly selected, or connects to the selected node
    const isSelected   = sel && sel.type === 'edge' && sel.id === e.id;
    const isAdjacent   = selNodeId && (e.src === selNodeId || e.tgt === selNodeId);
    const lit          = isSelected || isAdjacent;

    // Curve
    ctx.strokeStyle = lit ? '#c8a84a' : '#3a3428';
    ctx.lineWidth   = (lit ? 1.8 : 1) / zoom;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(ep.x1, ep.y1);
    ctx.quadraticCurveTo(ep.cpx, ep.cpy, ep.x2, ep.y2);
    ctx.stroke();

    // Arrowhead (small filled triangle at the tip)
    const arrowAngle = Math.atan2(ep.y2 - ep.cpy, ep.x2 - ep.cpx);
    const arrowSize  = 9 / zoom;
    ctx.fillStyle = lit ? '#c8a84a' : '#3a3428';
    ctx.beginPath();
    ctx.moveTo(ep.x2, ep.y2);
    ctx.lineTo(ep.x2 - arrowSize * Math.cos(arrowAngle - 0.4), ep.y2 - arrowSize * Math.sin(arrowAngle - 0.4));
    ctx.lineTo(ep.x2 - arrowSize * Math.cos(arrowAngle + 0.4), ep.y2 - arrowSize * Math.sin(arrowAngle + 0.4));
    ctx.closePath();
    ctx.fill();

    // Optional edge label
    if (e.label) {
      ctx.font      = `${10 / zoom}px monospace`;
      ctx.fillStyle = '#6a6040';
      ctx.textAlign = 'center';
      ctx.fillText(e.label, ep.mx, ep.my - 10 / zoom);
    }
  });

  // Ghost edge — dashed line from source node to cursor while drawing
  if (mode === 'edge' && edgeSrc) {
    const srcNode = nodes.find(n => n.id === edgeSrc);
    if (srcNode) {
      ctx.strokeStyle = '#8a7440';
      ctx.lineWidth   = 1 / zoom;
      ctx.setLineDash([4 / zoom, 3 / zoom]);
      ctx.beginPath();
      ctx.moveTo(nodeCentreX(srcNode), nodeCentreY(srcNode));
      ctx.lineTo(mouseWorld.x, mouseWorld.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // — Nodes
  nodes.forEach(n => {
    const isSelected   = sel && sel.type === 'node' && sel.id === n.id;
    const isEdgeSource = edgeSrc === n.id;  // highlighted as pending edge source

    ctx.fillStyle   = isSelected ? '#1f1e10' : isEdgeSource ? '#1a1810' : '#161612';
    ctx.strokeStyle = isSelected ? '#f0d060' : isEdgeSource ? '#c8a84a' : '#3a3428';
    ctx.lineWidth   = (isSelected ? 1.6 : 1) / zoom;
    roundRect(ctx, n.x, n.y, n.w, n.h, 5 / zoom);
    ctx.fill();
    ctx.stroke();

    // Primary label (shifted up when a sublabel is present)
    const fontSize  = 11 / zoom;
    const labelMaxW = n.w - 14 / zoom;
    const labelY    = n.sub ? n.y + n.h / 2 - 4 / zoom : n.y + n.h / 2;
    ctx.font      = `500 ${fontSize}px monospace`;
    ctx.fillStyle = isSelected ? '#f0e080' : '#c8c09a';
    ctx.textAlign = 'center';
    ctx.fillText(clipText(n.label, labelMaxW, ctx, fontSize), nodeCentreX(n), labelY);

    // Sublabel
    if (n.sub) {
      const subFontSize = 9 / zoom;
      ctx.font      = `${subFontSize}px monospace`;
      ctx.fillStyle = '#5a5040';
      ctx.fillText(clipText(n.sub, labelMaxW, ctx, subFontSize), nodeCentreX(n), n.y + n.h / 2 + 8 / zoom);
    }
  });

  ctx.restore();
  drawMinimap();
}

// =============================================================================
// MINIMAP
// =============================================================================

function drawMinimap() {
  const MM_W = 130, MM_H = 86;
  mctx.fillStyle = '#111109';
  mctx.fillRect(0, 0, MM_W, MM_H);
  if (!nodes.length) return;

  // Scale all nodes to fit the minimap with a small margin
  const b        = nodeBounds(20);
  const boundsW  = b.maxX - b.minX;
  const boundsH  = b.maxY - b.minY;
  const mmScale  = Math.min((MM_W - 4) / boundsW, (MM_H - 4) / boundsH);
  const originX  = 2 + ((MM_W - 4) - boundsW * mmScale) / 2;
  const originY  = 2 + ((MM_H - 4) - boundsH * mmScale) / 2;

  // World → minimap pixel
  const toMmX = worldX => originX + (worldX - b.minX) * mmScale;
  const toMmY = worldY => originY + (worldY - b.minY) * mmScale;

  // Edges (straight lines at minimap scale — curves aren't worth the cost)
  mctx.strokeStyle = '#2a2820';
  mctx.lineWidth   = 0.5;
  edges.forEach(e => {
    const ep = edgeEP(e);
    if (!ep) return;
    mctx.beginPath();
    mctx.moveTo(toMmX(ep.x1), toMmY(ep.y1));
    mctx.lineTo(toMmX(ep.x2), toMmY(ep.y2));
    mctx.stroke();
  });

  // Nodes
  nodes.forEach(n => {
    const isSelected = sel && sel.type === 'node' && sel.id === n.id;
    mctx.fillStyle   = isSelected ? '#3a3018' : '#1e1e16';
    mctx.strokeStyle = isSelected ? '#c8a84a' : '#3a3428';
    mctx.lineWidth   = 0.5;
    mctx.beginPath();
    mctx.rect(toMmX(n.x), toMmY(n.y), n.w * mmScale, n.h * mmScale);
    mctx.fill();
    mctx.stroke();
  });

  // Viewport rectangle
  mctx.strokeStyle = '#8a7440';
  mctx.lineWidth   = 1;
  mctx.strokeRect(
    toMmX(-panX / zoom), toMmY(-panY / zoom),
    (canvasW() / zoom) * mmScale, (canvasH() / zoom) * mmScale
  );
}

// =============================================================================
// GRAPH OPERATIONS  (add, delete, layout)
// =============================================================================

function deleteSelected() {
  if (!sel) return;
  snapshot();
  if (sel.type === 'node') {
    nodes = nodes.filter(n => n.id !== sel.id);
    edges = edges.filter(e => e.src !== sel.id && e.tgt !== sel.id);
  } else {
    edges = edges.filter(e => e.id !== sel.id);
  }
  clearSelection();
  draw();
}

function clearAll() {
  if (!nodes.length && !edges.length) return;
  snapshot();
  nodes = []; edges = []; nid = 1;
  clearSelection();
  draw();
}

/**
 * Assign nodes to columns by longest-path rank in the DAG, then
 * position them on a grid and fit the viewport.
 */
function autoLayout() {
  if (!nodes.length) return;
  snapshot();

  // Compute column ranks via iterative relaxation (longest path from any root)
  const columnRank = {};
  nodes.forEach(n => { columnRank[n.id] = 0; });
  let changed = true;
  while (changed) {
    changed = false;
    edges.forEach(e => {
      const candidateRank = (columnRank[e.src] || 0) + 1;
      if (candidateRank > (columnRank[e.tgt] || 0)) {
        columnRank[e.tgt] = candidateRank;
        changed = true;
      }
    });
  }

  // Group nodes by column and assign grid positions
  const nodesByColumn = {};
  nodes.forEach(n => {
    const col = columnRank[n.id] || 0;
    (nodesByColumn[col] = nodesByColumn[col] || []).push(n);
  });
  Object.entries(nodesByColumn).forEach(([col, colNodes]) => {
    colNodes.forEach((n, row) => { n.x = 40 + col * 170; n.y = 40 + row * 75; });
  });

  fitView();
}

// =============================================================================

/** Escape HTML special characters for safe innerHTML injection. */
const esc = s => (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

function openNodePanel(n) {
  openPanel();
  document.getElementById('pi').innerHTML = `
<button class="pclose" onclick="clearSelection();draw()">✕ close</button>
<div>
  <div class="pl">label</div>
  <input class="inp" value="${esc(n.label)}" oninput="updateNode(${n.id},'label',this.value)">
</div>
<div>
  <div class="pl">sublabel</div>
  <input class="inp" value="${esc(n.sub)}" placeholder="optional" oninput="updateNode(${n.id},'sub',this.value)">
</div>
<div>
  <div class="pl">description</div>
  <textarea class="inp pta" oninput="updateNode(${n.id},'desc',this.value)" placeholder="Describe this node…">${esc(n.desc)}</textarea>
</div>
<div>
  <div class="pl">metadata</div>
  <div id="pmr"></div>
  <button class="padd" onclick="addMeta(${n.id})">+ add row</button>
</div>
<button class="pdel" onclick="deleteSelected()">Delete node</button>`;
  renderMeta(n);
}

function renderMeta(n) {
  const el = document.getElementById('pmr');
  if (!el) return;
  el.innerHTML = n.meta.map((m, i) => `
<div class="meta-row">
  <input class="inp" style="flex:1" value="${esc(m[0])}" placeholder="key" oninput="updateMeta(${n.id},${i},0,this.value)">
  <input class="inp" style="flex:1" value="${esc(m[1])}" placeholder="val" oninput="updateMeta(${n.id},${i},1,this.value)">
  <button class="pdel" style="padding:3px 6px;margin:0;width:auto" onclick="removeMeta(${n.id},${i})">✕</button>
</div>`).join('');
}

function openEdgePanel(e) {
  openPanel();
  document.getElementById('pi').innerHTML = `
<button class="pclose" onclick="clearSelection();draw()">✕ close</button>
<div>
  <div class="pl">edge label</div>
  <input class="inp" value="${esc(e.label)}" placeholder="optional" oninput="updateEdge(${e.id},'label',this.value)">
</div>
<button class="pdel" onclick="deleteSelected()">Delete edge</button>`;
}

const openPanel  = () => document.getElementById('panel').classList.add('open');
const closePanel = () => document.getElementById('panel').classList.remove('open');

// Panel field updaters — called from inline oninput handlers in the panel HTML
const findNode = id => nodes.find(n => n.id === id);
const findEdge = id => edges.find(e => e.id === id);

function updateNode(id, key, value) { const n = findNode(id); if (n) { n[key] = value; draw(); } }
function updateEdge(id, key, value) { const e = findEdge(id); if (e) { e[key] = value; draw(); } }
function updateMeta(id, i, key, value) { const n = findNode(id); if (n) n.meta[i][key] = value; }
function addMeta(id)       { const n = findNode(id); if (!n) return; snapshot(); n.meta.push(['', '']); renderMeta(n); }
function removeMeta(id, i) { const n = findNode(id); if (!n) return; snapshot(); n.meta.splice(i, 1); renderMeta(n); }

// =============================================================================
// SELF-EXPORT  —  rewrite this HTML file with current data baked in, download it
// =============================================================================

function exportSelf() {
  const title      = document.getElementById('title-bar').value || 'diagram';
  const data       = { title, nodes, edges, nid };
  const serialised = JSON.stringify(data);

  // Splice the new data block and title into our own source HTML
  const source  = document.documentElement.outerHTML;
  const updated = source
    .replace(/const DIAGRAM_DATA = \{.*?\};/s, `const DIAGRAM_DATA = ${serialised};`)
    .replace(/<title>.*?<\/title>/,             `<title>${title}</title>`);

  // Trigger a browser download
  const blob     = new Blob([updated], { type: 'text/html' });
  const anchor   = document.createElement('a');
  const filename = title.replace(/[^a-z0-9_\-\s]/gi, '').trim().replace(/\s+/g, '-').toLowerCase() + '.html';
  anchor.href     = URL.createObjectURL(blob);
  anchor.download = filename;
  anchor.click();
  URL.revokeObjectURL(anchor.href);
}

// =============================================================================
// INIT
// =============================================================================

(function init() {
  nodes = DIAGRAM_DATA.nodes || [];
  edges = DIAGRAM_DATA.edges || [];
  nid   = DIAGRAM_DATA.nid   || 1;

  const titleInput = document.getElementById('title-bar');
  titleInput.value = DIAGRAM_DATA.title || 'untitled diagram';
  document.title   = titleInput.value;
  titleInput.addEventListener('input', () => { document.title = titleInput.value; });

  resize();
  setTimeout(fitView, 50);
  setMode('select');
})();

asperformedthisframe() . the asset and scene default map are authored in blender's input actions panel (the input_actions/ package: properties.py / serialize.py / operators.py , drawn by ui/input_panel.py ) and exported as scene.inputactions + scene.defaultinputmap . levelloader calls inputmanager.loadasset before behaviors are built. map injection ( core/loader/entitybuilder.ts → injectinputmaps ): @inputmap(&quot;name&quot;) on a field → that map; @inputmap() or @inputmap(&quot;&quot;) → scene default; no @inputmap fields → behavior.input receives the scene default. @inputmap stays lowercase like @exposed (blender scans the literal token). if the panel is empty at export, the built-in &quot;player&quot; map is serialized anyway. lifecycle is automatic: level.begin attaches and enables every map, runframe processes actions *before* behaviors and clears device edges in inputmanager.endframe after, dispose detaches. babylon camera key schemes intentionally stay native (cameras consume keycode arrays).","topics":["scripting"]},{"side":"engine","kind":"prose","href":"engine/05-PHYSICS.html","title":"Physics: bodies, constraints, triggers","summary":"05 —  All in subsystems/physics.ts , constraints.ts , triggers.ts . Havok V2 . EnableHavokPhysics(scene) must run before Load . Bodies ( BuildPhysics ) One or more COLLIDER components and/or one RIGID","text":"05 — physics: bodies, constraints, triggers all in subsystems/physics.ts , constraints.ts , triggers.ts . havok v2 . enablehavokphysics(scene) must run before load . bodies ( buildphysics ) one or more collider components and/or one rigidbody → one node-attached physicsbody : collider-only = static/trigger; rigidbody-only = dynamic + auto-fit box; both = shape from collider(s), dynamics from body. multiple colliders (compound body) an entity may carry more than one enabled collider component. export writes each as its own manifest row; at load time classifycomponents collects them all and buildphysics builds a physicsshapecontainer (havok compound shape): each collider becomes a child shape with its own center/size/rotation, material, and trigger flag. one physicsbody , one entity.body ; each collider still gets its own registerattachment row (same body ref). authoring tips (the n-panel shows a compound-body notice when count > 1): prefer manual offsets/sizes per shape — auto-fit colliders each fit the full mesh bounds, which is rarely what you want for head+body volumes. trigger events from every trigger collider are merged onto the one body; entering any child shape can fire any authored reaction. mixed trigger/non-trigger colliders on one entity are allowed (per-child flags); the validator warns because it can be surprising. single-collider paths below are unchanged. motion types manifest bodytype havok physicsmotiontype role static static never moves; still collides (terrain, walls). dynamic dynamic fully simulated — forces, collisions, mass. animated animated driven by animation or code; pushes dynamic bodies and constraints but is not pushed by collisions. use for elevators, moving platforms, or behaviors that set node transforms each frame. mass applies only to dynamic bodies. dynamic bodies may also enable start asleep . center of mass for dynamic rigid bodies only. the collision shape defines contact; center of mass defines how the body tips under gravity and impulses. after the shape is built, applymassproperties calls havok setmassproperties with the authored mass and an optional centerofmass override in the entity's local space. blender manifest runtime auto-fit center of mass (default on) centerofmassautofit: true computelocalbounds(node).center — same owned-mesh aabb rule as collider auto-fit center of mass (when auto-fit off) centerofmassautofit: false , centerofmass: [x,z,−y] custom offset, axis-converted at export like collider center *(field omitted — older levels)* — mass only; havok derives com from the collision shape geometry fit com to bounds snapshots the mesh aabb center into the custom field and turns off auto-fit (same workflow as fit to bounds on colliders). auto-fit com tracks visible mesh geometry, which can differ from a hand-tuned collider — useful when tipping behavior should follow visuals, not collider volume. start asleep dynamic rigid bodies may set startasleep: true ( start asleep in blender). the loader passes this to physicsbody 's startsasleep constructor argument (and physicsaggregate.startasleep on auto-fit mesh paths). bodies begin with physics calculations skipped until a collision or applied force wakes them — a performance hint for scenes where bodies are at rest on load, not a guarantee (nearby awake bodies can wake them). the engine also puts resting bodies to sleep automatically when appropriate. three shape paths for one collider (each its own builder); two or more colliders always use the compound container ( buildcompoundbody → buildcollidershape per row): auto-fit primitive ( buildautofitbody ): real mesh → physicsaggregate sizes it; multi-material wrapper (transformnode, one child mesh per material) → fitcollidershape fits box/sphere/capsule/cylinder to the local bounds, because an aggregate would call gettotalvertices on the non-mesh node and crash. convex / mesh ( buildgeometryshapebody ): real hull/triangle shapes; a wrapper's submeshes are cloned, baked into the wrapper frame, merged ( mergechildrenintolocalmesh ), fed to the shape, then disposed. fitted-box fallback on failure. mesh shapes can't be dynamic (havok) — the validator warns; use convex for movers. manual primitive ( buildmanualshape ): hand-authored babylon-space center/size/radius/height/rotation (converted at export; the blender viewport preview matches). apply object scale is on by default: collider dimensions are multiplied by this entity's local scale at load ( applyobjectscale in the manifest; omit the field or set true). parent scale is already applied through the world transform — only local scale is baked to avoid double-scaling child colliders under a scaled parent. turn off in blender to opt out. manual primitives and auto-fit bounds are multiplied; convex / mesh shapes bake local scale into mesh vertices before the hull/triangle shape is built. the owned-meshes rule <a name=&quot;owned-meshes&quot;></a> two kinds of &quot;children&quot; look identical in the scene graph: gltf material submeshes ( _primitive0… , no guid) and author-parented child entities (have a guid). ownedcollidermeshes(node) includes a descendant only if no node on its path up to the owner carries bjs_id — so a collider spans its own multi-material geometry but never a parented child's. all three shape paths and the hasgeometry check route through it (fixed v0.29.1). why right-handed import <a name=&quot;right-handed&quot;></a> babylon's default left-handed gltf path parents content under a __root__ carrying a reflection (negative-determinant) transform. havok places bodies by decomposing world matrices, and a reflection decomposes like a 180° rotation → mis-oriented colliders (the original kit-breaking bug). levelloader sets userighthandedsystem = true *before* the append, so no mirror exists and one node-attached body path is sound. neutralizegltfroot only warns if a mirrored root reappears. constraints ( buildconstraints ) <a name=&quot;constraints&quot;></a> constraint components become joints in finalizelevel (both bodies must exist): constrainttype havok joint fixed lockconstraint ball ballandsocketconstraint hinge / slider / spring / custom physics6dofconstraint for 6dof types, the constraint frame's x = the authored axis; y/z follow from a perpendicular pair ( computeconstraintframe ). preset mapping: hinge — locks linear + angular_y/z; frees or limits angular_x (degrees→radians). optional velocity motor. slider — locks everything except linear_x (meters). optional motor. spring — locks all rotation + linear y/z; linear_x sprung within limits (stiffness/damping on the limit row). custom — manifest axes[] lists each of the six dofs as free , locked , limited , or spring ( buildcustomaxislimits ). angular limits are authored in degrees, converted at runtime. use for combined joints (e.g. trailer hitch: angular_x free for pitch, linear_y spring for vertical compliance) — stacking two preset constraints on the same body pair over-constrains rotation. computeconstraintframe derives the target-side pivot/axes from live world transforms , pinning the as-placed relative pose — nothing snaps on load. apply object scale is on by default: authored pivot and linear limits are multiplied by the owner's local scale (parent scale comes from the world transform). turn off in blender to opt out. angular limits stay in degrees. motors ( setaxismotortype(velocity) + target + max force) apply to hinge/slider presets only. collision (blender bodies collide , default off) maps to havok's pairwise iscollisionsenabled on the joint — when off, the two connected bodies should not generate contact impulses against each other (overlap can still cause constraint solver fighting; keep colliders separated or use auto-fit sizes that don't intersect). joints land in level.constraints , disposed with the level. trigger messaging ( wiretriggerevents ) <a name=&quot;triggers&quot;></a> trigger colliders may carry authored events (target guid, message, optional tag filter). one havokplugin.ontriggercollisionobservable observer dispatches trigger_entered : trigger body → registration; entering body → metadata.bjsentity ; tag gate; then target.sendmessage(message, enterer) → {{ph4}} . havok gotcha: mesh-shaped triggers never fire (validator warns). observer stored on level.triggerobserver , removed on dispose.","topics":["physics"]},{"side":"engine","kind":"prose","href":"engine/06-RENDERING.html","title":"Rendering: lights, cameras, shadows, scene look","summary":"06 —  Lights ( subsystems/lights.ts ) Automatic — no component. The glb creates and places the light; ApplyBlenderLight copies the lamp's properties onto it. Blender inserts an orientation-correction ","text":"06 — rendering: lights, cameras, shadows, scene look lights ( subsystems/lights.ts ) automatic — no component. the glb creates and places the light; applyblenderlight copies the lamp's properties onto it. blender inserts an orientation-correction node when exporting +y-up, so the guid node is an *ancestor* of the light — findlightfornode walks the whole parent chain. point→point, sun→directional, spot→spot (area unsupported by gltf — validator warns). color exact; intensity approximate (watts don't map cleanly): sun_scale / punctual_scale at the top of the file are the single tuning point. no fallback light — a dark scene means add a lamp in blender. cameras ( subsystems/cameras/ ) mirrors the lights design: the glb creates a faithful freecamera ( findcamerafornode walks parents the same way); applyblendercamera copies clip range and fov/ortho mode; the exporter flags the scene's active camera → scene.activecamera + level.activecamera . faithful playback by default — no controls attached; main.ts adds a fallback arcrotate only when no camera shipped. an opt-in camera component overrides the type via buildtypedcamera , which derives the new camera from the faithful one's world transform (so it starts exactly where blender framed it), copies the lens, then disposes the original. per-type builders: universal (free-fly + key scheme), arc (orbit; optional target re-pivots in the second pass; setposition(eye) keeps the blender framing), follow-orbit (babylon followcamera; useblendertransform derives radius/height/rotationoffset via derivefollowfromposition ), follow-offset (a universalcamera driven each frame by a level.addupdater to hold the exported world offset), geospatial (babylon geospatialcamera for map-like globe navigation — pan, zoom-to-cursor, tilt; the planet mesh must sit at world origin and planet radius must match its radius in scene units; derivegeospatialpose raycasts the exported eye/forward against that sphere to seed center / yaw / pitch / radius ; optional min/max zoom and collision checking). free-fly cameras (free/universal) also honor an optional keep upright toggle ( lockroll ): lockcameraroll bakes the world pose and detaches the glb camera from its orientation-correction parent (so yaw/pitch happen in world space), pins look-at to world up, and drops any residual view-axis roll each frame — keeping the camera level with the horizon. targets resolve with entity references in the loader's second pass ( pipeline step 5 ). geospatial has no deferred target — controls (pointer, wheel, keyboard) attach when attach controls is on. camera component example (geospatial) globe mesh centered at world origin; camera starts at the exported blender pose: { &quot;type&quot;: &quot;camera&quot;, &quot;cameratype&quot;: &quot;geospatial&quot;, &quot;attachcontrol&quot;: true, &quot;planetradius&quot;: 1.0, &quot;lowerradius&quot;: 0.01, &quot;upperradius&quot;: 0, &quot;checkcollisions&quot;: false } planetradius must match the globe mesh radius. lowerradius / upperradius map to babylon's limits.radiusmin / limits.radiusmax ( 0 = no limit). movement tuning ( zoomspeed , flytoasync , clipping behavior, etc.) is available on the runtime camera via the babylon api after load. shadows ( subsystems/shadows.ts ) driven by each lamp's cast shadows toggle; one shadowgenerator per casting light, all geometry registered as caster + receiver. per-light settings: filter (pcf / pcss / poisson / blur esm / hard), bias, normalbias, darkness, mapsize, frustum minz/maxz (set on the *light*; 0 = auto), frustumedgefalloff (directional/spot edge fade), and forcebackfaces (render only back faces into the shadow map — strong acne fix, opt-in because it can leak on thin/open meshes). loader options: { shadows?, shadowmapsize?, freezeshadows?, cleanbonematrixweights? } . exposed as level.shadowgenerators . static-world freeze. the scene's freeze shadows flag (or the freezeshadows loader option) renders each shadow map once then freezes it ( refreshrate_render_once ) — a big perf win that lets you raise the map resolution, valid only when no caster moves. after moving a caster at runtime, call level.refreshshadows() for a one-shot re-render. cleanbonematrixweights scrubs bad skeleton weights on load (fixes garbled shadows on skinned meshes). acne defaults. blender lamps export normalbias = 0 , which leaves suns striped and point/spot edges speckled, so the loader applies a normal-bias floor when a light doesn't set its own (0.02 directional, 0.03 point/spot). it also tightens the shadow depth range automatically, since a stretched depth buffer is the usual cause of acne: directional suns get autocalcshadowzbounds (babylon re-fits minz/maxz to the casters each frame) when clip planes are left at auto; point/spot lights cap shadowmaxz to the lamp's range (set a custom range in blender for this to kick in). explicit clip start/end or normal bias always win over these defaults. scene look ( environment.ts , fog.ts , atmosphere.ts , postprocess.ts ) from the manifest's scene block: clear/ambient color, environment texture → ibl, fog (linear/exp/exp2), physically based atmosphere, and post-processing are applied in await applyscenesettings during finalizelevel (environment loads asynchronously — the skybox is created only after the env texture is ready). applyatmosphere runs immediately after scene settings when the manifest includes an atmosphere block. post-processing is applied after level.begin() so behaviors that create a runtime camera in onstart (e.g. a script-built universalcamera ) receive the stack on the camera that is actually active. environment / ibl ( subsystems/environment.ts ) image-based lighting comes from scene.environmenttexture . without an environment block in the manifest, pbr materials get no cubemap — only direct lamps and the optional ambientcolor fill. authoring (babylon scene › rendering › environment): blender setting manifest runtime world environment texture environment.file copied to env/ when wired to world output → surface (background → env/image texture); orphaned textures in the node editor are ignored default environment environment.usedefault: true loads babylon's built-in studio hdr from the cdn at runtime (no file exported) show skybox environment.createskybox when true , shows the background; when false , ibl only. .env / usedefault use babylon's dds skybox via environmenthelper (large size + infinitedistance ); hdr/equirect use createdefaultskybox skybox ignores fog environment.skyboxignorefog when true (and skybox is on), sets mesh.applyfog = false so scene fog does not wash out the background a world texture always wins over default environment . export copies world textures through copy_asset / save_image_asset with sanitize_asset_filename() (spaces and unsafe characters → url-safe names under env/ ). the same source file always maps to the same export path; live link re-exports overwrite that file rather than suffixing _2 , _3 , … world texture discovery is shared by export and the scene ui in scene/environment.py ( find_world_env_node traces world output → surface → background → env/image only — orphan nodes in the node editor are ignored). usedefault loads babylon's built-in studio .env from the cdn at runtime — the player needs network access. format handling at load: .env (babylon prefiltered cube — recommended) → cubetexture ; .hdr → hdrcubetexture ; anything else → equirectangular. .exr is not loadable in-browser. applyenvironment is async: it awaits whentextureready (30s timeout) before creating a skybox so createdefaultskybox does not clone an empty cube map on the first live link reload. manifest example &quot;environment&quot;: { &quot;usedefault&quot;: true, &quot;intensity&quot;: 1, &quot;rotationy&quot;: 0, &quot;createskybox&quot;: false } with skybox and fog (exports skyboxignorefog when show skybox is on): &quot;environment&quot;: { &quot;usedefault&quot;: true, &quot;intensity&quot;: 1, &quot;rotationy&quot;: 0, &quot;createskybox&quot;: true, &quot;skyboxignorefog&quot;: true } or with an authored world texture: &quot;environment&quot;: { &quot;file&quot;: &quot;env/sky.env&quot;, &quot;intensity&quot;: 1, &quot;rotationy&quot;: 0, &quot;createskybox&quot;: false } omit &quot;environment&quot; (or set it to null ) when neither a world texture nor default environment is configured. skyboxignorefog is only exported when createskybox is true ; older manifests without it keep babylon's default (skybox is fogged). atmosphere ( subsystems/atmosphere.ts ) the babylon atmosphere addon ( @babylonjs/addons/atmosphere ) provides a physically based sky and aerial perspective. it automatically integrates with pbrmaterial for consistent lighting. requires webgl 2 or webgpu — the runtime calls atmosphere.issupported(engine) and logs a warning if unsupported. authoring (babylon scene › atmosphere): blender setting manifest runtime atmosphere (header) atmosphere block (omit when off) new atmosphere(&quot;atmosphere&quot;, scene, [sunlight], options) sun light atmosphere.sunlightid entity guid of a blender sun lamp; omit to use the first exported sun pbr sun intensity atmosphere.pbrsunintensity when true (default), sets the sun's intensity to π for pbrmaterials use luts atmosphere.useluts when true (default), lut-based sky/aerial perspective; false = ray marching multi scattering atmosphere.multiscatteringintensity overall multiple-scattering contribution night ambient atmosphere.minimummultiscatteringintensity floor when the sun is below the horizon ground albedo atmosphere.groundalbedo average ground-reflected light color peak rayleigh / mie / ozone atmosphere.physical.* scattering and absorption tuning (earth-like defaults) origin height (km) atmosphere.physical.originheight scene origin height above the planet surface when atmosphere is enabled, export forces environment.createskybox: false — the atmosphere renders the sky. ibl from a world texture or default environment still loads for material reflections. for best results, enable post-processing › default pipeline (hdr) with tone mapping — the runtime sets islinearspacecomposition from the manifest's postprocessing.defaultpipeline . time of day is driven by the sun lamp's direction in blender (re-export after aiming the sun). the handle lives on level.atmosphere and is disposed with the level. manifest example &quot;atmosphere&quot;: { &quot;pbrsunintensity&quot;: true, &quot;useluts&quot;: true, &quot;multiscatteringintensity&quot;: 1, &quot;minimummultiscatteringintensity&quot;: 0.1, &quot;groundalbedo&quot;: [1, 1, 1], &quot;physical&quot;: { &quot;peakrayleighscattering&quot;: [0.000005802, 0.000013558, 0.0000331], &quot;miescatteringscale&quot;: 1, &quot;ozoneabsorptionscale&quot;: 1, &quot;originheight&quot;: 0 } } omit &quot;atmosphere&quot; (or set it to null ) when the panel header is off. post-processing ( subsystems/postprocess.ts ) handles land on level.post ( postprocessinghandles : pipeline? , ssao? ). use retargetpostprocessing(handles, camera) if gameplay swaps the active camera later (default pipeline only today). when scene.postprocessing.defaultpipeline is true, the runtime builds babylon's defaultrenderingpipeline (hdr on). supported effects: effect manifest keys notes msaa msaasamples (1–8) webgl 2 only; 1 = off fxaa fxaa fast approximate aa on the pipeline texture bloom bloom.{enabled,threshold,intensity,kernel?,scale?} tone mapping auto-enabled when bloom is on (hdr) sharpen sharpen.{enabled,edgeamount?,coloramount?} depth of field depthoffield.{enabled,blurlevel?,focusdistance?,focallength?,fstop?} blurlevel : low / medium / high chromatic aberration chromaticaberration.{enabled,aberrationamount?,radialintensity?,directionx?,directiony?} direction 0,0 → radial grain grain.{enabled,intensity?,animated?} glow layer glow.{enabled,blurkernelsize?,intensity?} emissive-material glow tone mapping tonemapping , tonemappingtype? standard / aces (default) / khr_pbr_neutral exposure / contrast exposure , contrast image-processing pass vignette vignette.{enabled,weight?,stretch?,centerx?,centery?} color grading lut colorgrading.{enabled,file} .3dl or .png under post/ color curves colorcurves.{enabled,globalhue?,…} global / highlights / midtones / shadows ssao ssao , ssaosettings? separate ssao2renderingpipeline ( radius , totalstrength , samples , maxz ) not yet implemented (separate babylon pipelines, not part of the default stack): ssr, taa, motion blur, ibl shadows, frame-graph framegraphvolumetriclightingtask (babylon 9's directional-light volume path; requires a frame graph render pipeline). manifest example &quot;postprocessing&quot;: { &quot;defaultpipeline&quot;: true, &quot;fxaa&quot;: true, &quot;msaasamples&quot;: 4, &quot;bloom&quot;: { &quot;enabled&quot;: true, &quot;threshold&quot;: 0.9, &quot;intensity&quot;: 0.5, &quot;kernel&quot;: 64, &quot;scale&quot;: 0.5 }, &quot;ssao&quot;: true, &quot;ssaosettings&quot;: { &quot;radius&quot;: 2, &quot;totalstrength&quot;: 1, &quot;samples&quot;: 8 }, &quot;tonemapping&quot;: true, &quot;tonemappingtype&quot;: &quot;aces&quot;, &quot;exposure&quot;: 1, &quot;contrast&quot;: 1, &quot;sharpen&quot;: { &quot;enabled&quot;: false, &quot;edgeamount&quot;: 0.3, &quot;coloramount&quot;: 1 }, &quot;depthoffield&quot;: { &quot;enabled&quot;: false, &quot;blurlevel&quot;: &quot;low&quot;, &quot;focusdistance&quot;: 2000, &quot;focallength&quot;: 50, &quot;fstop&quot;: 1.4 }, &quot;chromaticaberration&quot;: { &quot;enabled&quot;: false, &quot;aberrationamount&quot;: 30 }, &quot;grain&quot;: { &quot;enabled&quot;: false, &quot;intensity&quot;: 30, &quot;animated&quot;: false }, &quot;glow&quot;: { &quot;enabled&quot;: false, &quot;blurkernelsize&quot;: 16, &quot;intensity&quot;: 1 }, &quot;vignette&quot;: { &quot;enabled&quot;: false, &quot;weight&quot;: 1.5 }, &quot;colorgrading&quot;: { &quot;enabled&quot;: false, &quot;file&quot;: &quot;post/latesunset.3dl&quot; }, &quot;colorcurves&quot;: { &quot;enabled&quot;: false, &quot;globalhue&quot;: 30 } } omit optional effect blocks when disabled; older manifests with only fxaa / bloom / tonemapping / exposure / contrast still load. blender ui babylon scene › rendering › environment ( ui/scene_panels.py ). default environment (ibl without a world texture), show skybox (ibl-only background when off), and skybox ignores fog (disabled when show skybox is off). the panel previews the texture on the active world output chain via scene/environment.py . babylon scene › atmosphere ( ui/scene_panels.py ). physically based sky settings on scene.bjs_scene.atmosphere ( scene/atmosphere.py ). export serialization is in export/atmosphere.py . babylon scene › post-processing ( ui/post_panels.py ). settings live on scene.bjs_scene.post ( scene/post_processing.py ). export serialization is in export/post_processing.py (lut files copied via copy_asset → post/ ). exposure/contrast export as 1.0 when tone mapping is off so stale panel values do not crush the image.","topics":["rendering"]},{"side":"engine","kind":"prose","href":"engine/07-AUDIO-ANIMATION.html","title":"Audio & Animation","summary":"07 —  Audio ( subsystems/audio.ts ) AUDIO components (file, volume, loop, autoPlay, spatial + maxDistance, playbackRate) become audio engine v2 StaticSound s — the legacy Sound class is deprecated. On","text":"07 — audio & animation audio ( subsystems/audio.ts ) audio components (file, volume, loop, autoplay, spatial + maxdistance, playbackrate) become audio engine v2 staticsound s — the legacy sound class is deprecated. one engine, created lazily ( createaudioengineasync ); sounds via createsoundasync with spatialenabled set at creation (avoids first-use latency), then sound.spatial.attach(entity.node) so 3d sounds follow their entity. sound names = file stem ( audio/door.mp3 → &quot;door&quot; ), reachable via entity.getsound or entity.getattachment(&quot;audio&quot;)?.sound . browser autoplay policy: auto-play sounds await audioengine.unlockasync() (resolves on the first user gesture) without blocking the load — creation promises are collected during the entity pass and settled in finalizelevel so a bad file logs instead of failing the level. the exporter copies sound files into audio/ next to the manifest. sounds are disposed with the level. animation ( subsystems/animation.ts ) nla strips export as gltf animations → global animationgroup s. findanimationgroups scopes them to an entity by membership : a group belongs to a node if any targeted animation targets the node or a descendant — no reliance on globally-unique names. applyautoplayanimations first stops the gltf loader's auto-started groups, then plays each entity's chosen clip (exact name, contains, else first) with its loop/speed. runtime control: entity.animations , entity.getanimation(&quot;walk&quot;)?.start(true) — see the clipswitcher behavior for clip cycling. the skinned-mesh rule (important) for rigged characters, everything goes on the armature object — guid, animation settings, script components. two gltf facts make the mesh object a trap: (1) a skinned mesh's own node transform is *ignored* (joints define the final pose), so a script moving the mesh entity moves nothing visible; (2) skeletal clips target the joint nodes under the armature , so clip scoping on the mesh entity finds zero clips. both failures are silent, so the validator warns when components or autoplay sit on a skinned mesh. (an animation *state machine* was prototyped and deliberately reverted — see development_plan for the revival constraints.)","topics":["audio"]},{"side":"engine","kind":"prose","href":"engine/08-WORKFLOW.html","title":"Workflow & Tooling","summary":"08 —  Live Link <a name=&quot;live-link&quot;></a> The save-to-see loop. Export once (the operator remembers the path per-scene), tick Live Link in Babylon Scene › Export , then every Ctrl+S re-export","text":"08 — workflow & tooling live link <a name=&quot;live-link&quot;></a> the save-to-see loop. export once (the operator remembers the path per-scene), tick live link in babylon scene › export , then every ctrl+s re-exports ( export/live_link.py , a save_post handler — no timers/sockets; failures never break the save). on the runtime side, the vite plugin reloadonlevelexport ( apps/<app>/vite.config.ts ) watches all files under public/levels/ (glb, env/ , audio, manifest, …) and sends a 50ms debounced full reload — not only .scene.json , so a replaced environment image still refreshes when the manifest bytes are unchanged. islevelasset resolves paths with path.resolve because chokidar may report relative paths ( public/levels/... ) without a leading slash. re-exports are idempotent for side files : export_level calls begin_asset_export() ( export/assets.py ) so each save overwrites env/<name>.hdr , audio/… , etc. instead of accumulating _2 , _3 , … copies when the manifest path is unchanged. object visibility <a name=&quot;visibility&quot;></a> blender's outliner has two independent toggles: icon property in the exported level eye hide_viewport present but starts invisible ( bjs_visible: false in gltf extras → node.isvisible = false at load) camera hide_render absent — skipped by _is_renderable in export and use_renderable=true on the gltf exporter use render-disable for editor-only objects that should never ship. use viewport-hide for level content you want present (physics, scripts, references) but off until gameplay or a behavior sets entity.node.isvisible = true . the validator <a name=&quot;validator&quot;></a> export/validate.py , run by the validate button, by export, and by every live link export. checks: missing/empty script files · entity references to render-disabled objects · mesh collider + dynamic body · mesh-shaped triggers (never fire in havok) · trigger events on non-trigger colliders / without a target · mixed trigger/non-trigger colliders on one entity (compound body) · constraints missing a target or physics on either end · components or animation autoplay on a skinned mesh (belongs on the armature — why ) · area lights · duplicate guids · audio file missing · no active camera · input actions (duplicate map/action names, actions with no bindings, @inputmap(&quot;name&quot;) referencing a missing map, scene default map not found). debug build & debug keys the export panel's debug build checkbox writes a top-level &quot;debug&quot; flag into the manifest (missing = true for old manifests) → level.debugenabled . it gates the runtime debug keys in main.ts — c (collider wireframes via physicsviewer) and i (the babylon inspector, lazily imported so it never ships in production bundles) — and the debugcolliders loader option. untick for release exports. babylon launcher <a name=&quot;launcher&quot;></a> tools/babylon-launcher/ ( @bjs/babylon-launcher ) is a local web hub on port 3200 ( npm run launcher:dev ). it lists apps/ projects, starts each app's vite dev server, manages bjs-mcp for cursor, scaffolds new projects, and browses per-level json asset folders. it does not host embedded babylon editors. full reference: launcher docs . typical loop: pick project + level in the hub → start all services → open the runtime preview link → export from blender via live link into apps/<app>/public/levels/<level>/ (path shown in the hub). monorepo & scaffolder see architecture for the layout. daily commands (repo root): npm install (links workspaces) · npm run dev (playground) · npm run dev --workspace apps/<name> · npm run launcher:dev (project hub) · npm run typecheck (tsc over the engine package and the app) · npm run create -- --name my-game [--title &quot;…&quot;] [--level arena] (stamps apps/my-game from the playground template — own main.ts / behaviors /empty public/levels/ ; the engine is not copied, it's the shared symlinked package). the launcher wizard calls the same create-app.mjs script via post /api/projects . versioning & artifacts engine package.json (s) and blender_addon/blender_manifest.toml move in lockstep. two distributables: babylon_level_kit_extension.zip (install in blender) and bjs-level-kit.zip (the repo, sans node_modules). manifest schema is v4 ; additive optional fields don't bump it. manual verification lives in test_plan ; forward work in development_plan .","topics":["start","export"]},{"side":"engine","kind":"prose","href":"engine/09-FEATURE-TRACES.html","title":"Feature Traces","summary":"09 —  The exact file/function chain for each feature, Blender click → runtime effect. Format: blender_addon/… → manifest → packages/engine/src/… . GUID / entity identity core/ids.ensure_object_id (cus","text":"09 — feature traces the exact file/function chain for each feature, blender click → runtime effect. format: blender_addon/… → manifest → packages/engine/src/… . guid / entity identity core/ids.ensure_object_id (custom prop bjs_id ) → gltf node extras → manifest entities[].id → the loader's buildidindex ( core/loader/noderesolution.ts ) reads metadata.gltf.extras.bjs_id (needs extrasasmetadata import) → processentity matches guid-first → entity in level.entities , node gets metadata.bjsentity back-reference. viewport visibility (eye icon) export/level._stamp_viewport_visibility (transient obj[&quot;bjs_visible&quot;] = false when hide_viewport and still renderable) → gltf node extras.bjs_visible → applynodevisibility ( core/loader/noderesolution.ts ) sets node.isvisible = false and disables descendant lights/cameras. render-disabled objects ( hide_render ) never get this far — _is_renderable drops them from glb and manifest. behaviors can toggle entity.node.isvisible at runtime. tag tag component ( components/ → export/components.serialize_components ) → manifest {type:&quot;tag&quot;, tag} → entitybuilder.classifycomponents sets entity.tag and registerattachment({type:&quot;tag&quot;, data}) → query level.bytag(&quot;enemy&quot;) or entity.hasattachment(&quot;tag&quot;) . collider / rigidbody n-panel fields (+ viewport/collider_preview.py wireframe per manual collider, blender space; compound-body notice when count > 1) → serialize_components converts center/size/rotation to y-up (one dict per collider row); apply object scale ( collider_apply_scale → manifest applyobjectscale , default on at runtime via applyobjectscaleenabled in core/nodescale.ts — omit field or true ); constraint rows export the same applyobjectscale flag; dynamic rigid bodies also export centerofmassautofit and optional centerofmass → manifest collider/rigidbody → entitybuilder.classifycomponents collects all colliders → physics.buildphysics : single collider → shape path chosen (auto-fit aggregate | wrapper fit | convex/mesh merge | manual); multiple colliders → physicsshapecontainer compound ( buildcompoundbody ); all geometry gathered via ownedcollidermeshes (excludes child entities by guid) → applymassproperties ( resolvecenterofmass + setmassproperties ) → one physicsbody on the node → entity.body + registerattachment per collider and/or rigidbody row (same body ref when both). sound because of right-handed import ( why ). manual path + scale behavior: 05-physics.md . debug view: c → level.showcolliders → physicsviewer. script + @exposed values &quot;open script…&quot; stores the filename stem; sync → core/script_parse.py regex-reads @exposed fields → bjsexposedvar rows → edits serialize into vars → manifest script → instantiatescripts ( core/loader/entitybuilder.ts ) → behaviorregistry.create(stem) (registered by autoregisterbehaviors from import.meta.glob ) → inject entity / scene → applyexposedvars (coerce vector3/color; entity refs → pendingref ) → registerattachment({type:&quot;script&quot;, data, behavior}) → second pass resolveobjectreferences → level.begin calls onstart . entity reference field object picker ( bjsexposedvar.obj_val ) → ensure_object_id(target) + force-include via iter_referenced_objects → manifest vars.field = guid → pendingref → resolveobjectreferences assigns the entity (or list slot by index) before onstart . light / shadows lamp (auto-derived; no component) → export writes light block (+ shadow when cast shadows) → lights.applyblenderlight (parent-chain find; color exact, intensity scaled) → casting lights collected → shadows.setupshadows in finalizelevel → level.shadowgenerators . camera (+ typed override) camera object → camera block (clip/fov/active) → cameras.applyblendercamera onto the glb freecamera; active → scene.activecamera . camera component → buildtypedcamera per-type builder → target bindings via queuecameratargets (follow / arc / offset only) → second pass resolvecameratargets (follow lockedtarget / arc re-pivot / offset addupdater ). geospatial skips the target pass — buildgeospatialcamera derives center / yaw / pitch / radius from the exported pose and planetradius . atmosphere babylon scene › atmosphere ( ui/scene_panels.py ) edits scene.bjs_scene.atmosphere ( scene/atmosphere.py ) → export/atmosphere.serialize_atmosphere (optional sunlightid guid; scattering tuning) → manifest scene.atmosphere → levelloader.finalizelevel : applyscenesettings (env skybox forced off at export when atmosphere is on) → applyatmosphere ( subsystems/atmosphere.ts : resolves sun → directionallight , optional π intensity for pbr, @babylonjs/addons/atmosphere ) → level.atmosphere (disposed with the level). time of day follows the sun lamp's direction in blender. see rendering — atmosphere . post-processing babylon scene › post-processing ( ui/post_panels.py ) edits scene.bjs_scene.post ( scene/post_processing.py ) → export/post_processing.serialize_post_processing (luts via copy_asset → post/ ) → manifest scene.postprocessing → levelloader.finalizelevel : applyscenesettings (clear/ambient, env, fog) → applyatmosphere (when enabled) → … → level.begin (runtime cameras) → applypostprocessing ( subsystems/postprocess.ts : default pipeline + ssao2 on scene.activecamera ) → level.post . see rendering — scene look . animation autoplay nla strips → export/animation.serialize_animation → animation block → findanimationgroups (node-membership scoping) → applyautoplayanimations (stop loader-auto groups, start chosen clip). skinned characters: author on the armature ( rule ). audio audio component → export/assets.copy_asset → audio/<file> + manifest → audio.applyaudio (engine v2 createsoundasync , spatial attach) → promises settled in finalizelevel ; autoplay waits unlockasync → entity.sounds , registerattachment({type:&quot;audio&quot;, data, sound}) , getsound(stem) . trigger event → onmessage is trigger + on enter events rows ( bjstriggerevent ) → manifest collider.events[{target guid, message, filtertag}] → registration queued in applycomponents → triggers.wiretriggerevents (one ontriggercollisionobservable ) → on trigger_entered: body→entity via metadata.bjsentity , tag gate → target.sendmessage → behavior onmessage . constraint constraint fields → serialize_components (pivot/axis → y-up; target guid force-included; custom also exports axes[] per 6dof row) → constraints.buildconstraints in finalizelevel : computeconstraintframe from live world transforms (pins as-placed pose) → lock/ballandsocket or 6dof with buildaxislimits (presets) or buildcustomaxislimits (custom) → optional applymotor (hinge/slider only) → ownerbody.addconstraint → level.constraints + registerattachment on owner ( {type:&quot;constraint&quot;, data, constraint} ). input action blender input actions panel (maps > actions > bindings + scene default map picker) → input_actions/serialize.serialize_input_asset + defaultinputmap → manifest scene.inputactions / scene.defaultinputmap → inputmanager.loadasset (loader, before behaviors) → @inputmap(&quot;name&quot;) fields injected per behavior; scripts without @inputmap receive the scene default on behavior.input → level.begin → inputmanager.attach (keyboard observable + enable maps); runframe → inputmanager.process first (gamepad poll, actions evaluate, started/performed/canceled fire) → behaviors poll readvalue/readvector2/ispressed/waspressedthisframe → inputmanager.endframe last (edge clear); dispose → detach . live link export remembers path ( scene.bjs_live_link_path ) → ctrl+s → export/live_link._on_save_post → validate + export_level (side files overwrite stable paths via begin_asset_export / unique_asset_path ) → manifest write → vite reloadonlevelexport watches all of public/levels/ ( path.resolve path matching; 50ms debounce) → full page reload. debug build checkbox ( scene.bjs_debug_build ) → manifest top-level &quot;debug&quot; → level.debugenabled (missing = true) → gates c / i in main.ts and the debugcolliders option. 2d gui (gui editor json) gui component ( components/ → export/assets.copy_asset to gui/ ) → manifest {type:&quot;gui&quot;, file, mode, …} → applycomponents queues applygui ( ui/gui2d.ts ) → settletasks in finalizelevel → entity.guitextures , registerattachment({type:&quot;gui&quot;, data, texture}) , getgui(stem) . trace: trace-gui.html . particles (particle / node particle editor json) particle component → export_particle_system ( export/particles.py : copy json, copy particle textures images, patch particletexturesourceblock.url in the exported file) → manifest → applyparticles ( subsystems/particles.ts : resolvenodeparticlesettextureurls + legacy or nodeparticlesystemset ) → mesh emitter or owned vector3 + optional emptyemitter → settletasks → wireparticleemittertracking ( level.particleemittermanager , empties only) → entity.particlesystems , registerattachment , getparticles(stem) . trace: trace-particles.html · blender: ../blender/trace-particles.html . 3d gui (buttons + panels) nine gui3d_* types → serialize_components (layout fields, click events, button images via copy_asset ; click targets force-included) → registrations queued with parentid → buildgui3dcontrols in finalizelevel (panels first, blocklayout , content after addcontrol ) → registerattachment per panel/control → wireclickevents → onmessage on target. trace: trace-gui3d.html · blender: ../blender/trace-gui3d.html . full write-up: 10-ui.md .","topics":["start"]},{"side":"engine","kind":"prose","href":"engine/10-UI.html","title":"UI (2D GUI, particles, MSDF text, 3D GUI)","summary":"10 —  Interactive diagram: [ui.html](ui.html) · Traces: 2D GUI · Particles · MSDF text · 3D GUI runtime · 3D GUI authoring Engine code lives under packages/engine/src/ui/ (2D + 3D GUI + MSDF text) and","text":"10 — ui (2d gui, particles, msdf text, 3d gui) interactive diagram: [ui.html](ui.html) · traces: 2d gui · particles · msdf text · 3d gui runtime · 3d gui authoring engine code lives under packages/engine/src/ui/ (2d + 3d gui + msdf text) and packages/engine/src/subsystems/particles.ts (particle json loading). overview three related but distinct ui/media paths share the same loader pattern: queue async work during the entity pass, settle in {{ph0}} . 3d gui is different — it is fully synchronous but deferred to a post-pass because panels must exist before child controls and click targets must resolve through the finished level . flowchart lr subgraph export [export] gui_json[gui .json] part_json[particle .json] msdf_font[msdf font json + png] gui3d[gui3d_* components] end subgraph manifest [level.scene.json] m_gui[gui component] m_part[particle component] m_msdf[msdf_text component] m_3d[gui3d_* types] end subgraph load [runtime load] apply[applycomponents] final[finalizelevel] gui2d[applygui] part[applyparticles] partwire[wireparticleemittertracking] msdf[applymsdftext] wire[wiremsdftextrendering] build[buildgui3dcontrols] end gui_json --> m_gui part_json --> m_part msdf_font --> m_msdf gui3d --> m_3d m_gui --> apply --> gui2d --> final m_part --> apply --> part --> final --> partwire m_msdf --> apply --> msdf --> final --> wire m_3d --> apply --> build --> final 2d gui ( gui component) authored in blender with a file picker pointing at a layout saved by babylon's gui editor . export copies the json into gui/ via copy_asset (stable sanitized name; re-export overwrites). mode babylon api requirement fullscreen advanceddynamictexture.createfullscreenui any entity node (typically an empty) mesh advanceddynamictexture.createformesh entity node must be a mesh runtime: ui/gui2d.ts → applygui → entity.guitextures + registerattachment . lookup: entity.getattachment(&quot;gui&quot;)?.texture , entity.getgui(&quot;hud&quot;) (file stem) → texture.getcontrolbyname(...) . particles ( particle component) authored with a file picker for a system saved by babylon's particle editor or the node particle editor ( .json with babylon.nodeparticlesystemset ). blender authoring field role particle file .json copied to particles/ on export particle textures (list) optional image overrides (see below) use gpu / auto start / attach to object / max particles runtime options (see manifest) each particle textures row: field role image source file copied into particles/ (supports subpaths via url in json ) url in json filename written into the particle json (e.g. bubble.png , fx/bubble.png ). empty → exported image basename replace url only patch blocks whose current url matches. empty → auto (first empty block, or the only block) export calls export/particles.py → export_particle_system : copies the json, copies texture images, then patches particletexturesourceblock.url in the exported copy (the manifest still only references particles/<stem>.json ). runtime load subsystems/particles.ts → loadparticlesystems (legacy particlesystem / gpu, or nodeparticlesystemset.buildasync ). before build, resolvenodeparticlesettextureurls rewrites bare filenames in the json to absolute urls beside the file ( rooturl ). options: gpu when supported, autostart , attachtoentity , optional capacity override. when attachtoentity is on: entity node emitter follows at runtime mesh the mesh yes (babylon mesh emitter) empty ( transformnode ) owned vector3 on the attachment yes — wireparticleemittertracking copies getabsoluteposition() each frame before particle sim ( level.particleemittermanager ) already-spawned particles still simulate in world space unless the particle file sets islocal: true (local / emitter space in the particle editor). lookup: entity.getattachment(&quot;particle&quot;)?.system , entity.getparticles(&quot;fire&quot;) . msdf text ( msdf_text component) authored in blender with paragraph text , a bmfont font json , and the paired glyph atlas font texture png. generate assets with msdf-bmfont or msdfgen ; export copies both into fonts/ via copy_asset . runtime: ui/msdftext.ts → fontasset (cached per scene) + textrenderer.createtextrendererasync → parent to entity.node → addparagraph with authored align/wrap/stroke/billboard options → entity.textrenderers + registerattachment . after settletasks , wiremsdftextrendering hooks scene.onafterrenderobservable to call renderer.render(view, projection) for every label ( level.msdftextmanager , disposed with the level). lookup: entity.getattachment(&quot;msdf_text&quot;)?.renderer , entity.gettextrenderer(&quot;roboto-regular&quot;) (json file stem). dynamic copy: clearparagraphs() then addparagraph(...) . depends on @babylonjs/addons (peer dep, like @babylonjs/gui ). 3d gui ( gui3d_* components) no external editor — blender is the layout tool. one component per babylon control type : component babylon class role gui3d_button button3d text/image on a 3d plate gui3d_holo holographicbutton mrtk-style + tooltip gui3d_touch_holo touchholographicbutton + xr near-touch gui3d_mesh meshbutton3d entity mesh is the control gui3d_stack stackpanel3d row/column layout gui3d_sphere spherepanel children on a sphere gui3d_cylinder cylinderpanel children on a cylinder gui3d_plane planepanel children on a plane gui3d_scatter scatterpanel randomized scatter layout hierarchy (blender parenting) flowchart tb panel[panel empty\\ngui3d_cylinder] b1[button child\\ngui3d_holo] b2[button child\\ngui3d_button] panel --> b1 panel --> b2 panel -->|buildpanels| bp[babylon panel\\nlinktotransformnode] b1 -->|parentpanel.addcontrol| bc1[control in panel layout] b2 -->|parentpanel.addcontrol| bc2[control in panel layout] bp --> bc1 bp --> bc2 parent button objects under the panel empty (ctrl+p). child transforms express membership only — the panel arranges controls at runtime. standalone buttons (no panel parent) are added to the manager root and linktotransformnode 'd to follow their anchor. gui3d_mesh keeps the mesh's own world placement. click events each button's on click events list (target + message) mirrors trigger collider rows. at runtime wireclickevents subscribes to onpointerclickobservable and calls target.sendmessage(message, buttonentity) — behaviors handle it via onmessage , same as trigger volumes. build order (critical) sequencediagram participant fl as finalizelevel participant b as buildgui3dcontrols participant p as creategui3dpanel participant c as creategui3dcontrol participant a as applycontrolcontent participant w as wireclickevents fl->>b: after buildconstraints b->>p: panels: addcontrol then linktotransformnode b->>c: controls: addcontrol to panel or manager c->>a: content after addcontrol a->>w: click → onmessage babylon silently drops button content set before addcontrol — see ui/gui3d/controls.ts . runtime api level.gui3dmanager — shared manager (disposed with level) entity.controls3d — every control/panel owned by this entity entity.getattachmentsoftype(&quot;gui3d_button&quot;) — component rows with control ref entity.getcontrol3d(&quot;startbutton&quot;) — named after the blender object loader integration in applycomponents ( entitybuilder.ts ): gui → context.guitasks.push(applygui(...)) particle → context.particletasks.push(applyparticles(...)) msdf_text → context.msdftexttasks.push(applymsdftext(...)) gui3d_* → context.gui3dregistrations.push({ entity, component, parentid }) in finalizelevel ( levelloader.ts ): settletasks for audio, gui, particle, and msdf text promises ( allsettled ) wireparticleemittertracking → level.particleemittermanager (when any empty-node emitters exist) wiremsdftextrendering → level.msdftextmanager (when any labels exist) wiretriggerevents buildconstraints buildgui3dcontrols → level.gui3dmanager level.begin() blender add-on concern module component types + fields components/component.py ( bjsparticletexture rows on bjscomponent.particle_textures ) particle texture ui ui/component_draw.py ( _draw_particle_textures ) texture row operators operators/components.py ( bjs.particle_texture_add/remove ) panel + click-event ui ui/component_draw.py ( _draw_click_events ) click row operators operators/components.py ( bjs.gui3d_event_add/remove ) serialize + copy assets export/components.py + export/particles.py ( export_particle_system ) + export/assets.py validation export/validate.py ( _check_media , _check_gui3d )","topics":["ui"]},{"side":"engine","kind":"prose","href":"launcher/00-INDEX.html","title":"Babylon Launcher — Documentation","summary":"The Babylon Launcher ( tools/babylon-launcher/ , npm workspace @bjs/babylon-launcher ) is a small self-hosted web hub for day-to-day work in the monorepo. It discovers apps under apps/ , starts and st","text":"babylon launcher — documentation the babylon launcher ( tools/babylon-launcher/ , npm workspace @bjs/babylon-launcher ) is a small self-hosted web hub for day-to-day work in the monorepo. it discovers apps under apps/ , starts and stops the per-app vite dev server, manages the bjs-mcp behavior-authoring server for cursor, scaffolds new projects, and browses json asset folders next to each level. it does not embed babylon.js editors. author gui, materials, particles, and similar assets with the online babylon editors or your own workflow, then place the exported .json files in the project's asset folders (see projects & assets ). quick start from the repo root: npm install npm run launcher:dev open http://localhost:3200 (override with launcher_port ). production build (serves the compiled react client from dist/client/ ): npm run launcher:build npm run launcher:start chapters launcher — hub ui, services, projects, assets, rest api, and server layout related docs workflow & tooling — live link, validator, monorepo commands architecture — two-artifact export model and repo layout","topics":["start"]},{"side":"engine","kind":"prose","href":"launcher/01-LAUNCHER.html","title":"Babylon Launcher","summary":"01 —  What it is The launcher is a local control panel for Blender2BabylonKit projects. One Express server exposes a JSON REST API and (in development) Vite middleware for the React hub. The hub lets ","text":"01 — babylon launcher what it is the launcher is a local control panel for blender2babylonkit projects. one express server exposes a json rest api and (in development) vite middleware for the react hub. the hub lets you: pick a project and level create a new app from the playground template start/stop the game's vite dev server and open the runtime preview build, start, stop, and copy cursor config for bjs-mcp list json files in per-level asset folders ( gui/ , particles/ , …) nothing in the launcher runs inside the game runtime. it only orchestrates processes and reads/writes files under apps/<name>/ . architecture ┌─────────────────────────────────────────────────────────────┐ │ browser → http://localhost:3200 │ └───────────────────────────┬─────────────────────────────────┘ │ ┌──────────────────┴──────────────────┐ │ express (createapiapp) │ │ /api/* → projects, dev, mcp, assets│ └──────────────────┬──────────────────┘ │ dev: vite middleware (server/dev.ts) → react hub (src/hub/) prod: express.static(dist/client) → prebuilt hub (server/index.ts) piece location role hub ui src/hub/ react panels: project picker, services, assets api client src/api/client.ts fetch wrappers for /api/* rest routes server/api.ts express router project discovery server/projects.ts scan apps/ , dev-server child processes project scaffold server/createproject.ts shell out to scripts/create-app.mjs mcp control server/mcp.ts build/start tools/bjs-mcp asset i/o server/assets.ts list/read/write json under level roots docs server/docs.ts build and serve docs/ at /docs paths & manifest server/paths.ts repo_root , apps_dir , babylon-project.json development ( npm run launcher:dev → server/dev.ts ): api is mounted first, then vite runs in middleware mode so the hub hot-reloads. production ( npm run launcher:start → server/index.ts ): api plus static files from dist/client/ ; unknown paths fall through to index.html . default port: 3200 ( launcher_port env var). each game's vite port comes from that app's babylon-project.json ( dev.port , default 5173 ). hub ui documentation panel repo-wide (not tied to a project). build docs runs npm run docs:build at the repo root, regenerating the interactive html under docs/ (engine diagrams, blender traces, searchable landing page). view docs opens /docs/ on the launcher host — static files are served from docs/ by the same express server. docs are considered built when docs/index.html exists. project panel on load, the hub calls get /api/projects and fills the project dropdown. projects are every directory under apps/ that has a package.json . optional babylon-project.json in the app root supplies display title, default level, dev port, and the blender live link export path hint shown in the ui. the level dropdown lists subdirectories of apps/<project>/public/levels/ , plus a synthetic workspace (pre-export staging) entry ( _workspace in the api), which maps to apps/<project>/public/workspace/ . create project opens a wizard that post s to /api/projects with name , optional title , level , and template ( empty | minimal | sample ). the server runs scripts/create-app.mjs ; sample additionally copies .ts behavior files from apps/playground/src/behaviors/ . services panel polls get /api/services/:app every three seconds. game dev server (vite) — start runs npm run dev --workspace apps/<app> from the repo root as a detached child. the launcher tracks the pid when it spawned the process; it also probes the configured tcp port to detect an already- running server (e.g. started manually). stop sends sigterm to the process group, then on linux runs fuser -k <port>/tcp if the port is still open. open runtime preview links to http://localhost:<dev.port> when the port accepts connections. bjs-mcp (behavior authoring) — build runs npm run mcp:build at the repo root. start launches node tools/bjs-mcp/dist/index.js (builds first if needed). copy cursor config writes the stdio mcp snippet for bjs-level-kit (command, args, cwd) to the clipboard — paste into ~/.cursor/mcp.json . start all services / stop all services call the combined endpoints that run dev + mcp in parallel. assets panel when a project is selected, get /api/projects/:app/assets/:level lists .json files in each known asset folder (see below). the ui is read-only: it shows folder names and filenames. writes go through the rest api ( put ) if you build tooling on top; the hub does not edit files. projects and assets babylon-project.json optional manifest at apps/<name>/babylon-project.json : { &quot;name&quot;: &quot;playground&quot;, &quot;title&quot;: &quot;playground&quot;, &quot;defaultlevel&quot;: &quot;train scene&quot;, &quot;assetfolders&quot;: [&quot;gui&quot;, &quot;particles&quot;, &quot;materials&quot;, &quot;geometry&quot;, &quot;filters&quot;, &quot;render-graphs&quot;], &quot;dev&quot;: { &quot;port&quot;: 5173 }, &quot;blenderexportpath&quot;: &quot;apps/playground/public/levels/&quot; } field purpose name canonical app id (defaults to package.json name or folder name) title display name in the hub defaultlevel level pre-selected when it exists under public/levels/ assetfolders declared in manifest; server uses fixed asset_folders in paths.ts dev.port vite port for start/stop/status blenderexportpath shown as the live link target path in the hub new projects created via create-app.mjs get a manifest with default asset folders and dev.port . level roots and asset folders asset paths resolve through workspaceassetroot() in server/paths.ts : level selector filesystem root _workspace apps/<app>/public/workspace/ <level name> apps/<app>/public/levels/<level>/ under each root, these subfolders are scanned (constants in asset_folders ): folder typical content gui/ gui editor json particles/ node particle system sets ( .json ; image files such as .png can sit beside them but are not listed in the launcher) materials/ node material graphs geometry/ node geometry graphs filters/ smart filter graphs render-graphs/ node render graph json only .json files are listed. writeasset rejects non- .json names. filenames and folder segments are sanitized; resolved paths must stay inside the level root ( ispathinside ). these folders sit beside the exported level.glb and level.scene.json for a level — they are not embedded in the gltf export. the runtime loads them when your game code or manifest references them. rest api all routes are under /api . errors return json { &quot;error&quot;: &quot;message&quot; } with an appropriate status code. health method path response get /api/health { &quot;ok&quot;: true } projects method path description get /api/projects array of projectsummary get /api/projects/:app/levels level directory names post /api/projects body: { name, title?, level?, template? } → 201 + { name, path, blenderexportpath } projectsummary : name , title , defaultlevel? , devport , blenderexportpath , haslevels . assets method path description get /api/projects/:app/assets/:level all folders → filename arrays get /api/projects/:app/assets/:level?folder=gui single folder listing get /api/projects/:app/assets/:level/:folder/:file raw json file body put /api/projects/:app/assets/:level/:folder/:file write json; body string or object → { path, relative } :level is the level folder name or _workspace . dev server method path description lies on process signals to the spawned child. the launcher assumes it runs from a full git checkout with apps/ , scripts/ , and tools/bjs-mcp/ present. it is not a standalone npm package outside this monorepo. source layout tools/babylon-launcher/ index.html # spa shell package.json # @bjs/babylon-launcher vite.config.ts # client build; middlewaremode in dev tsconfig.json # react client tsconfig.server.json # express server → dist/server/ server/ dev.ts # dev entry (vite + api) index.ts # production entry (static + api) api.ts # route table projects.ts # list projects/levels; dev process management createproject.ts # create-app.mjs wrapper mcp.ts # bjs-mcp lifecycle assets.ts # asset list/read/write docs.ts # docs:build + static /docs mount paths.ts # repo paths, manifest types, asset folders src/ main.tsx # react mount api/client.ts # browser api client hub/ app.tsx # main hub layout assetbrowser.tsx # asset listing createprojectwizard.tsx docspanel.tsx # build + view documentation servicespanel.tsx # dev + mcp controls styles/hub.css","topics":["start","export"]}];

(function () {
  var box = document.getElementById('q');
  var out = document.getElementById('results');
  var count = document.getElementById('count');
  var topicBar = document.getElementById('topic-bar');
  var topicBlurb = document.getElementById('topic-blurb');
  var activeTopic = null;

  function topicDef(id) {
    for (var i = 0; i < TOPICS.length; i++) { if (TOPICS[i].id === id) { return TOPICS[i]; } }
    return null;
  }

  function syncUrl() {
    var params = new URLSearchParams(window.location.search);
    if (activeTopic) { params.set('topic', activeTopic); } else { params.delete('topic'); }
    var q = box.value.trim();
    if (q) { params.set('q', q); } else { params.delete('q'); }
    var qs = params.toString();
    history.replaceState(null, '', qs ? ('?' + qs) : window.location.pathname);
  }

  function setTopic(id) {
    activeTopic = id || null;
    Array.prototype.forEach.call(document.querySelectorAll('.topic-card'), function (el) {
      el.classList.toggle('on', el.getAttribute('data-topic') === activeTopic);
    });
    if (topicBlurb) {
      var def = activeTopic ? topicDef(activeTopic) : null;
      topicBlurb.innerHTML = def
        ? '<strong>' + def.label + '</strong> — ' + def.blurb
        : 'Pick a topic above, or search across all docs.';
      topicBlurb.style.display = 'block';
    }
    syncUrl();
    run();
  }

  function expand(tokens) {
    var terms = [];
    tokens.forEach(function (t) {
      terms.push({ term: t, w: 1 });
      var syn = SYN[t];
      if (syn) { syn.forEach(function (s) { terms.push({ term: s, w: 0.5 }); }); }
    });
    return terms;
  }

  function score(entry, terms) {
    var title = entry.title.toLowerCase();
    var summary = entry.summary.toLowerCase();
    var total = 0;
    terms.forEach(function (t) {
      var hit = 0;
      if (title.indexOf(t.term) !== -1) { hit += 10; }
      else if (summary.indexOf(t.term) !== -1) { hit += 4; }
      else if (entry.text.indexOf(t.term) !== -1) { hit += 1; }
      total += hit * t.w;
    });
    return total;
  }

  function inTopic(entry) {
    if (!activeTopic) { return true; }
    return entry.topics && entry.topics.indexOf(activeTopic) !== -1;
  }

  function badge(entry) {
    var side = '<span class="badge ' + entry.side + '">' + entry.side + '</span>';
    var kind = '<span class="badge kind-' + entry.kind + '">' + entry.kind + '</span>';
    return side + kind;
  }

  function card(entry) {
    return '<a class="card ' + entry.side + '" href="' + entry.href + '">' +
      '<div class="card-head">' + badge(entry) +
      '<span class="card-title">' + entry.title + '</span></div>' +
      '<div class="card-sum">' + entry.summary + '</div></a>';
  }

  function group(title, items) {
    if (!items.length) { return ''; }
    return '<h2 class="group">' + title + '</h2>' + items.map(card).join('');
  }

  function byHref(href) {
    for (var i = 0; i < INDEX.length; i++) { if (INDEX[i].href === href) { return INDEX[i]; } }
    return null;
  }

  function startHereSection(def) {
    if (!def || !def.startHere || !def.startHere.length) { return ''; }
    var html = '<h2 class="group">Start here</h2>';
    def.startHere.forEach(function (href) {
      var e = byHref(href);
      if (e) { html += card(e); }
    });
    return html;
  }

  function browsePool() {
    return INDEX.filter(inTopic);
  }

  function browse() {
    var pool = browsePool();
    var def = activeTopic ? topicDef(activeTopic) : null;
    var startHrefs = def ? def.startHere : [];
    var rest = pool.filter(function (e) { return startHrefs.indexOf(e.href) === -1; });

    if (activeTopic) {
      count.textContent = pool.length + ' pages in this topic';
      var diagrams = rest.filter(function (e) { return e.kind !== 'prose'; });
      var prose = rest.filter(function (e) { return e.kind === 'prose'; });
      out.innerHTML = startHereSection(def)
        + group('Diagrams & traces', diagrams)
        + group('Prose chapters', prose);
      return;
    }

    count.textContent = 'Pick a topic above, or search — ' + INDEX.length + ' pages indexed';
    out.innerHTML = '<p class="hint">Select a topic to see curated starting points, or type in the search box.</p>';
  }

  function search(query) {
    var tokens = query.toLowerCase().split(/[^a-z0-9+]+/).filter(Boolean);
    if (!tokens.length) { browse(); return; }
    var terms = expand(tokens);
    var ranked = INDEX.filter(inTopic).map(function (e) { return { e: e, s: score(e, terms) }; })
      .filter(function (r) { return r.s > 0; })
      .sort(function (a, b) { return b.s - a.s; });
    count.textContent = ranked.length + (ranked.length === 1 ? ' match' : ' matches')
      + (activeTopic ? ' in topic' : '');
    if (!ranked.length) {
      out.innerHTML = '<p class="empty">No pages matched "' + query + '"' +
        (activeTopic ? ' in this topic' : '') + '. Try a broader term or clear the topic filter.</p>';
      return;
    }
    var def = activeTopic ? topicDef(activeTopic) : null;
    out.innerHTML = (def ? startHereSection(def) : '')
      + ranked.map(function (r) { return card(r.e); }).join('');
  }

  function run() { syncUrl(); search(box.value); }
  box.addEventListener('input', run);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var first = out.querySelector('a.card');
      if (first) { window.location.href = first.getAttribute('href'); }
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
    chip.addEventListener('click', function () {
      box.value = chip.getAttribute('data-term');
      run();
      box.focus();
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('.topic-card'), function (el) {
    el.addEventListener('click', function () {
      var id = el.getAttribute('data-topic');
      setTopic(activeTopic === id ? null : id);
    });
  });

  var clearBtn = document.getElementById('topic-clear');
  if (clearBtn) {
    clearBtn.addEventListener('click', function () { setTopic(null); });
  }

  var params = new URLSearchParams(window.location.search);
  if (params.get('q')) { box.value = params.get('q'); }
  if (params.get('topic')) { activeTopic = params.get('topic'); }
  Array.prototype.forEach.call(document.querySelectorAll('.topic-card'), function (el) {
    el.classList.toggle('on', el.getAttribute('data-topic') === activeTopic);
  });
  if (topicBlurb) {
    var initDef = activeTopic ? topicDef(activeTopic) : null;
    topicBlurb.innerHTML = initDef
      ? '<strong>' + initDef.label + '</strong> — ' + initDef.blurb
      : 'Pick a topic above, or search across all docs.';
  }
  run();
  box.focus();
})();
</script>

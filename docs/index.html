on.ts rule armature owns it level runtime container entities, byid/bytag, activecamera, constraints, shadowgenerators, debugenabled. begin attaches inputmanager + runs onstart; runframe drives inputmanager.process, onupdate, updaters, inputmanager.endframe. file core/level.ts debug c wireframes / i inspector behaviors your scripts one default-export class per file (filename = registry key). lifecycle: onstart / onupdate(deltaseconds) / ondestroy / onmessage. @exposed fields edited per-object in blender. base scripting/behavior.ts registry behaviorregistry input src/input/ unity input system clone: action maps > actions > bindings. scene asset + defaultinputmap from blender; @inputmap fields and behavior.input injected at load. inputmanager.process/endframe driven by level. module src/input/ panel input actions"},{"side":"engine","kind":"area","href":"engine/blender-addon.html","title":"Blender add-on","summary":"Diagram · Object UI · Data model · Operators · Script parser · Validator · Exporter · Scene block · Animation block · Live Link · level.glb · level.scene.json · audio/ files · Collider preview · Input Actions","text":"blender add-on object ui ui/view3d_panels viewport n-panel 'babylon': component list with per-type fields, light/camera/animation child panels, and a quick export block (export / live link / debug build / validate). scene-wide settings (rendering, fog, atmosphere, post, input actions) live under properties › scene › babylon. kind drawing only entry bjs_pt_components · bjs_pt_export data model components/ component propertygroups in components/: bjscomponent (tag/collider/rigidbody/script/camera/audio/constraint/gui/particle/msdf_text/gui3d_*), exposed vars + list items, trigger/click events, light/shadow/animation settings. guid assignment lives in core/ids.py (id_key = bjs_id). scene render settings in scene/settings.py (scene.bjs_scene): clear/ambient, default environment, show skybox, skybox ignores fog, fog, atmosphere (scene/atmosphere.py) lize.py (built-in player asset when empty). manifest key scene input input_actions/defaults.py when empty animation block export/animation.py per-object nla strip names + autoplay clip/loop/speed. nla_clip_names() also feeds the validator. manifest key entities[].animation source nla strips live link export/live_link.py save_post handler: when the scene checkbox is on, every ctrl+s re-runs validate + export with the remembered path. failures never break the save. also owns the debug build scene property. props bjs_live_link*, bjs_debug_build no timers/sockets level.glb artifact geometry, transforms, hierarchy, materials, lights, cameras, animation clips. guids ride in node extras. consumer babylon gltf importer level.scene.json artifact components, per-light/camera settings, scene block (incl. inputactions + defaultinputmap), animation blocks, debug flag. consumer levelloader version 4 audio/ files artifact sound files copied next to the export so the manifest's relative paths resolve. copied by export/assets.copy_asset collider preview viewport/collider_preview.py gpu wireframe of manual colliders drawn in the viewport, in blender space — matches what export converts, so preview == runtime body. draw spaceview3d post_view input actions input_actions/ scene-level input actions asset: data model (properties.py), json serialize/apply (serialize.py), built-in defaults (defaults.py), operators (operators.py). edited in properties › scene › babylon via ui/input_panel.py (bjs_pt_input_map). first export seeds defaults when empty. modules properties · serialize · operators panel properties › scene › babylon"},{"side":"engine","kind":"area","href":"engine/load-pipeline.html","title":"Load pipeline","summary":"Diagram · EnableHavokPhysics · Load(manifestUrl) · FetchAndValidateManifest · appendSceneAsync · BuildIdIndex · ProcessEntity (loop) · ApplyComponents · QueueCameraTargets · Second pass · FinalizeLevel · Level.Begin · RunFrame · InputManager.LoadAsset","text":"load pipeline enablehavokphysics precondition must run before load — bodies are built during the entity pass. main.ts does this. file subsystems/physics.ts load(manifesturl) core/levelloader.ts the orchestrator; stages live in core/loader/. inputmanager.loadasset runs after manifest fetch. returns level fetchandvalidatemanifest step 1 clear errors for the classic failures: http 404, and the dev server returning index.html (html, not json). output levelmanifest appendsceneasync step 3 — right-handed userighthandedsystem=true is set first so the loader skips the __root__ handedness mirror that broke havok collider placement. neutralizegltfroot stays as a guard. needs the extrasasmetadata import for guids. why see physics page guard negative determinant warn buildidindex step 4 walk transform nodes + meshes; map metadata.gltf.extras.bjs_id → node. match guid first, name fallback processentity (loop) step 5 per manifest entity: resolve node, create entity, back-ref node.metadata.bjsentity, then applycomponents + light/camera processing. light processlightforentity camera processcameraforentity applycomponents per entity classifycomponents sorts the array → buildphysics (collider/body) → registerattachment per tag/collider/rigidbody/script → queue trigger registrations → queue async audio/gui/particle/msdf text tasks → queue gui3d registrations (parent guid for panel nesting) → instantiatescripts (inject entity/scene, applyexposedvars) → injectinputmaps (@inputmap fields + behavior.input fallback; entity refs become pendingrefs). helpers instantiatescripts / injectinputmaps queuecameratargets per entity typed-camera target bindings (follow / arc / offset) queued for the post-pass. from buildtypedcamera result second pass step 6 resolveobjectreferences: entity-typed @exposed fields + list slots get real entities. resolvecameratargets: lockedtarget / re-pivot / offset updater. why two passes targets may not exist yet finalizelevel step 7 setupshadows → applyscenesettings (clear/ambient, env, fog) → applyatmosphere (when scene.atmosphere set; sun → @babylonjs/addons/atmosphere → level.atmosphere) → applyautoplayanimations → settle audio/gui/particle promises (allsettled) → wiretriggerevents → buildconstraints → buildgui3dcontrols → level.begin (onstart, runtime cameras) → applypostprocessing (defaultrenderingpipeline + ssao2 + volumetriclightscatteringpostprocess on active camera) → debugcolliders (gated by debug build). order matters constraints need bodies level.begin core/level.ts attach input, run every behavior's onstart, subscribe runframe to onbeforerender. errors caught per behavior runframe every frame inputmanager.process first (actions evaluate, callbacks fire) → all onupdate(deltaseconds) → registered updaters (offset cams) → inputmanager.endframe last so device edges last one full frame. dispose detach input, dispose sounds/constraints, ondestroy inputmanager.loadasset step 2 load scene.inputactions (built-in player asset when the panel was empty) and scene.defaultinputmap so @inputmap fields and behavior.input can be injected before instantiatescripts. file src/input/inputmanager.ts"},{"side":"engine","kind":"area","href":"engine/scripting.html","title":"Scripting","summary":"Diagram · behaviors/ folder · AutoRegisterBehaviors · BehaviorRegistry · Behavior · @exposed · ApplyExposedVars · Entity · Input · Level","text":"scripting behaviors/ folder one class per file the contract: file named after the class, export default. the filename stem is the registry key blender stores. where apps/<app>/src/behaviors autoregisterbehaviors main.ts wiring import.meta.glob('./behaviors/*') eagerly loads every file; each registers by stem in the behaviorregistry. file scripting/behaviorregistry.ts behaviorregistry name → class maps a script component's name to a behavior class. registers behaviors, not components — tag/collider/etc. are applied directly by the loader. create warns on unknown name behavior scripting/behavior.ts lifecycle: onstart (after refs resolve) / onupdate(deltaseconds) / ondestroy / onmessage(message, source). injected: entity, scene; node getter. pascalcase — a lowercase onstart silently never runs. order cross-entity onstart unspecified @exposed scripting/exposed.ts decorator records field name + ui hints (weakmap). blender regex-parses the source (core/script_parse.py) → single-line literal defaults only; entity fields need type:'entity'; lists start []. stays lowercase: cross-language contract. types float int bool string vector3 color entity enum list applyexposedvars before onstart writes the manifest's stored values onto the instance. vector3/color arrays coerced; entity refs deferred as pendingrefs; entity lists pre-sized with nulls. second pass resolveobjectreferences entity core/entity.ts id/name/node/tag, attachments (live component registry), behaviors, body?, animations, sounds. getattachment / getbehavior / getanimation / getsound (exact then contains), sendmessage → every behavior's onmessage. back-ref node.metadata.bjsentity input src/input/ unity-style: inputmanager owns an asset of action maps > actions > bindings. @inputmap(\"player\") injects a map handle; actions poll (readvalue/readvector2/ispressed/waspressedthisframe) and fire started/performed/canceled. defaults player map · move look jump interact sprint crouch level runs them begin → onstart for all; runframe → inputmanager.process, onupdate for all, then updaters, then inputmanager.endframe; dispose → ondestroy + teardown. file core/level.ts"},{"side":"engine","kind":"area","href":"engine/physics.html","title":"Physics","summary":"Diagram · BuildPhysics · OwnedColliderMeshes · Auto-fit path · Convex/Mesh path · Manual path · Right-handed import · Constraints · Triggers · Behaviors","text":"physics buildphysics dispatch one collider and/or rigidbody → one node-attached physicsbody. collider-only=static/trigger; body-only=dynamic+auto box; both=shape from collider, dynamics from body. bodytype animated→physicsmotiontype.animated; startasleep on dynamic. file subsystems/physics.ts input struct buildbodyinput ownedcollidermeshes the ownership rule includes a descendant mesh only if no node on its path up carries bjs_id — so a collider spans its own multi-material submeshes (_primitiven, no guid) but never a parented child entity's geometry. all paths route through it. fixed in v0.29.1 auto-fit path buildautofitbody real mesh → physicsaggregate sizes the primitive. multi-material wrapper (transformnode) → fitcollidershape fits box/sphere/capsule/cylinder to computelocalbounds (aggregate would crash on a non-mesh node). default when autofit or no collider convex/mesh path buildgeometryshapebody real hull / triangle shapes. wrapper submeshes are cloned, baked into the wrapper frame, merged (mergechildrenintolocalmesh), fed to the shape, disposed. box fallback on failure. mesh can't be dynamic (validator warns). moving bodies use convex manual path buildmanualshape hand-authored center/size/radius/height/rotation, already babylon-space (converted at export; viewport preview matches). rotation box/capsule/cylinder right-handed import why it all works babylon's default lh gltf path adds a mirrored __root__; havok decomposes world matrices and a reflection looks like a 180° rotation → mis-oriented colliders. userighthandedsystem=true before append removes the mirror entirely. where levelloader.load step 2 guard neutralizegltfroot constraints subsystems/constraints.ts constraint components → joints in finalizelevel (both bodies exist). fixed→lock, ball→ballandsocket, hinge/slider/spring/custom→6dof (frame x = authored axis). collision (bodies collide) → iscollisionsenabled on every joint type. custom: manifest axes[] → buildcustomaxislimits (free/locked/limited/spring per dof). frame computeconstraintframe: live world transforms — pins as-placed pose motors velocity + target + max force triggers subsystems/triggers.ts authored on-enter events: one ontriggercollisionobservable; trigger_entered → trigger body→registration, entering body→metadata.bjsentity, tag gate → target.sendmessage. gotcha mesh triggers never fire cleanup level.triggerobserver removed on dispose behaviors consume it entity.body / getattachment(\"collider\") for impulses/velocity; onmessage receives trigger messages; level.constraints for tuning; showcolliders / c key for debug wireframes. see scripting.html"},{"side":"engine","kind":"area","href":"engine/rendering.html","title":"Rendering","summary":"Diagram · Lights · Cameras · BuildTypedCamera · Shadows · Scene look · Level","text":"rendering lights subsystems/lights.ts automatic (no component). glb creates+places; applyblenderlight copies color (exact), intensity (scaled: sun_scale / punctual_scale), spot cone. findlightfornode walks the parent chain (orientation-correction node in between). area unsupported by gltf no fallback light add a lamp cameras subsystems/cameras/ mirrors lights: faithful glb freecamera + applyblendercamera (clip, fov/ortho); exporter flags the active one → scene.activecamera. no controls by default (faithful playback). fallback main.ts arcrotate only if none shipped buildtypedcamera camera component opt-in type override built from the faithful camera's world pose, lens copied, original disposed. per-type builders: universal / arc (re-pivot to target) / follow-orbit (derivefollowfromposition) / follow-offset (addupdater holds world offset) / geospatial (planet at origin; derivegeospatialpose seeds center/yaw/pitch/radius). free-fly cameras honor a keep upright toggle (lockroll): lockcameraroll bakes the world pose, detaches the orientation-correction parent, and pins look-at to world up so yaw/pitch stay level. targets resolve in second pass keep upright lockroll → world-axis rotation shadows subsystems/shadows.ts one shadowgenerator per casting lamp; all geometry caster+receiver. per-light: filter (pcf/pcss/poisson/bluresm/hard), bias, normalbias, darkness, mapsize, frustum minz/maxz on the light, frustumedgefalloff, forcebackfaces. anti-acne defaults: normalbias floor (0.02 sun / 0.03 point-spot) + auto-tightened depth range (autocalcshadowzbounds on suns, shadowmaxz = range on point/spot) when not overridden. static-world freeze (scene flag / freezeshadows) bakes maps once (render_once); level.refreshshadows() re-arms. options { shadows?, shadowmapsize?, freezeshadows?, cleanbonematrixweights? } exposed level.shadowgenerators scene look environment / fog / atmosphere / postprocess await applyscenesettings in finalizelevel: clear/ambient, async applyenvironment (usedefault → babylon cdn studio .env; waits for texture before skybox; createskybox off when atmosphere on or ibl-only; skyboxignorefog → mesh.applyfog = false; .exr impossible), fog linear/exp/exp2. applyatmosphere after scene settings when manifest has scene.atmosphere (@babylonjs/addons/atmosphere; sun lamp; pbr π intensity; luts or ray marching; islinearspacecomposition from hdr post flag) → level.atmosphere. applypostprocessing after begin: defaultrenderingpipeline (msaa, fxaa, bloom, sharpen, dof, chromatic aberration, grain, glow, image processing with tone mapping type / exposure / contrast / vignette / color grading / color curves) + ssao2 + volumetriclightscatteringpostprocess (optional lightsource mesh guid; default billboard when omitted) → level.post. retargetpostprocessing if the active camera changes at runtime. attach active camera after begin blender properties › scene › post-processing level holds the handles activecamera, shadowgenerators, post, atmosphere — all reachable from gameplay code for further tuning. see load-pipeline.html"},{"side":"engine","kind":"area","href":"engine/audio-animation.html","title":"Audio & Animation","summary":"Diagram · AUDIO component · ApplyAudio · Autoplay & unlock · entity.sounds · NLA strips · FindAnimationGroups · ApplyAutoPlayAnimations · Skinned-mesh rule","text":"audio & animation audio component blender file picker (copied to audio/), volume, loop, autoplay, 3d spatial + max distance, playback rate. validator missing file warn applyaudio subsystems/audio.ts audio engine v2: one lazy createaudioengineasync; createsoundasync per component with spatialenabled at creation; spatial.attach(entity.node). names = file stem. legacy sound class deprecated — not used autoplay & unlock browser policy auto-play sounds await audioengine.unlockasync() (first user gesture) without blocking the load — creation promises settle in finalizelevel via allsettled. bad file logs, level still loads entity.sounds runtime getsound('door') → play/stop/pitch from behaviors. disposed with the level. demo messagelogger plays on message nla strips blender strips export as gltf animations → global animationgroups. the animation box sets autoplay clip/loop/speed. block entities[].animation findanimationgroups membership scoping a group belongs to an entity if any targeted animation targets its node or a descendant — no global-name reliance. file subsystems/animation.ts applyautoplayanimations finalizelevel stops the gltf loader's auto-started groups first, then plays each entity's chosen clip (exact → contains → first). runtime control entity.getanimation('walk')?.start() skinned-mesh rule author on the armature gltf skinning ignores the mesh node's transform (joints define the pose) and clips target the joints under the armature — so guid, animation settings, and scripts on the mesh object silently do nothing. validator warns. state machine prototyped + reverted; see development_plan"},{"side":"engine","kind":"area","href":"engine/ui.html","title":"UI (2D GUI, particles, 3D GUI)","summary":"Diagram · GUI component · ApplyGui · PARTICLE component · ApplyParticles · GUI3D_* components · gui3dRegistrations · BuildGui3DControls · WireClickEvents · entity.controls3D · SettleTasks","text":"ui (2d gui, particles, 3d gui) gui component 2d — blender references a .json from babylon's gui editor. fullscreen = hud overlay; mesh = projected onto this entity's mesh surface (needs a mesh). file copied to gui/ next to the export. editor gui.babylonjs.com validator mesh mode needs mesh applygui ui/gui2d.ts createformesh or createfullscreenui, then parsefromurlasync. texture name = file stem → entity.getgui(\"hud\"). queued as an async task during applycomponents. peer dep @babylonjs/gui storage entity.guitextures particle component blender references a .json from babylon's particle editor. gpu toggle, autostart, attachtoentity (mesh or empty position), optional capacity override. file copied to particles/. editor particles.babylonjs.com validator missing file warn applyparticles subsystems/particles.ts particlehelper.parsefromfileasync (gpu when supported). emitter = entity mesh or absolute position clone. queued async; settled in finalizelevel. storage entity.particlesystems lookup getparticles(stem) gui3d_* components 9 control/panel types one component per babylon 3d control: button3d, holographic/touchholographic, meshbutton3d, plus stack/sphere/cylinder/plane/scatter panels. buttons carry on click events (target + message). panels lay out blender child objects. no external editor blender is the editor images gui/ via _copy_asset gui3dregistrations entity pass each gui3d component queued with {entity, component, parentid}. parentid = manifest parent guid so a button finds its panel. built only in finalizelevel (panels + click targets must exist). file loader/context.ts buildgui3dcontrols ui/gui3d/builder.ts one gui3dmanager per level. panels first (addcontrol → linktotransformnode). controls: parent panel addcontrol or manager root + link. blocklayout while batching children. applycontrolcontent after addcontrol. disposal level.gui3dmanager wireclickevents ui/gui3d/events.ts onpointerclickobservable → targetentity.sendmessage(message, buttonentity). same onmessage hook trigger colliders use — zero sender-side code. requires click target guid in manifest entity.controls3d runtime every panel/control created for this entity. getcontrol3d(name) for scripts — exact match, then contains. holographicbutton.text, visibility, hover observables, etc. hierarchy blender parenting = panel children settletasks finalizelevel promise.allsettled for audiotasks, guitasks, particletasks — one bad json logs a warning; the level still loads. file core/levelloader.ts"},{"side":"engine","kind":"area","href":"engine/workflow.html","title":"Workflow & tooling","summary":"Diagram · Live Link loop · Validator · Debug Build · Monorepo · Scaffolder · Versioning & artifacts · Per-app dev server","text":"workflow & tooling live link loop save → see export once (path remembered per scene) → tick live link → ctrl+s re-exports (save_post; begin_asset_export overwrites stable env/audio/gui paths) → vite plugin watches all files under public/levels/ (path.resolve; 50ms debounce) → full reload. manifest written after glb so both are ready. blender export/live_link.py app reloadonlevelexport in vite.config.ts validator catch it at export missing scripts · dangling refs · mesh+dynamic · mesh triggers · events on non-triggers · constraint ends without physics · skinned-mesh components · area lights · duplicate guids · missing audio · no camera. runs validate button / export / live link debug build release gate export-panel checkbox → manifest 'debug' (missing = true) → level.debugenabled → gates the c/i keys and the debugcolliders option. untick for release exports. keys c colliders · i inspector (lazy import) monorepo npm workspaces packages/engine = '@bjs/engine' shared via symlink; apps/* each a game. edit the engine once, every app updates instantly (vite hot-reloads across the link). install npm install at the root only typecheck npm run typecheck scaffolder npm run create -- --name my-game [--title …] [--level …]: stamps apps/my-game from the playground (own main.ts/behaviors/empty public/levels); the engine is not copied. file scripts/create-app.mjs versioning & artifacts lockstep engine package.json(s) ↔ blender_manifest.toml. distributables: extension zip (blender) + repo zip. manifest schema v4. plans test_plan / development_plan in docs/ per-app dev server each app owns one npm run dev --workspace apps/<name> (root npm run dev = playground). imports resolve by node's upward node_modules walk → the root symlink. levels apps/<name>/public/levels/"},{"side":"engine","kind":"trace","href":"engine/trace-physics.html","title":"Physics: collider → Havok body","summary":"From the N-panel checkbox to a body on the node. Authored in Blender space, converted once at export, built at load.","text":"physics: collider → havok body from the n-panel checkbox to a body on the node. authored in blender space, converted once at export, built at load. serialize_components serialize_components — components.py blender_addon/export/components.py export — every component becomes one dict. the collider case converts center (x,y,z)→(x,z,−y), swaps size axes, converts the rotation quaternion, and attaches trigger events. output: the manifest's components array. the manifest (data between the two halves) the manifest (data between the two halves) already babylon-space (y-up). the runtime never converts axes — that happened once, at export. applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load, per entity — classifycomponents sorts them; collider/body pair goes to buildphysics; registerattachment per collider/rigidbody row; the returned physicsbody lands on entity.body. buildphysics buildphysics — physics.ts packages/engine/src/subsystems/physics.ts the dispatcher. in: node + collidercomponent? + rigidbodycomponent? + scene. builds the shared bodybuildinput, picks one of three shape paths, applies dynamics. out: physicsbody | undefined. buildbodyinput buildbodyinput — physics.ts packages/engine/src/subsystems/physics.ts the data every path shares: motion type (static/dynamic/animated), mass (dynamic only), startasleep (dynamic only), material, istrigger, and the geometry facts (ismesh / hasgeometry via the ownership rule below). ownedcollidermeshes ownedcollidermeshes — physics.ts packages/engine/src/subsystems/physics.ts the ownership rule (v0.29.1): include a descendant mesh only if no node on its path up carries bjs_id — multi-material submeshes yes, parented child entities no. buildautofitbody buildautofitbody — physics.ts packages/engine/src/subsystems/physics.ts default path. real mesh → physicsaggregate sizes the primitive. multi-material wrapper → fitcollidershape over computelocalbounds (an aggregate would crash on the non-mesh node). attachshape attachshape — physics.ts packages/engine/src/subsystems/physics.ts shared tail: material + trigger flag onto the shape, then a physicsbody on the node (startsasleep from startasleep). applybodydynamics adds motion type + damping."},{"side":"engine","kind":"trace","href":"engine/trace-exposed.html","title":"Scripting: @exposed field → Blender → behavior instance","summary":"The cross-language round trip: TS source parsed by Python, values stored per-object, applied back onto the instance before OnStart.","text":"scripting: @exposed field → blender → behavior instance the cross-language round trip: ts source parsed by python, values stored per-object, applied back onto the instance before onstart. exposed exposed — exposed.ts packages/engine/src/scripting/exposed.ts runtime declaration — records field name + ui hints in a weakmap at class-definition time. lowercase on purpose: the regex below matches it literally. parse_exposed parse_exposed — script_parse.py blender_addon/core/script_parse.py blender — regex-parses the .ts source (no ts runtime in blender). this is why defaults must be single-line literals. output feeds the bjsexposedvar rows you edit in the panel. _serialize_vars _serialize_vars — components.py blender_addon/export/components.py export — per-object edited values → the script component's vars dict. entity references serialize as the target's guid (target force-included so it exists in the glb). instantiatescripts instantiatescripts — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — registry.create(name) → inject entity/scene → applyexposedvars → registerattachment({type:'script', data, behavior}). entity refs come back as pendingrefs (the target may not exist yet). applyexposedvars applyexposedvars — exposed.ts packages/engine/src/scripting/exposed.ts writes stored values onto the instance: scalars coerced (vector3/color arrays → babylon types), lists per element, entity fields deferred. resolveobjectreferences resolveobjectreferences — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts second pass — every entity exists now; each pendingref's guid resolves via level.byid and the real entity is assigned (or placed into its list slot). then begin → onstart."},{"side":"engine","kind":"trace","href":"engine/trace-trigger.html","title":"Triggers: On-Enter event → OnMessage","summary":"Data-authored gameplay reactions with zero code on the sender side.","text":"triggers: on-enter event → onmessage data-authored gameplay reactions with zero code on the sender side. bjstriggerevent bjstriggerevent — component.py blender_addon/components/component.py authoring — one row: target object + message + optional tag filter, on a trigger collider. applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — a trigger collider with events queues a triggerregistration {sourceentity, events}; wiring waits for finalizelevel (the plugin observable needs physics live). wiretriggerevents wiretriggerevents — triggers.ts packages/engine/src/subsystems/triggers.ts one observer on havokplugin.ontriggercollisionobservable. registrations indexed by trigger body for o(1) dispatch. returns the observer; level removes it on dispose. delivertriggerevents delivertriggerevents — triggers.ts packages/engine/src/subsystems/triggers.ts per trigger_entered: entering body → entity (metadata.bjsentity), tag gate, target lookup by guid, then sendmessage(message, enteringentity). sendmessage sendmessage — entity.ts packages/engine/src/core/entity.ts fan-out to every behavior on the target, each call error-isolated. onmessage onmessage — behavior.ts packages/engine/src/scripting/behavior.ts receive — override in your behavior. source = the entity that entered the volume. see messagelogger.ts / carcontroller.ts."},{"side":"engine","kind":"trace","href":"engine/trace-constraint.html","title":"Constraints: component → Havok joint","summary":"Joints pin the as-placed pose — position things in Blender how they should rest.","text":"constraints: component → havok joint joints pin the as-placed pose — position things in blender how they should rest. serialize_components serialize_components — components.py blender_addon/export/components.py export — the constraint case: pivot/axis → y-up, target guid, collision (bodies collide), preset limits/motor/spring. custom also exports axes[] (six rows: axis id, mode, min/max, stiffness/damping). buildconstraints buildconstraints — constraints.ts packages/engine/src/subsystems/constraints.ts finalize — both bodies exist now. per registration: resolve target, require body on both ends, compute the frame, create, addconstraint, registerattachment on owner, set iscollisionsenabled from manifest collision (all types), optional motor. out: level.constraints. computeconstraintframe computeconstraintframe — constraints.ts packages/engine/src/subsystems/constraints.ts the key math. owner-local pivot/axis → world via live transforms → target-local. pins the current relative pose so nothing snaps on load. buildaxislimits buildaxislimits — constraints.ts packages/engine/src/subsystems/constraints.ts preset 6dof table: frame x = authored axis; hinge frees/limits angular_x (deg→rad), slider/spring free/limit linear_x, spring adds stiffness/damping. dispatches custom to buildcustomaxislimits. buildcustomaxislimits buildcustomaxislimits — constraints.ts packages/engine/src/subsystems/constraints.ts custom — per manifest axes[] row: free (omit), locked (0,0), limited (min/max), spring (+ stiffness/damping). angular limits deg→rad at runtime. applymotor applymotor — constraints.ts packages/engine/src/subsystems/constraints.ts velocity motor on the moving axis: target speed (deg/s→rad/s for hinges) + max force. hinge/slider presets only."},{"side":"engine","kind":"trace","href":"engine/trace-audio.html","title":"Audio: component → positional sound","summary":"Audio engine v2; autoplay negotiates the browser gesture policy without blocking the load.","text":"audio: component → positional sound audio engine v2; autoplay negotiates the browser gesture policy without blocking the load. copy_asset copy_asset — assets.py blender_addon/export/assets.py export — copies the sound file to audio/ with a url-safe name via unique_asset_path; re-exports overwrite the same path (begin_asset_export resets reservations each export_level pass). applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — each audio component queues an applyaudio promise (fetch+decode is async); the entity loop never blocks on sound i/o. applyaudio applyaudio — audio.ts packages/engine/src/subsystems/audio.ts createsoundasync with spatialenabled at creation; spatial.attach(entity.node) so 3d sounds follow. name = file stem. entity.sounds.push + registerattachment. autoplay: void unlockasync().then(play) — fire-and-forget. finalizelevel finalizelevel — levelloader.ts packages/engine/src/core/levelloader.ts promise.allsettled over the audio tasks: a bad file logs a warning; the level still loads. then triggers, constraints, begin. getattachment getattachment — entity.ts packages/engine/src/core/entity.ts runtime — entity.getattachment(\"audio\")?.sound or getattachmentsoftype(\"audio\") for every row. getsound(\"door\") still works by file stem."},{"side":"engine","kind":"trace","href":"engine/trace-load.html","title":"Level load, end to end","summary":"The spine everything above hangs off.","text":"level load, end to end the spine everything above hangs off. load load — levelloader.ts packages/engine/src/core/levelloader.ts the orchestrator: fetch/validate → inputmanager.loadasset (inputactions + defaultinputmap) → right-handed glb append → entity loop → second pass → finalizelevel. returns the level. buildidindex buildidindex — noderesolution.ts packages/engine/src/core/loader/noderesolution.ts guid → node map from metadata.gltf.extras.bjs_id (needs the extrasasmetadata import or this is empty and matching silently falls back to names). processentity processentity — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts per manifest entity: node match (guid first), entity created + registered + back-referenced, components applied, light/camera processed. finalizelevel finalizelevel — levelloader.ts packages/engine/src/core/levelloader.ts shadows → scene look (env, fog, atmosphere when enabled) → animations → settle audio/gui/particle tasks → trigger wiring → constraints → buildgui3dcontrols → begin → applypostprocessing → (debug colliders if the export allows). begin begin — level.ts packages/engine/src/core/level.ts attach inputmanager (enables every action map), run every onstart (error-isolated), subscribe runframe. runframe runframe — level.ts packages/engine/src/core/level.ts every frame: inputmanager.process first (actions evaluate, callbacks fire) → all onupdate(deltaseconds) → updaters (offset cams) → inputmanager.endframe last so device edges last exactly one frame."},{"side":"engine","kind":"trace","href":"engine/trace-atmosphere.html","title":"Atmosphere: SUN lamp → physical sky","summary":"Babylon @babylonjs/addons/atmosphere for sky and aerial perspective; integrates with PBRMaterial.","text":"atmosphere: sun lamp → physical sky babylon @babylonjs/addons/atmosphere for sky and aerial perspective; integrates with pbrmaterial. bjsatmospheresettings bjsatmospheresettings — atmosphere.py blender_addon/scene/atmosphere.py blender — scene.bjs_scene.atmosphere: enable toggle, sun light picker (sun lamp guid), pbr sun intensity, luts vs ray marching, scattering tuning. serialize_atmosphere serialize_atmosphere — atmosphere.py blender_addon/export/atmosphere.py export — scene.atmosphere block (sunlightid, pbrsunintensity, useluts, multiscattering, groundalbedo, physical.*). null when disabled. _check_atmosphere _check_atmosphere — validate.py blender_addon/export/validate.py warns when atmosphere is on but no renderable sun lamp is available (picked sun light or any exported sun). _serialize_environment _serialize_environment — scene.py blender_addon/export/scene.py when atmosphere is enabled, export forces createskybox: false — the addon renders the sky; ibl from world/usedefault still loads. applyatmosphere applyatmosphere — atmosphere.ts packages/engine/src/subsystems/atmosphere.ts load — atmosphere.issupported check; resolve sun → directionallight (guid or first sun); optional π intensity; new atmosphere(scene, [sunlight], options); physical property tuning. finalizelevel finalizelevel — levelloader.ts packages/engine/src/core/levelloader.ts after applyscenesettings: applyatmosphere when manifest.scene.atmosphere is set → level.atmosphere (disposed in level.dispose). islinearspacecomposition follows postprocessing.defaultpipeline."},{"side":"engine","kind":"trace","href":"engine/trace-input.html","title":"Input: key press → action → behavior","summary":"Unity Input System style: the Blender Input Actions panel authors the scene asset (maps > actions > bindings) plus a Scene Default map; the manifest carries inputActions + defaultInputMap; InputManager evaluates every frame.","text":"input: key press → action → behavior unity input system style: the blender input actions panel authors the scene asset (maps > actions > bindings) plus a scene default map; the manifest carries inputactions + defaultinputmap; inputmanager evaluates every frame. serialize_input_asset serialize_input_asset — serialize.py blender_addon/input_actions/serialize.py blender — maps/actions/bindings → scene.inputactions (built-in player asset when the panel is empty). called from export/scene.py alongside defaultinputmap from the scene default picker. serialize_scene serialize_scene — scene.py blender_addon/export/scene.py blender — assembles the manifest scene block: clear/ambient, environment (world output chain via scene/environment.py → env/, or usedefault; createskybox forced off when atmosphere on; skyboxignorefog), fog, atmosphere (export/atmosphere.py), post (via export/post_processing.py — default pipeline, ssao, volumetric light scattering), inputactions, and defaultinputmap. default_input_asset default_input_asset — defaultasset.ts packages/engine/src/input/defaultasset.ts runtime fallback when a manifest omits inputactions — keep in sync with blender_addon/input_actions/defaults.py. load load — levelloader.ts packages/engine/src/core/levelloader.ts load — inputmanager.loadasset(manifest.scene.inputactions ?? default, defaultinputmap) runs before the glb append so maps exist when behaviors are built. injectinputmaps injectinputmaps — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts @inputmap(\"name\") / @inputmap() fields get map handles; scripts with no @inputmap receive the scene default on behavior.input — all before onstart. process process — inputmanager.ts packages/engine/src/input/inputmanager.ts called by level.runframe before behaviors: poll the gamepad, evaluate every enabled map's actions, fire started/performed/canceled. process process — inputaction.ts packages/engine/src/input/inputaction.ts per action: resolve bindings (most-actuated wins), advance the button/value/passthrough phase machine, set the per-frame edge flags polling reads. resolvebinding resolvebinding — inputbinding.ts packages/engine/src/input/inputbinding.ts raw browser tokens: keyboard keys, gamepad button/axis/stick indices, and 1daxis/2dvector composites built from part bindings. onupdate onupdate — inputmover.ts apps/playground/src/behaviors/inputmover.ts consumer — polls move/sprint off the injected map and subscribes to jump's performed callback in onstart; no key codes anywhere in gameplay code."},{"side":"engine","kind":"trace","href":"engine/trace-livelink.html","title":"Live Link: Ctrl+S → browser reload","summary":"The iteration loop.","text":"live link: ctrl+s → browser reload the iteration loop. _on_save_post _on_save_post — live_link.py blender_addon/export/live_link.py blender — save_post handler: checkbox on + path remembered → validate + export. failures log; the save never breaks. reloadonlevelexport reloadonlevelexport — vite.config.ts apps/playground/vite.config.ts app — vite plugin watches all files under public/levels/ (glb, env/, manifest, …); islevelasset uses path.resolve for chokidar paths; 50ms debounced full reload so replaced hdrs refresh even when .scene.json bytes are unchanged."},{"side":"engine","kind":"trace","href":"engine/trace-gui.html","title":"2D GUI: JSON layout → AdvancedDynamicTexture","summary":"File-backed HUDs and in-world mesh UI from Babylon's GUI Editor.","text":"2d gui: json layout → advanceddynamictexture file-backed huds and in-world mesh ui from babylon's gui editor. copy_asset copy_asset — assets.py blender_addon/export/assets.py export — the gui .json is copied to gui/ with a sanitized stable name; re-exports overwrite the same file. applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — each gui component queues an applygui promise (fetch+parse is async); the entity loop never blocks on ui i/o. applygui applygui — gui2d.ts packages/engine/src/ui/gui2d.ts fullscreen → createfullscreenui; mesh → createformesh on the entity node. parsefromurlasync loads the layout. name = file stem. registerattachment after guitextures.push. finalizelevel finalizelevel — levelloader.ts packages/engine/src/core/levelloader.ts settletasks over guitasks (allsettled): a bad json logs a warning; the level still loads. runs alongside audio and particle settlement. getattachment getattachment — entity.ts packages/engine/src/core/entity.ts runtime — entity.getattachment(\"gui\")?.texture or getgui(\"hud\")?.getcontrolbyname(\"score\") (exact name, then contains)."},{"side":"engine","kind":"trace","href":"engine/trace-particles.html","title":"Particles: JSON system → emitter","summary":"File-backed particle systems from Babylon's Particle Editor.","text":"particles: json system → emitter file-backed particle systems from babylon's particle editor. copy_asset copy_asset — assets.py blender_addon/export/assets.py export — the particle .json is copied to particles/ with a stable sanitized name; re-exports overwrite. applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — each particle component queues an applyparticles promise; gpu mode is requested when supported. applyparticles applyparticles — particles.ts packages/engine/src/subsystems/particles.ts particlehelper.parsefromfileasync. attachtoentity: mesh emitter or absolute position clone for empties. autostart calls system.start(). registerattachment after particlesystems.push. finalizelevel finalizelevel — levelloader.ts packages/engine/src/core/levelloader.ts settletasks over particletasks before triggers/constraints/3d gui. bad file → warn, level continues. getattachment getattachment — entity.ts packages/engine/src/core/entity.ts runtime — entity.getattachment(\"particle\")?.system or getparticles(\"fire\") for stem lookup."},{"side":"engine","kind":"trace","href":"engine/trace-msdfText.html","title":"MSDF text: font assets → TextRenderer","summary":"Resolution-independent 3D labels via @babylonjs/addons TextRenderer.","text":"msdf text: font assets → textrenderer resolution-independent 3d labels via @babylonjs/addons textrenderer. copy_asset copy_asset — assets.py blender_addon/export/assets.py export — bmfont json + glyph atlas png copied to fonts/ with stable sanitized names; re-exports overwrite. applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — each msdf_text component queues an applymsdftext promise (font fetch + async shader compile). applymsdftext applymsdftext — msdftext.ts packages/engine/src/ui/msdftext.ts fontasset cached per scene; textrenderer.createtextrendererasync; parent = entity.node; addparagraph with authored options. registerattachment after textrenderers.push. finalizelevel finalizelevel — levelloader.ts packages/engine/src/core/levelloader.ts settletasks over msdftexttasks, then wiremsdftextrendering → level.msdftextmanager (onafterrenderobservable draw pass). gettextrenderer gettextrenderer — entity.ts packages/engine/src/core/entity.ts runtime — entity.getattachment(\"msdf_text\")?.renderer or gettextrenderer(\"roboto-regular\") by json stem; clearparagraphs/addparagraph for dynamic copy."},{"side":"engine","kind":"trace","href":"engine/trace-gui3d.html","title":"3D GUI: components → GUI3DManager","summary":"In-scene buttons and panels authored as individual GUI3D_* components; Blender parenting defines panel hierarchy.","text":"3d gui: components → gui3dmanager in-scene buttons and panels authored as individual gui3d_* components; blender parenting defines panel hierarchy. serialize_components serialize_components — components.py blender_addon/export/components.py export — gui3d_* cases: text/image/tooltip/panel layout fields; button images via copy_asset; click events as {target guid, message}. click targets force-included via iter_referenced_objects for guid assignment. applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — gui3d components don't build yet; each registration carries parentid (manifest parent guid) for panel lookup. buildgui3dcontrols buildgui3dcontrols — builder.ts packages/engine/src/ui/gui3d/builder.ts finalize — after constraints. buildpanels (addcontrol → linktotransformnode → registerattachment) → batch controls with blocklayout → applycontrolcontent → wireclickevents. returns level.gui3dmanager. applycontrolcontent applycontrolcontent — controls.ts packages/engine/src/ui/gui3d/controls.ts the babylon ordering contract: content/text/image must be set after addcontrol or it is silently lost. meshbutton3d wraps the entity mesh. wireclickevents wireclickevents — events.ts packages/engine/src/ui/gui3d/events.ts each on click row: onpointerclickobservable → level.byid(target) → sendmessage(message, buttonentity) → behavior onmessage. getattachment getattachment — entity.ts packages/engine/src/core/entity.ts runtime — entity.getattachmentsoftype(\"gui3d_holo\") for component rows; getcontrol3d(\"startbutton\") for stem lookup."},{"side":"blender","kind":"area","href":"blender/index.html","title":"Add-on overview","summary":"Diagram · __init__.py · core/ · components/ · scene/ · input_actions/ · operators/ · ui/ · export/ · viewport/","text":"add-on overview __init__.py registration extension entry point. register()/unregister() call each subpackage's register() in dependency order — components & scene first (their propertygroups are referenced everywhere), then input_actions, export, operators, ui, viewport. reloads submodules so edits land mid-session. blender 4.2+ extension order data → ui core/ ids + ts parsing pure helpers, nothing registered. ids.py owns id_key ('bjs_id') and ensure_object_id(); script_parse.py regex-reads @exposed(...) and @inputmap(\"...\") from behavior typescript — the cross-language contract. files ids · script_parse components/ per-object data the component model on every object: bjscomponent (one group switched by comp_type), exposed vars + list items, trigger/click events, light-shadow & animation blocks, and the copy/paste clipboard. constants.py isolates every enum table. key class bjscomponent on object.bjs_components scene/ scene settings bjsscenesettings on scene.bjs_scene: clear/ambient, environment (world texture via scene/environment.py find_world_env_node, or usedefault flag via use_default_environment), show skybox (ibl without visible background when off; forced off when atmosphere on), skybox ignores fog (mesh.applyfog = false when on), fog, atmosphere (scene/atmosphere.py — sun lamp, scattering), freeze shadows; post-processing lives on the nested bjs_scene.post block (scene/post_processing.py) — msaa, fxaa, bloom, ssao, volumetric light scattering, image processing (tone mapping type, exposure, contrast, vignette, color grading, curves), sharpen, dof, chromatic aberration, grain, glow. on scene.bjs_scene.post input_actions/ input actions asset the asset end-to-end: data model (maps/actions/bindings), the built-in player defaults, json serialize/apply (+ friendly-key aliases), and every bjs.input_* operator. export keys inputactions + defaultinputmap operators/ the verbs component verbs (add/remove/duplicate/move/copy/cut/paste, assign guid, fit collider, pin inspector), exposed-list items (add, resize-to-count, add-selected for entity lists), script pick + sync, and validate / export. pure behavior — every ui button routes here, and the stack verbs resolve their target through core/inspector.py so they honor the pin. export op bjs_ot_export ui/ panels + menus all presentation. viewport 'babylon' n-panel = the selected object — or a pinned object — with components + light/camera/animation child panels + quick export. properties › scene 'babylon' = scene-wide (rendering, fog, atmosphere, post-processing sub-panels via post_panels.py, input actions, export). both export blocks share draw_export_controls(). object n-panel scene properties › scene export/ the pipeline the output half. level.py orchestrates the glb + schema-v4 manifest (begin_asset_export resets copy reservations each pass); components / datablocks / animation / scene serialize each block (blender→babylon axis swap happens here); assets.py copies media with stable sanitized names (re-export overwrites; _2 only on same-pass collision); validate.py pre-flights; live_link.py re-exports on ctrl+s. output glb + scene.json schema v4 viewport/ viewport gizmo gpu overlays. collider_preview.py draws manual colliders in the 3d view in blender space, so the preview matches the body export produces. draw post_view handler"},{"side":"blender","kind":"area","href":"blender/data-model.html","title":"Data model","summary":"Diagram · ensure_object_id · BJSComponent · BJSExposedVar · BJSListItem · BJSTriggerEvent · sync_exposed_vars · BJSLightShadow / BJSAnimationSettings · copy_component","text":"data model ensure_object_id guid assignment stamps a unique bjs_id custom property on an object (and re-issues duplicates). this is what promotes a plain object into an addressable entity. id_key is defined here (core/ids.py) and imported by the runtime so both halves agree on the key. prop obj['bjs_id'] file core/ids.py bjscomponent one group, many faces a single propertygroup holding fields for every component type, switched by comp_type (tag/collider/rigidbody/script/camera/audio/constraint/gui/particle/gui3d_*). one collection of these lives on every object (obj.bjs_components). switch comp_type enum file components/component.py bjsexposedvar script values one per @exposed field on a script component: name, type, and the value (float/bool/string/vector/color/entity/enum/list). list vars also own list_items, list_count (typed resize), and show_expanded (per-list collapse, independent of the component header). object & enum changes fire update callbacks. lives in comp.vars file components/exposed_vars.py bjslistitem list elements elements of an exposed list field (e.g. entity lists). add_list_item seeds the right value type; the parent var's list_count get/set lets you type a length instead of clicking +, and bjs.list_add_selected drops every selected object into an entity list at once. ui/component_draw.py draws each list in its own collapsible box. lives in var.items file components/exposed_vars.py bjstriggerevent on-enter / on-click rows trigger collider on enter reactions and 3d gui button on click reactions: target object + message (+ optional tag filter for triggers). serialized into collider.events or gui3d events[]. lives in comp.trigger_events / gui3d_events file components/component.py sync_exposed_vars reconcile given freshly parsed @exposed fields, add new vars / drop removed ones / keep existing values. called by the sync operator (operators/scripts.py) and on script-path change. pairs with core/script_parse file components/exposed_vars.py bjslightshadow / bjsanimationsettings per-object blocks shadow parameters per lamp; autoplay clip/loop/speed + the nla strip list per object. on object file components/object_settings.py copy_component clipboard deep-copies one component group to another (copy/cut/paste, duplicate). _copy_props handles the field-by-field clone. used by paste/duplicate ops file components/clipboard.py"},{"side":"blender","kind":"area","href":"blender/export.html","title":"Export pipeline","summary":"Diagram · export_level · _dedupe_entity_ids · _ensure_entity_ids · _export_glb · _build_manifest · serialize_components · _serialize_vars · serialize_light / serialize_camera · serialize_scene","text":"export pipeline export_level orchestrator the entry the export operator and live link both call. begin_asset_export → dedupe guids → ensure guids → write glb → build manifest → attach debug flag → write .scene.json. returns (glb, json, entity count). file export/level.py _dedupe_entity_ids step 1 copy-pasted objects share a guid; this re-issues fresh ones so identity stays unique. file export/level.py _ensure_entity_ids step 2 assign guids to everything addressable (components, lights, cameras) and every referenced object, so refs always resolve. must run before the glb so extras carry the ids. file export/level.py _export_glb step 3 invokes blender's gltf exporter (+y-up, guids in node extras, cameras/lights/animation included). file export/level.py _build_manifest step 4 per renderable object: serialize components, light, camera, animation. plus the scene block. the schema-v4 dict that becomes .scene.json. file export/level.py serialize_components per object one dict per component. converts collider center/size/rotation and constraint pivot/axis to babylon y-up; attaches trigger events; copies gui/particle json and 3d button images via copy_asset; serializes gui3d_* layout and click events. axis conv here file export/components.py _serialize_vars per script exposed values → vars dict; entity refs become target guids. refs guid strings file export/components.py serialize_light / serialize_camera auto blocks derived from the lamp/camera datablock (no component needed); the active camera is flagged. no component auto file export/datablocks.py serialize_scene scene block clear/ambient, environment (world output chain → env/ via scene/environment.py, or usedefault when default environment is on; createskybox forced off when atmosphere on; skyboxignorefog), fog, atmosphere (export/atmosphere.py), post (export/post_processing.py; luts → post/), inputactions + defaultinputmap. file export/scene.py"},{"side":"blender","kind":"trace","href":"blender/trace-export.html","title":"Export: scene → glb + manifest","summary":"What Export Level (and every Live Link save) actually runs, top to bottom.","text":"export: scene → glb + manifest what export level (and every live link save) actually runs, top to bottom. bjs_ot_export blender_addon/operators/export_ops.py the operator behind the export button (an exporthelper, so it shows a file dialog). execute() runs the validator for warnings, then calls export_level with the chosen path. export_level blender_addon/export/level.py the orchestrator. begin_asset_export (stable side-file paths) → dedupe + ensure guids (before the glb so extras carry them) → write the glb → build the manifest → attach the debug build flag → write .scene.json. returns (glb, json, count). _ensure_entity_ids blender_addon/export/level.py guids for everything addressable and everything referenced (so an entity/constraint/trigger target always exists in the glb to point at). _build_manifest blender_addon/export/level.py walks renderable objects; per object emits components + light + camera + animation blocks, plus the scene block. the schema-v4 dict. serialize_components blender_addon/export/components.py the core converter: one dict per component, with all blender→babylon axis conversion (collider center/size/rotation, constraint pivot/axis) happening here, once."},{"side":"blender","kind":"trace","href":"blender/trace-guid.html","title":"GUID identity: object → entity","summary":"How a Blender object becomes an addressable runtime entity.","text":"guid identity: object → entity how a blender object becomes an addressable runtime entity. ensure_object_id blender_addon/core/ids.py stamps obj['bjs_id'] (id_key). having a guid is what makes an object an entity; pure geometry without one just rides in the glb. _referenced_ids blender_addon/export/level.py collects guids that must exist because something points at them: entity fields, camera/constraint/trigger targets, vls light source — so references never dangle. _dedupe_entity_ids blender_addon/export/level.py duplicated objects (shift+d) inherit the same custom prop; this detects collisions and re-issues fresh guids before export."},{"side":"blender","kind":"trace","href":"blender/trace-exposed.html","title":"@exposed: TypeScript → Blender fields","summary":"The editor side of the cross-language contract — parsing behavior source into editable widgets.","text":"@exposed: typescript → blender fields the editor side of the cross-language contract — parsing behavior source into editable widgets. parse_exposed blender_addon/core/script_parse.py entry: read a behavior .ts file, scan its @exposed decorators, return field descriptors (name, type, default, options). no ts runtime — pure regex, hence the single-line-literal rule. _scan_decorators blender_addon/core/script_parse.py finds each `@exposed(...)` and the field it annotates, capturing the option blob and the field name + default expression. _parse_default blender_addon/core/script_parse.py turns a literal default ([0,1,0], 5, \"idle\", true) into a python value of the right type for the blender property. bjs_ot_sync_vars blender_addon/operators/scripts.py the sync button: re-parse the script and reconcile the component's vars (add new, drop removed, keep existing values). sync_exposed_vars blender_addon/components/exposed_vars.py the reconcile itself — the function sync and the script-path callback share."},{"side":"blender","kind":"trace","href":"blender/trace-validate.html","title":"Validation: catching silent failures","summary":"The checks that run on Validate, Export, and every Live Link save.","text":"validation: catching silent failures the checks that run on validate, export, and every live link save. validate_scene blender_addon/export/validate.py the entry: iterate objects, run every per-object check, collect warnings, plus scene-wide checks (duplicate guids, active camera). _check_physics blender_addon/export/validate.py example check: a mesh-shaped collider can't be a dynamic body in havok — warn before it silently fails at runtime. _check_skinned_meshes blender_addon/export/validate.py the skinned-mesh trap: components/animation on a skinned mesh do nothing (its node transform is ignored; clips target the armature's joints). warn to move them to the armature. _check_constraints blender_addon/export/validate.py a joint needs a physics body on both ends or it won't exist at runtime — warn if either is missing. custom: six axis rows expected; min ≤ max on limited/spring rows. _check_atmosphere blender_addon/export/validate.py when atmosphere is on: sun light must be a renderable sun lamp, or at least one exported sun must exist in the scene."},{"side":"blender","kind":"trace","href":"blender/trace-input.html","title":"Input Actions: panel → manifest","summary":"How the scene-level Input Actions asset and Scene Default map reach the runtime.","text":"input actions: panel → manifest how the scene-level input actions asset and scene default map reach the runtime. bjs_pt_input_map blender_addon/ui/input_panel.py the input actions editor — now a child panel under properties › scene › babylon (was the n-panel). scene default picker, maps/actions/bindings editor, load/save .inputactions.json. draw logic is a reusable mixin. serialize_input_asset blender_addon/input_actions/serialize.py maps/actions/bindings → scene.inputactions (built-in player asset when the panel is empty). lives with its inverse (apply_input_asset) and the friendly-key aliases. serialize_scene blender_addon/export/scene.py writes scene.defaultinputmap alongside inputactions — the map scripts without @inputmap receive on behavior.input. _check_input_map blender_addon/export/validate.py duplicate map/action names, actions without bindings, @inputmap refs without a matching map, and a scene default that doesn't exist. parse_input_maps blender_addon/core/script_parse.py regex-scans behavior sources for @inputmap(\"name\") so sync / validate can create and check map references."},{"side":"blender","kind":"trace","href":"blender/trace-livelink.html","title":"Live Link: Ctrl+S → re-export","summary":"The save-to-see loop, Blender side (the browser reload is in the runtime packet).","text":"live link: ctrl+s → re-export the save-to-see loop, blender side (the browser reload is in the runtime packet). _on_save_post blender_addon/export/live_link.py a @persistent save_post handler: after every .blend save, re-export each scene that opted in. _do_live_export blender_addon/export/live_link.py re-validate + re-export to the remembered path. wrapped so a failed export logs to the console but never breaks the user's save."},{"side":"blender","kind":"trace","href":"blender/trace-collider-preview.html","title":"Collider preview: the viewport gizmo","summary":"How manual colliders are drawn in the 3D view so the preview matches the exported body.","text":"collider preview: the viewport gizmo how manual colliders are drawn in the 3d view so the preview matches the exported body. _draw blender_addon/viewport/collider_preview.py the post_view draw handler: for each object with a manual collider, build its wireframe in blender space and batch it to the gpu. _local_geometry blender_addon/viewport/collider_preview.py produces the shape's edge geometry (box/sphere/capsule/cylinder) in the object's local space — the same center/size/rotation export will convert, so preview == runtime."},{"side":"blender","kind":"trace","href":"blender/trace-gui3d.html","title":"3D GUI: authoring → manifest","summary":"How nine GUI3D_* component types serialize and validate before export.","text":"3d gui: authoring → manifest how nine gui3d_* component types serialize and validate before export. bjscomponent blender_addon/components/component.py authoring — one propertygroup, many faces. gui3d_* types share gui3d_text/image/tooltip/events and panel layout fields. membership sets gui3d_controls / gui3d_panels / gui3d_textured (in components/constants.py) classify draw + export branches. _draw_click_events blender_addon/ui/component_draw.py the on click events box for 3d controls — same target+message ui as trigger colliders, wired to bjs.gui3d_event_add/remove operators. serialize_components blender_addon/export/components.py gui3d_* cases emit type-specific fields; button images copied via copy_asset to gui/; click-event targets yielded by iter_referenced_objects for guid assignment. _check_gui3d blender_addon/export/validate.py mesh button on non-mesh, panel without button children, click events without targets, missing button image files. _check_media blender_addon/export/validate.py gui (missing json, mesh mode on non-mesh) and particle (missing json) checks run alongside 3d gui validation."}];
const SYN = {"collision":["collider","physics","rigidbody","body","havok"],"collide":["collider","physics"],"collider":["physics","rigidbody","havok","shape"],"physics":["collider","rigidbody","havok","body"],"rigidbody":["physics","body","dynamic"],"sound":["audio","spatial"],"audio":["sound","spatial"],"joint":["constraint","hinge","spring","6dof"],"joints":["constraint"],"constraint":["joint","hinge","spring","6dof","motor"],"ui":["gui","button","panel","hud"],"gui":["ui","button","panel","hud"],"hud":["gui","ui"],"button":["gui","gui3d","control"],"key":["input","keyboard","binding"],"keyboard":["input","binding"],"gamepad":["input","controller","binding"],"controller":["input","gamepad"],"input":["action","binding","inputmap","keyboard","gamepad"],"save":["live link","livelink","reload","ctrl+s"],"reload":["live link","livelink","hot reload"],"light":["lights","shadow","rendering","lamp"],"lighting":["lights","shadow","rendering"],"shadow":["shadows","lights"],"camera":["cameras","view"],"animation":["nla","clip","animationgroup","armature"],"animate":["animation","clip"],"particle":["particles","emitter"],"particles":["particle","emitter"],"msdf":["text","label","font","bmfont","signed distance"],"text":["msdf","label","gui"],"export":["glb","manifest","serialize","scene.json"],"import":["loader","glb","append"],"script":["behavior","exposed","scripting"],"scripting":["behavior","exposed","script"],"behavior":["script","scripting","lifecycle"],"exposed":["script","behavior","field","vars"],"trigger":["onmessage","event","collision"],"message":["onmessage","trigger","sendmessage"],"guid":["id","identity","entity","bjs_id"],"identity":["guid","id","entity"],"load":["loader","levelloader","pipeline"],"loading":["loader","pipeline"],"validate":["validation","validator","warning","checks"],"validation":["validate","validator","checks"],"tag":["tag","bytag"],"fog":["scene","environment","rendering","skybox","atmosphere"],"environment":["skybox","ibl","rendering","default environment","skyboxignorefog","atmosphere"],"skybox":["environment","rendering","ibl","fog","atmosphere"],"ibl":["environment","skybox","rendering","default environment","atmosphere"],"atmosphere":["sky","aerial perspective","sun","rayleigh","scattering","rendering","environment"],"rayleigh":["atmosphere","scattering","sky"],"scattering":["atmosphere","mie","rayleigh","sky"]};
(function () {
  var box = document.getElementById('q');
  var out = document.getElementById('results');
  var count = document.getElementById('count');

  function expand(tokens) {
    var terms = [];
    tokens.forEach(function (t) {
      terms.push({ term: t, w: 1 });
      var syn = SYN[t];
      if (syn) { syn.forEach(function (s) { terms.push({ term: s, w: 0.5 }); }); }
    });
    return terms;
  }

  function score(entry, terms) {
    var title = entry.title.toLowerCase();
    var summary = entry.summary.toLowerCase();
    var total = 0;
    terms.forEach(function (t) {
      var hit = 0;
      if (title.indexOf(t.term) !== -1) { hit += 10; }
      else if (summary.indexOf(t.term) !== -1) { hit += 4; }
      else if (entry.text.indexOf(t.term) !== -1) { hit += 1; }
      total += hit * t.w;
    });
    return total;
  }

  function badge(entry) {
    var side = '<span class="badge ' + entry.side + '">' + entry.side + '</span>';
    var kind = '<span class="badge kind">' + entry.kind + '</span>';
    return side + kind;
  }

  function card(entry) {
    return '<a class="card ' + entry.side + '" href="' + entry.href + '">' +
      '<div class="card-head">' + badge(entry) +
      '<span class="card-title">' + entry.title + '</span></div>' +
      '<div class="card-sum">' + entry.summary + '</div></a>';
  }

  function group(title, items) {
    if (!items.length) { return ''; }
    return '<h2 class="group">' + title + '</h2>' + items.map(card).join('');
  }

  function browse() {
    count.textContent = INDEX.length + ' pages';
    var eng = INDEX.filter(function (e) { return e.side === 'engine'; });
    var bl = INDEX.filter(function (e) { return e.side === 'blender'; });
    out.innerHTML = group('Engine (runtime)', eng) + group('Blender (add-on)', bl);
  }

  function search(query) {
    var tokens = query.toLowerCase().split(/[^a-z0-9+]+/).filter(Boolean);
    if (!tokens.length) { browse(); return; }
    var terms = expand(tokens);
    var ranked = INDEX.map(function (e) { return { e: e, s: score(e, terms) }; })
      .filter(function (r) { return r.s > 0; })
      .sort(function (a, b) { return b.s - a.s; });
    count.textContent = ranked.length + (ranked.length === 1 ? ' match' : ' matches');
    if (!ranked.length) {
      out.innerHTML = '<p class="empty">No pages matched "' + query + '". Try a broader term like "physics" or "input".</p>';
      return;
    }
    out.innerHTML = ranked.map(function (r) { return card(r.e); }).join('');
  }

  function run() { search(box.value); }
  box.addEventListener('input', run);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var first = out.querySelector('a.card');
      if (first) { window.location.href = first.getAttribute('href'); }
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
    chip.addEventListener('click', function () {
      box.value = chip.getAttribute('data-term');
      run();
      box.focus();
    });
  });

  var params = new URLSearchParams(window.location.search);
  if (params.get('q')) { box.value = params.get('q'); }
  run();
  box.focus();
})();
</script>

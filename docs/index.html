gechildrenintolocalmesh), fed to the shape, disposed. box fallback on failure. mesh can't be dynamic (validator warns). moving bodies use convex manual path buildmanualshape hand-authored center/size/radius/height/rotation, already babylon-space (converted at export; viewport preview matches). no mesh sampling — uses authored dimensions only. rotation box/capsule/cylinder right-handed import why it all works babylon's default lh gltf path adds a mirrored __root__; havok decomposes world matrices and a reflection looks like a 180° rotation → mis-oriented colliders. userighthandedsystem=true before append removes the mirror entirely. where before appendsceneasync guard neutralizegltfroot enablehavokphysics precondition must run before load — buildphysics warns if the havok plugin is missing. main.ts calls this once at startup. file subsystems/physics.ts constraints subsystems/constraints.ts constraint components → joints in finalizelevel (both bodies exist). fixed→lock, ball→ballandsocket, hinge/slider/spring/custom→6dof (frame x = authored axis). collision (bodies collide) → iscollisionsenabled on every joint type. custom: manifest axes[] → buildcustomaxislimits (free/locked/limited/spring per dof). frame computeconstraintframe: live world transforms — pins as-placed pose motors velocity + target + max force triggers subsystems/triggers.ts authored on-enter events: one ontriggercollisionobservable; trigger_entered → trigger body→registration, entering body→metadata.bjsentity, tag gate → target.sendmessage. gotcha mesh triggers never fire cleanup level.triggerobserver removed on dispose behaviors consume it entity.body / getattachment(\"collider\") for impulses/velocity; onmessage receives trigger messages; level.constraints for tuning; showcolliders / c key for debug wireframes. see scripting.html","topics":["physics"]},{"side":"engine","kind":"area","href":"engine/rendering.html","title":"Rendering","summary":"Diagram · Lights · Cameras · BuildTypedCamera · Shadows · Scene look · Level","text":"rendering lights subsystems/lights.ts automatic (no component). glb creates+places; applyblenderlight copies color (exact), intensity (scaled: sun_scale / punctual_scale), spot cone. findlightfornode walks the parent chain (orientation-correction node in between). area unsupported by gltf no fallback light add a lamp cameras subsystems/cameras/ mirrors lights: faithful glb freecamera + applyblendercamera (clip, fov/ortho); exporter flags the active one → scene.activecamera. without a camera component override, the exported camera is used directly. fallback main.ts arcrotate only if none shipped buildtypedcamera camera component opt-in type override built from the faithful camera's world pose, lens copied, original disposed. per-type builders: universal / arc (re-pivot to target) / follow-orbit (derivefollowfromposition) / follow-offset (addupdater holds world offset) / geospatial (planet at origin; derivegeospatialpose seeds center/yaw/pitch/radius). free-fly cameras honor a keep upright toggle (lockroll): lockcameraroll bakes the world pose, detaches the orientation-correction parent, and pins look-at to world up so yaw/pitch stay level. targets resolve in second pass keep upright lockroll → world-axis rotation shadows subsystems/shadows.ts finalizelevel (setupshadows): one shadowgenerator per casting lamp; all geometry caster+receiver. per-light filter, bias, normalbias, darkness, mapsize, frustum tuning. static-world freeze (scene flag / freezeshadows) bakes maps once; level.refreshshadows() re-arms. options { shadows?, shadowmapsize?, freezeshadows?, cleanbonematrixweights? } exposed level.shadowgenerators scene look environment / fog / atmosphere / postprocess await applyscenesettings in finalizelevel: clear/ambient, async applyenvironment (usedefault → babylon cdn studio .env; waits for texture before skybox; createskybox off when atmosphere on or ibl-only; skyboxignorefog → mesh.applyfog = false; .exr impossible), fog linear/exp/exp2. applyatmosphere after scene settings when manifest has scene.atmosphere (@babylonjs/addons/atmosphere; sun lamp; pbr π intensity; luts or ray marching; islinearspacecomposition from hdr post flag) → level.atmosphere. applypostprocessing after begin: defaultrenderingpipeline (msaa, fxaa, bloom, sharpen, dof, chromatic aberration, grain, glow, image processing with tone mapping type / exposure / contrast / vignette / color grading / color curves) + ssao2 → level.post. retargetpostprocessing if the active camera changes at runtime. attach active camera after begin blender babylon scene › post-processing level holds the handles activecamera, shadowgenerators, post, atmosphere — all reachable from gameplay code for further tuning. see load-pipeline.html","topics":["rendering"]},{"side":"engine","kind":"area","href":"engine/audio-animation.html","title":"Audio & Animation","summary":"Diagram · AUDIO component · ApplyAudio · Autoplay & unlock · entity.sounds · NLA strips · FindAnimationGroups · ApplyAutoPlayAnimations · Skinned-mesh rule","text":"audio & animation audio component blender file picker (copied to audio/), volume, loop, autoplay, 3d spatial + max distance, playback rate. validator missing file warn applyaudio subsystems/audio.ts audio engine v2: one lazy createaudioengineasync; createsoundasync per component with spatialenabled at creation; spatial.attach(entity.node). queued in applycomponents; promises settled in finalizelevel. names = file stem. legacy sound class deprecated — not used autoplay & unlock browser policy auto-play sounds await audioengine.unlockasync() (first user gesture) without blocking the load — creation promises settle in finalizelevel via allsettled. bad file logs, level still loads entity.sounds runtime getsound('door') → play/stop/pitch from behaviors. disposed with the level. demo messagelogger plays on message nla strips blender strips export as gltf animations → global animationgroups. the animation box sets autoplay clip/loop/speed. block entities[].animation findanimationgroups membership scoping a group belongs to an entity if any targeted animation targets its node or a descendant — no global-name reliance. file subsystems/animation.ts applyautoplayanimations finalizelevel stops the gltf loader's auto-started groups first, then plays each entity's chosen clip (exact → contains → first). runtime control entity.getanimation('walk')?.start() skinned-mesh rule author on the armature gltf skinning ignores the mesh node's transform (joints define the pose) and clips target the joints under the armature — so guid, animation settings, and scripts on the mesh object silently do nothing. validator warns. state machine prototyped + reverted; see development_plan","topics":["audio"]},{"side":"engine","kind":"area","href":"engine/ui.html","title":"UI (2D GUI, particles, MSDF, 3D GUI)","summary":"Diagram · GUI component · ApplyGui · PARTICLE component · export_particle_system · ApplyParticles · WireParticleEmitterTracking · GUI3D_* components · gui3dRegistrations · …","text":"ui (2d gui, particles, msdf, 3d gui) gui component 2d — blender references a .json from babylon's gui editor. fullscreen = hud overlay; mesh = projected onto this entity's mesh surface (needs a mesh). file copied to gui/ next to the export. editor gui.babylonjs.com validator mesh mode needs mesh applygui ui/gui2d.ts createformesh or createfullscreenui, then parsefromurlasync. texture name = file stem → entity.getgui(\"hud\"). queued as an async task during applycomponents. peer dep @babylonjs/gui storage entity.guitextures particle component blender references a .json from babylon's particle or node particle editor. gpu, autostart, attachtoentity, capacity. particle textures list: copy images + patch json url on export. editor particles.babylonjs.com validator missing file warn export_particle_system export/particles.py copy particle json + particle textures images into particles/; patch particletexturesourceblock.url in the exported json (url in json / replace url). export serialize_components images beside json applyparticles subsystems/particles.ts loadparticlesystems + resolvenodeparticlesettextureurls (rooturl). attachtoentity: mesh or owned vector3 + emptyemitter. queued async; settled in finalizelevel. storage entity.particlesystems lookup getparticles(stem) wireparticleemittertracking subsystems/particles.ts after settletasks: collectemptyparticleemitters → level.particleemittermanager. each frame (insertfirst onbeforerender) copies getabsoluteposition() into the owned vector3 emitter for empty nodes. meshes use mesh emitter directly disposal level.particleemittermanager gui3d_* components 9 control/panel types one component per babylon 3d control: button3d, holographic/touchholographic, meshbutton3d, plus stack/sphere/cylinder/plane/scatter panels. buttons carry on click events (target + message). panels lay out blender child objects. no external editor blender is the editor images gui/ via _copy_asset gui3dregistrations entity pass each gui3d component queued with {entity, component, parentid}. parentid = manifest parent guid so a button finds its panel. built only in finalizelevel (panels + click targets must exist). file loader/context.ts buildgui3dcontrols ui/gui3d/builder.ts one gui3dmanager per level. panels first (addcontrol → linktotransformnode). controls: parent panel addcontrol or manager root + link. blocklayout while batching children. applycontrolcontent after addcontrol. disposal level.gui3dmanager wireclickevents ui/gui3d/events.ts onpointerclickobservable → targetentity.sendmessage(message, buttonentity). same onmessage hook trigger colliders use — zero sender-side code. requires click target guid in manifest entity.controls3d runtime every panel/control created for this entity. getcontrol3d(name) for scripts — exact match, then contains. holographicbutton.text, visibility, hover observables, etc. hierarchy blender parenting = panel children settletasks finalizelevel promise.allsettled for audiotasks, guitasks, particletasks, msdftexttasks — one bad json logs a warning; the level still loads. particle and msdf wire hooks run immediately after. file core/levelloader.ts msdf_text component blender bmfont json + glyph atlas png copied to fonts/ with stable names. resolution-independent 3d labels via @babylonjs/addons textrenderer. export copy_asset → fonts/ validator missing font files applymsdftext ui/msdftext.ts fontasset cached per scene; textrenderer.createtextrendererasync; parent = entity.node. queued async during applycomponents. storage entity.textrenderers lookup gettextrenderer(stem) wiremsdftextrendering ui/msdftext.ts after settletasks: collecttextrenderers → level.msdftextmanager (onafterrenderobservable draw pass). disposal level.msdftextmanager behaviors onmessage target wireclickevents and trigger colliders both fan out to behavior.onmessage(message, source) — zero sender-side gameplay code. see scripting.html","topics":["ui"]},{"side":"engine","kind":"area","href":"engine/workflow.html","title":"Workflow & tooling","summary":"Diagram · Live Link loop · Validator · Debug Build · Monorepo · Scaffolder · Versioning & artifacts · Per-app dev server · Runtime load","text":"workflow & tooling live link loop save → see export once (path remembered per scene) → tick live link → ctrl+s re-exports (save_post; begin_asset_export overwrites stable env/audio/gui paths) → vite plugin watches all files under public/levels/ (path.resolve; 50ms debounce) → full reload. manifest written after glb so both are ready. blender export/live_link.py app reloadonlevelexport in vite.config.ts validator catch it at export missing scripts · dangling refs · mesh+dynamic · mesh triggers · events on non-triggers · constraint ends without physics · skinned-mesh components · area lights · duplicate guids · missing audio · no camera · input actions (duplicate names, empty bindings, bad @inputmap, missing scene default). runs validate button / export / live link debug build release gate export-panel checkbox → manifest 'debug' (missing = true) → level.debugenabled → gates the c/i keys and the debugcolliders option. untick for release exports. keys c colliders · i inspector (lazy import) monorepo npm workspaces packages/engine = '@bjs/engine' shared via symlink; apps/* each a game. edit the engine once, every app updates instantly (vite hot-reloads across the link). install npm install at the root only typecheck npm run typecheck scaffolder npm run create -- --name my-game [--title …] [--level …]: stamps apps/my-game from the playground (own main.ts/behaviors/empty public/levels); the engine is not copied. file scripts/create-app.mjs versioning & artifacts lockstep engine package.json(s) ↔ blender_manifest.toml. distributables: extension zip (blender) + repo zip. manifest schema v4. plans test_plan / development_plan in docs/ per-app dev server each app owns one npm run dev --workspace apps/<name> (root npm run dev = playground). imports resolve by node's upward node_modules walk → the root symlink. levels apps/<name>/public/levels/ runtime load main.ts levelloader.load after browser reload. debugenabled from manifest gates c/i keys and the debugcolliders loader option. file packages/engine/src/core/levelloader.ts","topics":["start","export"]},{"side":"engine","kind":"trace","href":"engine/trace-physics.html","title":"Physics: collider → Havok body","summary":"From the N-panel checkbox to a body on the node. Authored in Blender space, converted once at export, built at load. Multiple colliders on one entity become a PhysicsShapeContainer compound body.","text":"physics: collider → havok body from the n-panel checkbox to a body on the node. authored in blender space, converted once at export, built at load. multiple colliders on one entity become a physicsshapecontainer compound body. serialize_components serialize_components — components.py blender_addon/export/components.py export — every enabled component becomes one dict. each collider row converts center (x,y,z)→(x,z,−y), swaps size axes, converts the rotation quaternion, and attaches trigger events. output: the manifest's components array (multiple collider rows allowed). the manifest (data between the two halves) the manifest (data between the two halves) already babylon-space (y-up). two collider rows on one entity are intentional — the runtime combines them. applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load, per entity — classifycomponents collects all collider rows into colliders[]; buildphysics builds one body (compound when length > 1); registerattachment per collider/rigidbody row; trigger events from all trigger colliders are merged. buildphysics buildphysics — physics.ts packages/engine/src/subsystems/physics.ts the dispatcher. in: node + collidercomponent[] + rigidbodycomponent? + scene. single collider → one of three shape paths; multiple → buildcompoundbody (physicsshapecontainer). out: physicsbody | undefined. buildcompoundbody buildcompoundbody — physics.ts packages/engine/src/subsystems/physics.ts two or more colliders: each buildcollidershape → configurecollidershape (material + trigger per child) → container.addchild → one physicsbody on the node. buildbodyinput buildbodyinput — physics.ts packages/engine/src/subsystems/physics.ts the data every path shares: motion type (static/dynamic/animated), mass (dynamic only), startasleep (dynamic only), material, colliders[], and the geometry facts (ismesh / hasgeometry via the ownership rule below). ownedcollidermeshes ownedcollidermeshes — physics.ts packages/engine/src/subsystems/physics.ts the ownership rule (v0.29.1): include a descendant mesh only if no node on its path up carries bjs_id — multi-material submeshes yes, parented child entities no. buildautofitbody buildautofitbody — physics.ts packages/engine/src/subsystems/physics.ts default path. real mesh → physicsaggregate sizes the primitive. multi-material wrapper → fitcollidershape over computelocalbounds (an aggregate would crash on the non-mesh node). attachshape attachshape — physics.ts packages/engine/src/subsystems/physics.ts shared tail: material + trigger flag onto the shape, then a physicsbody on the node (startsasleep from startasleep). applybodydynamics adds motion type + damping.","topics":["physics"]},{"side":"engine","kind":"trace","href":"engine/trace-exposed.html","title":"Scripting: @exposed field → Blender → behavior instance","summary":"The cross-language round trip: TS source parsed by Python, values stored per-object, applied back onto the instance before OnStart.","text":"scripting: @exposed field → blender → behavior instance the cross-language round trip: ts source parsed by python, values stored per-object, applied back onto the instance before onstart. exposed exposed — exposed.ts packages/engine/src/scripting/exposed.ts runtime declaration — records field name + ui hints in a weakmap at class-definition time. lowercase on purpose: the regex below matches it literally. parse_exposed parse_exposed — script_parse.py blender_addon/core/script_parse.py blender — regex-parses the .ts source (no ts runtime in blender). this is why defaults must be single-line literals. output feeds the bjsexposedvar rows you edit in the panel. _serialize_vars _serialize_vars — components.py blender_addon/export/components.py export — per-object edited values → the script component's vars dict. entity references serialize as the target's guid (target force-included so it exists in the glb). instantiatescripts instantiatescripts — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — registry.create(name) → inject entity/scene → applyexposedvars → registerattachment({type:'script', data, behavior}). entity refs come back as pendingrefs (the target may not exist yet). applyexposedvars applyexposedvars — exposed.ts packages/engine/src/scripting/exposed.ts writes stored values onto the instance: scalars coerced (vector3/color arrays → babylon types), lists per element, entity fields deferred. resolveobjectreferences resolveobjectreferences — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts second pass — every entity exists now; each pendingref's guid resolves via level.byid and the real entity is assigned (or placed into its list slot). then begin → onstart.","topics":["scripting"]},{"side":"engine","kind":"trace","href":"engine/trace-trigger.html","title":"Triggers: On-Enter event → OnMessage","summary":"Data-authored gameplay reactions with zero code on the sender side.","text":"triggers: on-enter event → onmessage data-authored gameplay reactions with zero code on the sender side. bjstriggerevent bjstriggerevent — component.py blender_addon/components/component.py authoring — one row: target object + message + optional tag filter, on a trigger collider. applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — trigger colliders with events queue a triggerregistration {sourceentity, events}; events from multiple trigger colliders on one entity are merged; wiring waits for finalizelevel (the plugin observable needs physics live). wiretriggerevents wiretriggerevents — triggers.ts packages/engine/src/subsystems/triggers.ts one observer on havokplugin.ontriggercollisionobservable. registrations indexed by trigger body for o(1) dispatch. returns the observer; level removes it on dispose. delivertriggerevents delivertriggerevents — triggers.ts packages/engine/src/subsystems/triggers.ts per trigger_entered: entering body → entity (metadata.bjsentity), tag gate, target lookup by guid, then sendmessage(message, enteringentity). sendmessage sendmessage — entity.ts packages/engine/src/core/entity.ts fan-out to every behavior on the target, each call error-isolated. onmessage onmessage — behavior.ts packages/engine/src/scripting/behavior.ts receive — override in your behavior. source = the entity that entered the volume. see messagelogger.ts / carcontroller.ts.","topics":["physics","scripting"]},{"side":"engine","kind":"trace","href":"engine/trace-constraint.html","title":"Constraints: component → Havok joint","summary":"Joints pin the as-placed pose — position things in Blender how they should rest.","text":"constraints: component → havok joint joints pin the as-placed pose — position things in blender how they should rest. serialize_components serialize_components — components.py blender_addon/export/components.py export — the constraint case: pivot/axis → y-up, target guid, collision (bodies collide), preset limits/motor/spring. custom also exports axes[] (six rows: axis id, mode, min/max, stiffness/damping). buildconstraints buildconstraints — constraints.ts packages/engine/src/subsystems/constraints.ts finalize — both bodies exist now. per registration: resolve target, require body on both ends, compute the frame, create, addconstraint, registerattachment on owner, set iscollisionsenabled from manifest collision (all types), optional motor. out: level.constraints. computeconstraintframe computeconstraintframe — constraints.ts packages/engine/src/subsystems/constraints.ts the key math. owner-local pivot/axis → world via live transforms → target-local. pins the current relative pose so nothing snaps on load. buildaxislimits buildaxislimits — constraints.ts packages/engine/src/subsystems/constraints.ts preset 6dof table: frame x = authored axis; hinge frees/limits angular_x (deg→rad), slider/spring free/limit linear_x, spring adds stiffness/damping. dispatches custom to buildcustomaxislimits. buildcustomaxislimits buildcustomaxislimits — constraints.ts packages/engine/src/subsystems/constraints.ts custom — per manifest axes[] row: free (omit), locked (0,0), limited (min/max), spring (+ stiffness/damping). angular limits deg→rad at runtime. applymotor applymotor — constraints.ts packages/engine/src/subsystems/constraints.ts velocity motor on the moving axis: target speed (deg/s→rad/s for hinges) + max force. hinge/slider presets only.","topics":["physics"]},{"side":"engine","kind":"trace","href":"engine/trace-audio.html","title":"Audio: component → positional sound","summary":"Audio engine v2; autoplay negotiates the browser gesture policy without blocking the load.","text":"audio: component → positional sound audio engine v2; autoplay negotiates the browser gesture policy without blocking the load. copy_asset copy_asset — assets.py blender_addon/export/assets.py export — copies the sound file to audio/ with a url-safe name via unique_asset_path; re-exports overwrite the same path (begin_asset_export resets reservations each export_level pass). applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — each audio component queues an applyaudio promise (fetch+decode is async); the entity loop never blocks on sound i/o. applyaudio applyaudio — audio.ts packages/engine/src/subsystems/audio.ts createsoundasync with spatialenabled at creation; spatial.attach(entity.node) so 3d sounds follow. name = file stem. entity.sounds.push + registerattachment. autoplay: void unlockasync().then(play) — fire-and-forget. finalizelevel finalizelevel — levelloader.ts packages/engine/src/core/levelloader.ts promise.allsettled over the audio tasks: a bad file logs a warning; the level still loads. then triggers, constraints, begin. getattachment getattachment — entity.ts packages/engine/src/core/entity.ts runtime — entity.getattachment(\"audio\")?.sound or getattachmentsoftype(\"audio\") for every row. getsound(\"door\") still works by file stem.","topics":["audio"]},{"side":"engine","kind":"trace","href":"engine/trace-load.html","title":"Level load, end to end","summary":"The spine everything above hangs off.","text":"level load, end to end the spine everything above hangs off. load load — levelloader.ts packages/engine/src/core/levelloader.ts the orchestrator: fetch/validate → inputmanager.loadasset (inputactions + defaultinputmap) → right-handed glb append → applynodevisibility → entity loop → second pass → finalizelevel. returns the level. applynodevisibility applynodevisibility — noderesolution.ts packages/engine/src/core/loader/noderesolution.ts for each gltf node with extras.bjs_visible === false (blender viewport-hidden): node.isvisible = false; descendant lights setenabled(false) and cameras hidden. render-disabled objects never reach this step. buildidindex buildidindex — noderesolution.ts packages/engine/src/core/loader/noderesolution.ts guid → node map from metadata.gltf.extras.bjs_id (needs the extrasasmetadata import or this is empty and matching silently falls back to names). processentity processentity — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts per manifest entity: node match (guid first), entity created + registered + back-referenced, components applied, light/camera processed. finalizelevel finalizelevel — levelloader.ts packages/engine/src/core/levelloader.ts shadows → scene look (env, fog, atmosphere when enabled) → animations → settle audio/gui/particle/msdf tasks → wireparticleemittertracking + wiremsdftextrendering → trigger wiring → constraints → buildgui3dcontrols → begin → applypostprocessing → (debug colliders if the export allows). begin begin — level.ts packages/engine/src/core/level.ts attach inputmanager (enables every action map), run every onstart (error-isolated), subscribe runframe. runframe runframe — level.ts packages/engine/src/core/level.ts every frame: inputmanager.process first (actions evaluate, callbacks fire) → all onupdate(deltaseconds) → updaters (offset cams) → inputmanager.endframe last so device edges last exactly one frame.","topics":["load"]},{"side":"engine","kind":"trace","href":"engine/trace-atmosphere.html","title":"Atmosphere: SUN lamp → physical sky","summary":"Babylon @babylonjs/addons/atmosphere for sky and aerial perspective; integrates with PBRMaterial.","text":"atmosphere: sun lamp → physical sky babylon @babylonjs/addons/atmosphere for sky and aerial perspective; integrates with pbrmaterial. bjsatmospheresettings bjsatmospheresettings — atmosphere.py blender_addon/scene/atmosphere.py blender — scene.bjs_scene.atmosphere: enable toggle, sun light picker (sun lamp guid), pbr sun intensity, luts vs ray marching, scattering tuning. serialize_atmosphere serialize_atmosphere — atmosphere.py blender_addon/export/atmosphere.py export — scene.atmosphere block (sunlightid, pbrsunintensity, useluts, multiscattering, groundalbedo, physical.*). null when disabled. _check_atmosphere _check_atmosphere — validate.py blender_addon/export/validate.py warns when atmosphere is on but no renderable sun lamp is available (picked sun light or any exported sun). _serialize_environment _serialize_environment — scene.py blender_addon/export/scene.py when atmosphere is enabled, export forces createskybox: false — the addon renders the sky; ibl from world/usedefault still loads. applyatmosphere applyatmosphere — atmosphere.ts packages/engine/src/subsystems/atmosphere.ts load — atmosphere.issupported check; resolve sun → directionallight (guid or first sun); optional π intensity; new atmosphere(scene, [sunlight], options); physical property tuning. finalizelevel finalizelevel — levelloader.ts packages/engine/src/core/levelloader.ts after applyscenesettings: applyatmosphere when manifest.scene.atmosphere is set → level.atmosphere (disposed in level.dispose). islinearspacecomposition follows postprocessing.defaultpipeline.","topics":["rendering"]},{"side":"engine","kind":"trace","href":"engine/trace-input.html","title":"Input: key press → action → behavior","summary":"Unity Input System style: the Blender Input Actions panel authors the scene asset (maps > actions > bindings) plus a Scene Default map; the manifest carries inputActions + defaultInputMap; InputManager evaluates every frame.","text":"input: key press → action → behavior unity input system style: the blender input actions panel authors the scene asset (maps > actions > bindings) plus a scene default map; the manifest carries inputactions + defaultinputmap; inputmanager evaluates every frame. serialize_input_asset serialize_input_asset — serialize.py blender_addon/input_actions/serialize.py blender — maps/actions/bindings → scene.inputactions (built-in player asset when the panel is empty). called from export/scene.py alongside defaultinputmap from the scene default picker. serialize_scene serialize_scene — scene.py blender_addon/export/scene.py blender — assembles the manifest scene block: clear/ambient, environment (world output chain via scene/environment.py → env/, or usedefault; createskybox forced off when atmosphere on; skyboxignorefog), fog, atmosphere (export/atmosphere.py), post (via export/post_processing.py — default pipeline, ssao), inputactions, and defaultinputmap. default_input_asset default_input_asset — defaultasset.ts packages/engine/src/input/defaultasset.ts runtime fallback when a manifest omits inputactions — keep in sync with blender_addon/input_actions/defaults.py. load load — levelloader.ts packages/engine/src/core/levelloader.ts load — inputmanager.loadasset(manifest.scene.inputactions ?? default, defaultinputmap) runs before the glb append so maps exist when behaviors are built. injectinputmaps injectinputmaps — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts @inputmap(\"name\") / @inputmap() fields get map handles; scripts with no @inputmap receive the scene default on behavior.input — all before onstart. process process — inputmanager.ts packages/engine/src/input/inputmanager.ts called by level.runframe before behaviors: poll the gamepad, evaluate every enabled map's actions, fire started/performed/canceled. process process — inputaction.ts packages/engine/src/input/inputaction.ts per action: resolve bindings (most-actuated wins), advance the button/value/passthrough phase machine, set the per-frame edge flags polling reads. resolvebinding resolvebinding — inputbinding.ts packages/engine/src/input/inputbinding.ts raw browser tokens: keyboard keys, gamepad button/axis/stick indices, and 1daxis/2dvector composites built from part bindings. onupdate onupdate — inputmover.ts apps/playground/src/behaviors/inputmover.ts consumer — polls move/sprint off the injected map and subscribes to jump's performed callback in onstart; no key codes anywhere in gameplay code.","topics":["input"]},{"side":"engine","kind":"trace","href":"engine/trace-livelink.html","title":"Live Link: Ctrl+S → browser reload","summary":"The iteration loop.","text":"live link: ctrl+s → browser reload the iteration loop. _on_save_post _on_save_post — live_link.py blender_addon/export/live_link.py blender — save_post handler: checkbox on + path remembered → validate + export. failures log; the save never breaks. reloadonlevelexport reloadonlevelexport — vite.config.ts apps/playground/vite.config.ts app — vite plugin watches all files under public/levels/ (glb, env/, manifest, …); islevelasset uses path.resolve for chokidar paths; 50ms debounced full reload so replaced hdrs refresh even when .scene.json bytes are unchanged.","topics":["export"]},{"side":"engine","kind":"trace","href":"engine/trace-gui.html","title":"2D GUI: JSON layout → AdvancedDynamicTexture","summary":"File-backed HUDs and in-world mesh UI from Babylon's GUI Editor.","text":"2d gui: json layout → advanceddynamictexture file-backed huds and in-world mesh ui from babylon's gui editor. copy_asset copy_asset — assets.py blender_addon/export/assets.py export — the gui .json is copied to gui/ with a sanitized stable name; re-exports overwrite the same file. applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — each gui component queues an applygui promise (fetch+parse is async); the entity loop never blocks on ui i/o. applygui applygui — gui2d.ts packages/engine/src/ui/gui2d.ts fullscreen → createfullscreenui; mesh → createformesh on the entity node. parsefromurlasync loads the layout. name = file stem. registerattachment after guitextures.push. finalizelevel finalizelevel — levelloader.ts packages/engine/src/core/levelloader.ts settletasks over guitasks (allsettled): a bad json logs a warning; the level still loads. runs alongside audio and particle settlement. getattachment getattachment — entity.ts packages/engine/src/core/entity.ts runtime — entity.getattachment(\"gui\")?.texture or getgui(\"hud\")?.getcontrolbyname(\"score\") (exact name, then contains).","topics":["ui"]},{"side":"engine","kind":"trace","href":"engine/trace-particles.html","title":"Particles: JSON system → emitter","summary":"File-backed particle systems from Babylon's Particle Editor or Node Particle Editor.","text":"particles: json system → emitter file-backed particle systems from babylon's particle editor or node particle editor. export_particle_system export_particle_system — particles.py blender_addon/export/particles.py export — copy particle json to particles/; copy each particle textures image; patch_particle_json_textures (url in json / replace url) on the exported file. applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — each particle component queues an applyparticles promise; gpu mode is requested when supported. applyparticles applyparticles — particles.ts packages/engine/src/subsystems/particles.ts loadparticlesystems: resolvenodeparticlesettextureurls (rooturl beside json) then legacy/gpu or nodeparticlesystemset.buildasync. attachtoentity: mesh or owned vector3 + emptyemitter. autostart calls system.start(). finalizelevel finalizelevel — levelloader.ts packages/engine/src/core/levelloader.ts settletasks over particletasks (bad file → warn, level continues). wireparticleemittertracking wireparticleemittertracking — particles.ts packages/engine/src/subsystems/particles.ts after settlement: collectemptyparticleemitters → level.particleemittermanager. each frame (insertfirst onbeforerender) copies entity.node.getabsoluteposition() into the owned vector3 emitter. getattachment getattachment — entity.ts packages/engine/src/core/entity.ts runtime — entity.getattachment(\"particle\")?.system or getparticles(\"fire\") for stem lookup.","topics":["ui"]},{"side":"engine","kind":"trace","href":"engine/trace-msdfText.html","title":"MSDF text: font assets → TextRenderer","summary":"Resolution-independent 3D labels via @babylonjs/addons TextRenderer.","text":"msdf text: font assets → textrenderer resolution-independent 3d labels via @babylonjs/addons textrenderer. copy_asset copy_asset — assets.py blender_addon/export/assets.py export — bmfont json + glyph atlas png copied to fonts/ with stable sanitized names; re-exports overwrite. applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — each msdf_text component queues an applymsdftext promise (font fetch + async shader compile). applymsdftext applymsdftext — msdftext.ts packages/engine/src/ui/msdftext.ts fontasset cached per scene; textrenderer.createtextrendererasync; parent = entity.node; addparagraph with authored options. registerattachment after textrenderers.push. finalizelevel finalizelevel — levelloader.ts packages/engine/src/core/levelloader.ts settletasks over msdftexttasks, then wiremsdftextrendering → level.msdftextmanager (onafterrenderobservable draw pass). gettextrenderer gettextrenderer — entity.ts packages/engine/src/core/entity.ts runtime — entity.getattachment(\"msdf_text\")?.renderer or gettextrenderer(\"roboto-regular\") by json stem; clearparagraphs/addparagraph for dynamic copy.","topics":["ui"]},{"side":"engine","kind":"trace","href":"engine/trace-gui3d.html","title":"3D GUI: components → GUI3DManager","summary":"In-scene buttons and panels authored as individual GUI3D_* components; Blender parenting defines panel hierarchy.","text":"3d gui: components → gui3dmanager in-scene buttons and panels authored as individual gui3d_* components; blender parenting defines panel hierarchy. serialize_components serialize_components — components.py blender_addon/export/components.py export — gui3d_* cases: text/image/tooltip/panel layout fields; button images via copy_asset; click events as {target guid, message}. click targets force-included via iter_referenced_objects for guid assignment. applycomponents applycomponents — entitybuilder.ts packages/engine/src/core/loader/entitybuilder.ts load — gui3d components don't build yet; each registration carries parentid (manifest parent guid) for panel lookup. buildgui3dcontrols buildgui3dcontrols — builder.ts packages/engine/src/ui/gui3d/builder.ts finalize — after constraints. buildpanels (addcontrol → linktotransformnode → registerattachment) → batch controls with blocklayout → applycontrolcontent → wireclickevents. returns level.gui3dmanager. applycontrolcontent applycontrolcontent — controls.ts packages/engine/src/ui/gui3d/controls.ts the babylon ordering contract: content/text/image must be set after addcontrol or it is silently lost. meshbutton3d wraps the entity mesh. wireclickevents wireclickevents — events.ts packages/engine/src/ui/gui3d/events.ts each on click row: onpointerclickobservable → level.byid(target) → sendmessage(message, buttonentity) → behavior onmessage. getattachment getattachment — entity.ts packages/engine/src/core/entity.ts runtime — entity.getattachmentsoftype(\"gui3d_holo\") for component rows; getcontrol3d(\"startbutton\") for stem lookup.","topics":["ui","scripting"]},{"side":"blender","kind":"area","href":"blender/index.html","title":"Add-on overview","summary":"Diagram · __init__.py · core/ · components/ · scene/ · input_actions/ · operators/ · ui/ · export/ · …","text":"add-on overview __init__.py registration extension entry point. register()/unregister() call each subpackage's register() in dependency order — components & scene first (their propertygroups are referenced everywhere), then input_actions, export, operators, ui, viewport. reloads submodules so edits land mid-session. blender 4.2+ extension order data → ui core/ ids + ts parsing pure helpers, nothing registered. ids.py owns id_key ('bjs_id'), visible_key ('bjs_visible'), and ensure_object_id(); script_parse.py regex-reads @exposed(...) and @inputmap(\"...\") from behavior typescript — the cross-language contract. files ids · script_parse components/ per-object data the component model on every object: bjscomponent (one group switched by comp_type), exposed vars + list items, trigger/click events, light-shadow & animation blocks, and the copy/paste clipboard. constants.py isolates every enum table. key class bjscomponent on object.bjs_components types incl. msdf_text scene/ scene settings bjsscenesettings on scene.bjs_scene: clear/ambient, environment (world texture via scene/environment.py find_world_env_node, or usedefault flag via use_default_environment), show skybox (ibl without visible background when off; forced off when atmosphere on), skybox ignores fog (mesh.applyfog = false when on), fog, atmosphere (scene/atmosphere.py — sun lamp, scattering), freeze shadows; post-processing lives on the nested bjs_scene.post block (scene/post_processing.py) — msaa, fxaa, bloom, ssao, image processing (tone mapping type, exposure, contrast, vignette, color grading, curves), sharpen, dof, chromatic aberration, grain, glow. on scene.bjs_scene.post input_actions/ input actions asset the asset end-to-end: data model (maps/actions/bindings), the built-in player defaults, json serialize/apply (+ friendly-key aliases), and every bjs.input_* operator. export keys inputactions + defaultinputmap operators/ the verbs component/script/export operators in operators/ (components.py, scripts.py, export_ops.py). input actions operators live in input_actions/operators.py — those buttons route there, not through operators/. export op bjs_ot_export ui/ panels + menus all presentation. viewport **babylon object** n-panel = the selected object — or a pinned object — with components + light/camera/animation child panels. viewport **babylon scene** n-panel = scene-wide (rendering, fog, atmosphere, post-processing sub-panels via post_panels.py, input actions, export via draw_export_controls()). object babylon object scene babylon scene export/ the pipeline the output half. level.py orchestrates the glb + schema-v4 manifest (begin_asset_export resets copy reservations each pass); components / datablocks / animation / scene serialize each block (blender→babylon axis swap happens here); assets.py copies media with stable sanitized names (re-export overwrites; _2 only on same-pass collision); validate.py pre-flights; live_link.py re-exports on ctrl+s. output glb + scene.json schema v4 viewport/ viewport gizmo gpu overlays. collider_preview.py draws manual colliders in the 3d view in blender space, so the preview matches the body export produces. draw post_view handler","topics":["blender","start"]},{"side":"blender","kind":"area","href":"blender/data-model.html","title":"Data model","summary":"Diagram · ensure_object_id · BJSComponent · BJSExposedVar · BJSListItem · BJSTriggerEvent · sync_exposed_vars · BJSLightShadow / BJSAnimationSettings · copy_component","text":"data model ensure_object_id guid assignment stamps a unique bjs_id custom property on an object (and re-issues duplicates). this is what promotes a plain object into an addressable entity. id_key is defined here (core/ids.py) and imported by the runtime so both halves agree on the key. prop obj['bjs_id'] file core/ids.py bjscomponent one group, many faces a single propertygroup holding fields for every component type, switched by comp_type (tag/collider/rigidbody/script/camera/audio/constraint/gui/particle/msdf_text/gui3d_*). one collection of these lives on every object (obj.bjs_components). switch comp_type enum file components/component.py bjsexposedvar script values one per @exposed field on a script component: name, type, and the value (float/bool/string/vector/color/entity/enum/list). list vars also own list_items, list_count (typed resize), and show_expanded (per-list collapse, independent of the component header). object & enum changes fire update callbacks. lives in comp.vars file components/exposed_vars.py bjslistitem list elements elements of an exposed list field (e.g. entity lists). add_list_item seeds the right value type; the parent var's list_count get/set lets you type a length instead of clicking +, and bjs.list_add_selected drops every selected object into an entity list at once. ui/component_draw.py draws each list in its own collapsible box. lives in var.list_items file components/exposed_vars.py bjstriggerevent on-enter / on-click rows trigger collider on enter reactions and 3d gui button on click reactions: target object + message (+ optional tag filter for triggers). serialized into collider.events or gui3d events[]. lives in comp.trigger_events / gui3d_events file components/component.py sync_exposed_vars reconcile given freshly parsed @exposed fields, add new vars / drop removed ones / keep existing values. called by the sync operator (operators/scripts.py) and on script-path change. pairs with core/script_parse file components/exposed_vars.py bjslightshadow / bjsanimationsettings per-object blocks shadow parameters per lamp; autoplay clip/loop/speed + the nla strip list per object. parallel on object (obj.bjs_shadow / obj.bjs_animation) — not fields inside bjscomponent. on object file components/object_settings.py copy_component clipboard deep-copies one component group to another (copy/cut/paste, duplicate). _copy_props handles the field-by-field clone. used by paste/duplicate ops file components/clipboard.py","topics":["blender","scripting"]},{"side":"blender","kind":"area","href":"blender/export.html","title":"Export pipeline","summary":"Diagram · export_level · _dedupe_entity_ids · _ensure_entity_ids · _stamp_viewport_visibility · _export_glb · _build_manifest · serialize_components · _serialize_vars · …","text":"export pipeline export_level orchestrator the entry the export operator and live link both call. begin_asset_export → dedupe guids → ensure guids → stamp viewport visibility → write glb → clear visibility stamp → build manifest → attach debug flag → write .scene.json. returns (glb, json, entity count). file export/level.py _dedupe_entity_ids step 1 copy-pasted objects share a guid; this re-issues fresh ones so identity stays unique. file export/level.py _ensure_entity_ids step 2 assign guids to everything addressable (components, lights, cameras) and every referenced object, so refs always resolve. must run before the glb so extras carry the ids. file export/level.py _stamp_viewport_visibility step 3 transient bjs_visible: false on renderable objects with hide_viewport (eye icon). cleared after the glb is written. render-disabled (camera icon) objects are skipped entirely. key visible_key file export/level.py _export_glb step 4 invokes blender's gltf exporter (+y-up, use_renderable=true, guids + visibility in node extras, cameras/lights/animation included). file export/level.py _build_manifest step 5 per renderable object: serialize components, light, camera, animation. plus the scene block. the schema-v4 dict that becomes .scene.json. file export/level.py serialize_components per object one dict per component. converts collider center/size/rotation and constraint pivot/axis to babylon y-up; attaches trigger events; copies gui json via copy_asset; particle json + texture overrides via export_particle_system; 3d button images via copy_asset; serializes gui3d_* layout and click events. axis conv here file export/components.py _serialize_vars per script exposed values → vars dict; entity refs become target guids. refs guid strings file export/components.py serialize_light / serialize_camera auto blocks derived from the lamp/camera datablock (no component needed); the active camera is flagged. no component auto file export/datablocks.py serialize_scene scene block clear/ambient, environment (world output chain → env/ via scene/environment.py, or usedefault when default environment is on; createskybox forced off when atmosphere on; skyboxignorefog), fog, atmosphere (export/atmosphere.py), post (export/post_processing.py; luts → post/), inputactions + defaultinputmap. file export/scene.py serialize_animation per object autoplay clip/loop/speed from object.bjs_animation; nla strip names from export/animation.py. file export/animation.py key entities[].animation","topics":["export"]},{"side":"blender","kind":"trace","href":"blender/trace-export.html","title":"Export: scene → glb + manifest","summary":"What Export Level (and every Live Link save) actually runs, top to bottom.","text":"export: scene → glb + manifest what export level (and every live link save) actually runs, top to bottom. bjs_ot_export blender_addon/operators/export_ops.py the operator behind the export button (an exporthelper, so it shows a file dialog). execute() runs the validator for warnings, then calls export_level with the chosen path. export_level blender_addon/export/level.py the orchestrator. begin_asset_export (stable side-file paths) → dedupe + ensure guids (before the glb so extras carry them) → stamp viewport visibility → write the glb → clear visibility stamp → build the manifest → attach the debug build flag → write .scene.json. returns (glb, json, count). _stamp_viewport_visibility blender_addon/export/level.py transient obj['bjs_visible'] = false for renderable objects with hide_viewport (eye icon). cleared after the glb is written. render-disabled objects are omitted entirely (_is_renderable / use_renderable=true). _ensure_entity_ids blender_addon/export/level.py guids for everything addressable and everything referenced (so an entity/constraint/trigger target always exists in the glb to point at). _build_manifest blender_addon/export/level.py walks renderable objects; per object emits components + light + camera + animation blocks, plus the scene block. the schema-v4 dict. serialize_components blender_addon/export/components.py the core converter: one dict per component, with all blender→babylon axis conversion (collider center/size/rotation, constraint pivot/axis) happening here, once.","topics":["export"]},{"side":"blender","kind":"trace","href":"blender/trace-guid.html","title":"GUID identity: object → entity","summary":"How a Blender object becomes an addressable runtime entity.","text":"guid identity: object → entity how a blender object becomes an addressable runtime entity. ensure_object_id blender_addon/core/ids.py stamps obj['bjs_id'] (id_key). having a guid is what makes an object an entity; pure geometry without one just rides in the glb. _referenced_ids blender_addon/export/level.py collects guids that must exist because something points at them: entity fields, camera/constraint/trigger targets — so references never dangle. _dedupe_entity_ids blender_addon/export/level.py duplicated objects (shift+d) inherit the same custom prop; this detects collisions and re-issues fresh guids before export.","topics":["blender","load"]},{"side":"blender","kind":"trace","href":"blender/trace-exposed.html","title":"@exposed: TypeScript → Blender fields","summary":"The editor side of the cross-language contract — parsing behavior source into editable widgets.","text":"@exposed: typescript → blender fields the editor side of the cross-language contract — parsing behavior source into editable widgets. parse_exposed blender_addon/core/script_parse.py entry: read a behavior .ts file, scan its @exposed decorators, return field descriptors (name, type, default, options). no ts runtime — pure regex, hence the single-line-literal rule. _scan_decorators blender_addon/core/script_parse.py finds each `@exposed(...)` and the field it annotates, capturing the option blob and the field name + default expression. _parse_default blender_addon/core/script_parse.py turns a literal default ([0,1,0], 5, \"idle\", true) into a python value of the right type for the blender property. bjs_ot_sync_vars blender_addon/operators/scripts.py the sync button: re-parse the script and reconcile the component's vars (add new, drop removed, keep existing values). sync_exposed_vars blender_addon/components/exposed_vars.py the reconcile itself — the function sync and the script-path callback share.","topics":["scripting","blender"]},{"side":"blender","kind":"trace","href":"blender/trace-validate.html","title":"Validation: catching silent failures","summary":"The checks that run on Validate, Export, and every Live Link save.","text":"validation: catching silent failures the checks that run on validate, export, and every live link save. validate_scene blender_addon/export/validate.py the entry: iterate objects, run every per-object check, collect warnings, plus scene-wide checks (duplicate guids, active camera). _check_physics blender_addon/export/validate.py checks every enabled collider: mesh + dynamic is invalid in havok; warns when mixed trigger/non-trigger colliders share one entity (compound body). _check_skinned_meshes blender_addon/export/validate.py the skinned-mesh trap: components/animation on a skinned mesh do nothing (its node transform is ignored; clips target the armature's joints). warn to move them to the armature. _check_constraints blender_addon/export/validate.py a joint needs a physics body on both ends or it won't exist at runtime — warn if either is missing. custom: six axis rows expected; min ≤ max on limited/spring rows. _check_atmosphere blender_addon/export/validate.py when atmosphere is on: sun light must be a renderable sun lamp, or at least one exported sun must exist in the scene.","topics":["export"]},{"side":"blender","kind":"trace","href":"blender/trace-input.html","title":"Input Actions: panel → manifest","summary":"How the scene-level Input Actions asset and Scene Default map reach the runtime.","text":"input actions: panel → manifest how the scene-level input actions asset and scene default map reach the runtime. bjs_pt_input_map blender_addon/ui/input_panel.py the input actions editor in the **babylon scene** n-panel. scene default picker, maps/actions/bindings editor, load/save .inputactions.json. draw logic is a reusable mixin. serialize_input_asset blender_addon/input_actions/serialize.py maps/actions/bindings → scene.inputactions (built-in player asset when the panel is empty). lives with its inverse (apply_input_asset) and the friendly-key aliases. serialize_scene blender_addon/export/scene.py writes scene.defaultinputmap alongside inputactions — the map scripts without @inputmap receive on behavior.input. _check_input_map blender_addon/export/validate.py duplicate map/action names, actions without bindings, @inputmap refs without a matching map, and a scene default that doesn't exist. parse_input_maps blender_addon/core/script_parse.py regex-scans behavior sources for @inputmap(\"name\") so sync / validate can create and check map references.","topics":["input","blender"]},{"side":"blender","kind":"trace","href":"blender/trace-livelink.html","title":"Live Link: Ctrl+S → re-export","summary":"The save-to-see loop, Blender side (the browser reload is in the runtime packet).","text":"live link: ctrl+s → re-export the save-to-see loop, blender side (the browser reload is in the runtime packet). _on_save_post blender_addon/export/live_link.py a @persistent save_post handler: after every .blend save, re-export each scene that opted in. _do_live_export blender_addon/export/live_link.py re-validate + re-export to the remembered path. wrapped so a failed export logs to the console but never breaks the user's save.","topics":["export"]},{"side":"blender","kind":"trace","href":"blender/trace-collider-preview.html","title":"Collider preview: the viewport gizmo","summary":"How manual colliders are drawn in the 3D view so the preview matches the exported body.","text":"collider preview: the viewport gizmo how manual colliders are drawn in the 3d view so the preview matches the exported body. _draw blender_addon/viewport/collider_preview.py the post_view draw handler: for each object with a manual collider, build its wireframe in blender space and batch it to the gpu. _local_geometry blender_addon/viewport/collider_preview.py produces the shape's edge geometry (box/sphere/capsule/cylinder) in the object's local space — the same center/size/rotation export will convert, so preview == runtime.","topics":["physics","blender"]},{"side":"blender","kind":"trace","href":"blender/trace-gui3d.html","title":"3D GUI: authoring → manifest","summary":"How nine GUI3D_* component types serialize and validate before export.","text":"3d gui: authoring → manifest how nine gui3d_* component types serialize and validate before export. bjscomponent blender_addon/components/component.py authoring — one propertygroup, many faces. gui3d_* types share gui3d_text/image/tooltip/events and panel layout fields. membership sets gui3d_controls / gui3d_panels / gui3d_textured (in components/constants.py) classify draw + export branches. _draw_click_events blender_addon/ui/component_draw.py the on click events box for 3d controls — same target+message ui as trigger colliders, wired to bjs.gui3d_event_add/remove operators. serialize_components blender_addon/export/components.py gui3d_* cases emit type-specific fields; button images copied via copy_asset to gui/; click-event targets yielded by iter_referenced_objects for guid assignment. _check_gui3d blender_addon/export/validate.py mesh button on non-mesh, panel without button children, click events without targets, missing button image files. _check_media blender_addon/export/validate.py gui (missing json, mesh mode on non-mesh), particle (missing json, missing particle texture images), alongside 3d gui validation.","topics":["ui","blender"]},{"side":"blender","kind":"trace","href":"blender/trace-particles.html","title":"Particles: authoring → patched JSON","summary":"Particle JSON plus optional Particle Textures copied and patched on export.","text":"particles: authoring → patched json particle json plus optional particle textures copied and patched on export. bjsparticletexture blender_addon/components/component.py authoring — particle_textures rows: image_file, json_url (filename in particle json), match_url (optional block filter). _draw_particle_textures blender_addon/ui/component_draw.py particle textures box on the particle component; bjs.particle_texture_add/remove operators. export_particle_system blender_addon/export/particles.py export — copy json; copy_particle_texture per row; patch_particle_json_textures on the exported file under particles/. _check_media blender_addon/export/validate.py warns when particle json or a particle textures image file is missing.","topics":["ui","blender"]},{"side":"engine","kind":"prose","href":"engine/00-INDEX.html","title":"Babylon Level Kit — Engine (Runtime) Documentation","summary":"The runtime half of the kit, current as of v0.32.0 . The interactive version is the HTML diagram set in this folder — open [index.html](index.html) and use the bottom nav (an area row for the subsyste","text":"babylon level kit — engine (runtime) documentation the runtime half of the kit, current as of v0.32.0 . the interactive version is the html diagram set in this folder — open [index.html](index.html) and use the bottom nav (an area row for the subsystem diagrams + a traces row for code walk-throughs; &quot;blender docs →&quot; jumps to the editor packet). looking for something specific? open the searchable landing page at [../index.html](../index.html) and type a term (e.g. *collision*, *export*, *input*) to surface the relevant pages from both the engine and blender sides. what the runtime does @bjs/engine ( packages/engine/ ) loads the two artifacts blender exports — level.glb (everything gltf can express) and level.scene.json (everything it can't) — and turns them into a live level . levelloader.load appends the glb, indexes nodes by guid, builds an entity per manifest entry, applies components through small subsystems (physics, lights, cameras, audio, …), then runs your behavior scripts. see architecture for the two-artifact split and blender add-on for the editor side. the interactive pages area diagrams (clickable node graphs): [index.html](index.html) (engine overview) · [load-pipeline.html](load-pipeline.html) · [scripting.html](scripting.html) · [physics.html](physics.html) · [rendering.html](rendering.html) · [audio-animation.html](audio-animation.html) · [ui.html](ui.html) · [workflow.html](workflow.html) · [blender-addon.html](blender-addon.html) (the editor, from the runtime's point of view). code traces (each node is a step; click for the explanation + the actual current typescript source): load (manifest → level ) · physics (collider → havok body) · @exposed (field → blender → instance) · triggers (on-enter → onmessage ) · constraints (component → joint) · audio · input (key → action → behavior) · live link · 2d gui · particles · msdf text · 3d gui · atmosphere (sun lamp → physical sky). the prose chapters architecture — two artifacts, guid identity, monorepo, data flow blender add-on — the editor half + export pipeline load pipeline — levelloader.load , the passes, finalizelevel scripting — entity , behavior , @exposed , @inputmap , input physics — bodies, constraints, triggers, right-handed import rendering — lights, cameras, shadows, environment, atmosphere, scene look audio & animation — sounds, nla clips, the skinned-mesh rule workflow — live link, the validator, debug build, tooling, babylon launcher feature traces — every feature's blender → runtime file/function chain ui — 2d gui, particles, msdf text, 3d gui regenerating npm run docs:build regenerates both packets from the shared shell template ( docs/_template/diagram-shell.html ) and rebuilds the searchable landing page. npm run docs:trace rebuilds only this folder; it re-extracts every trace's source from packages/engine/ . a renamed/deleted symbol fails the build loudly — the anti-rot guard. (the blender packet alone is npm run docs:blender .) full build pipeline, file layout, and how to add traces or diagrams: building the documentation .","topics":["start"]},{"side":"engine","kind":"prose","href":"engine/01-ARCHITECTURE.html","title":"Architecture","summary":"01 —  The core idea: two artifacts If glTF can already express it, the glb owns it and the engine writes no code for it. If it can't, it goes in the manifest and a small subsystem applies it. Artifact","text":"01 — architecture the core idea: two artifacts if gltf can already express it, the glb owns it and the engine writes no code for it. if it can't, it goes in the manifest and a small subsystem applies it. artifact carries consumed by level.glb geometry, transforms, hierarchy, materials, lights, cameras, animation clips babylon's gltf importer level.scene.json components (tag/collider/rigidbody/script/camera/audio/constraint), per-light/camera/scene settings, scene.inputactions + scene.defaultinputmap , schema v4 our levelloader the manifest never duplicates the glb — it only adds. this is why there's a subsystems/physics.ts but no meshes.ts : meshes ride entirely in the glb. entity identity (guids) every addressable blender object gets a guid in a custom property ( bjs_id , defined once as id_key on both sides). the exporter writes it into the gltf node's extras ; the manifest references the same guid. at load it surfaces at node.metadata.gltf.extras.bjs_id (via the extrasasmetadata loader extension) and the loader matches manifest entity → glb node by guid, name as a legacy fallback. a guid is what makes an object an *entity*; pure geometry without one just lives in the glb. guids are auto-assigned to anything that needs to be findable: objects with components, lights, cameras, and any object referenced by an entity field, trigger event, or constraint target. visibility uses the same extras channel: viewport-hidden objects (blender eye icon / hide_viewport , but still render-enabled) get a transient bjs_visible: false ( visible_key ) stamped into gltf extras at export; the loader's applynodevisibility sets node.isvisible = false and disables child lights/cameras. render-disabled objects ( hide_render , camera icon) are skipped entirely — no glb geometry and no manifest entry ( use_renderable=true on the gltf exporter matches the manifest filter). the guid is also the discriminator for two subtle cases: multi-material submeshes have no guid (so they're &quot;owned&quot; by their wrapper — see physics ), while real parented children do (so they're excluded from a parent's collider). monorepo layout bjs-level-kit/ package.json # npm workspaces root: dev / typecheck / create packages/engine/ # &quot;@bjs/engine&quot; — the runtime, shared by every app src/ index.ts # public barrel (apps import &quot;@bjs/engine&quot;) core/ # types.ts (schema) · attachments.ts · entity.ts · level.ts · levelloader.ts # loader/ (manifest · noderesolution · entitybuilder · scenesettings) scripting/ # behavior.ts · exposed.ts · behaviorregistry.ts input/ # inputmanager · maps/actions/bindings · @inputmap subsystems/ # physics lights cameras/ shadows constraints audio # triggers environment fog atmosphere postprocess animation apps/ # each game is an app; engine reaches it via symlink playground/ # the dev/test app (vite); template for npm run create blender_addon/ # the editor half (python, blender 4.2+ extension) scripts/create-app.mjs # scaffolds apps/<name> docs/ # this documentation, plans, specs apps declare &quot;@bjs/engine&quot;: &quot;*&quot; ; npm install at the root satisfies it with a symlink to packages/engine (no publishing, no copying). the engine ships ts source ( exports → src/index.ts ); vite compiles it across the link and hot-reloads engine edits into running apps. engine and blender add-on versions move in lockstep. end-to-end data flow blender scene (objects + components + guids) │ export level / live link [02-blender-addon.md] ▼ level.glb + level.scene.json (+ audio/ files, env textures) │ vite dev server serves apps/<app>/public/levels/ ▼ levelloader.load(manifesturl) [03-load-pipeline.md] │ inputmanager.loadasset → appendsceneasync (right-handed) → guid index │ → per-entity pass → second pass (refs, camera targets) → finalizelevel ▼ level (entities, update loop) ── behaviors run onstart/onupdate [04-scripting.md]","topics":["start"]},{"side":"engine","kind":"prose","href":"engine/02-BLENDER-ADDON.html","title":"The Blender Add-on (editor half)","summary":"02 —  A Blender 4.2+/5.x extension ( blender_addon/ , installed from babylon_level_kit_extension.zip ). It owns authoring, GUID assignment, and the export that produces the two artifacts . Where the U","text":"02 — the blender add-on (editor half) a blender 4.2+/5.x extension ( blender_addon/ , installed from babylon_level_kit_extension.zip ). it owns authoring, guid assignment, and the export that produces the two artifacts . where the ui lives split by object vs scene : 3d viewport n-panel, &quot;babylon object&quot; tab ( ui/view3d_panels.py ) — the selected object: component stack, light/camera/animation child panels. when an object has two or more enabled collider components, the panel shows a compound-body notice; each collider header is numbered ( collider 1/3 , …) and its body repeats the hint. the pin button in the components header locks the inspector to one object ( windowmanager.bjs_pinned_object ) so you can change the viewport selection while editing — every component verb resolves its target through core/inspector.py:inspector_object() , so they all act on the pinned object. 3d viewport n-panel, &quot;babylon scene&quot; tab ( ui/scene_panels.py + ui/post_panels.py + ui/input_panel.py ) — scene-wide: rendering (clear/ambient, default environment , show skybox , freeze shadows), fog, atmosphere , post-processing, input actions , and export (live link / debug build / validate via ui/common.py:draw_export_controls() ). exposed lists ( @exposed({ type: &quot;list&quot; }) ) each list field in a script component renders as its own collapsible box ( bjsexposedvar.show_expanded ) — independent of the component's header collapse — with a triangle toggle and an n item(s) summary when folded. grow a list three ways: the + button ( bjs.list_add ), a typed count field (the var's list_count get/set resizes the collection), and — for entity lists — an add selected button ( bjs.list_add_selected ) that drops every selected viewport object into the list at once, skipping the list's own object and any duplicates. pin the inspector first so picking those objects doesn't switch the panel away. package map package single purpose __init__.py extension registration order + dev-reload of submodules core/ pure helpers, nothing registered: ids.py (guids + visible_key ), script_parse.py ( @exposed / @inputmap regex parsing) components/ per-object data model: component.py ( bjscomponent , trigger/click events), exposed_vars.py , object_settings.py , clipboard.py , constants.py (all enums) scene/ scene-wide render settings on scene.bjs_scene ( settings.py , environment.py for world output texture discovery, atmosphere.py for physical sky, post_processing.py for the nested post block) input_actions/ the input actions asset end-to-end: properties.py , defaults.py , serialize.py , operators.py export/ everything that writes files: level.py (orchestrator), components.py (component stack → manifest, axis conversion here), datablocks.py , animation.py , scene.py , atmosphere.py , post_processing.py , assets.py ( copy_asset ), validate.py , live_link.py operators/ component verbs ( components.py ), script pick + sync ( scripts.py ), validate + export ( export_ops.py ) ui/ all panels and menus: view3d_panels.py , scene_panels.py , post_panels.py , input_panel.py , component_draw.py , common.py , menus.py viewport/ gpu overlays: collider_preview.py (manual collider wireframe) rule of thumb: core/ , components/ , scene/ , input_actions/ own *data*; export/ owns *output*; operators/ owns *behavior*; ui/ owns *presentation*. the export pipeline (what &quot;export level&quot; does) validate ( export/validate.py:validate_scene ) — warnings surface in the report. guid pass ( export/level.py ) — ensure_object_id ( core/ids.py ) for every object that needs one, including *referenced* objects (entity fields, camera targets, trigger/click targets, constraint targets) so references always resolve. duplicated guids (copy-pasted objects) are re-issued. stamp viewport visibility — _stamp_viewport_visibility writes transient bjs_visible: 0 into gltf extras for renderable objects hidden in the viewport ( visible_get() , including collection hierarchy); cleared after the glb is written. write the glb via blender's gltf exporter (+y-up, use_renderable=true skips render-disabled objects, guids + visibility in node extras). build the manifest — per renderable entity: serialize_components (viewport-hidden entities also get &quot;visible&quot;: false in the manifest) ( export/components.py ; one dict per component), plus auto-derived light / camera / animation blocks; plus the scene block ( export/scene.py ); plus the top-level &quot;debug&quot; flag (debug build checkbox, owned by export/live_link.py ). schema &quot;version&quot;: 4 . copy side files — begin_asset_export() then copy_asset / save_image_asset ( export/assets.py ): world environment texture when find_world_env_node ( scene/environment.py ) finds one on the active world output chain (sanitized filename under env/ ); default environment sets usedefault in the manifest instead of a file; show skybox / skybox ignores fog → createskybox / skyboxignorefog (forced off when atmosphere is on — the addon renders the sky); color-grading luts → post/ , audio → audio/ , gui layouts → gui/ , particle systems → particles/ (json via export_particle_system ; optional particle textures copy images and patch texture urls in the exported json), 3d button images → gui/ . each export pass resets path reservations so re-exports overwrite the same sanitized name (live link safe). _2 , _3 , … suffixes apply only when two *different* sources collide on the same sanitized name in a single export. remember the path for live link . object visibility (eye vs camera icon) blender toggle property export behavior eye (viewport) visible_get() false included in glb; &quot;visible&quot;: false in manifest + bjs_visible in node extras camera (render) hide_render excluded from glb and manifest ( _is_renderable ) axis conversions (blender z-up → babylon y-up) done at export in export/components.py , so the runtime receives babylon-space values unchanged: vectors (x, y, z) → (x, z, −y) ; sizes swap y/z; quaternions keep w with vector part converted; constraint axis enum x/y/z → unit vectors via the same map. custom constraints also export six per-axis rows ( axes[] : mode, min/max, stiffness/damping). viewport/collider_preview.py draws raw blender values, so the viewport preview matches the exported body.","topics":["blender","export"]},{"side":"engine","kind":"prose","href":"engine/03-LOAD-PIPELINE.html","title":"The Load Pipeline","summary":"03 —  LevelLoader.Load(manifestUrl) ( packages/engine/src/core/LevelLoader.ts ) is the orchestrator; each stage lives in core/loader/ ( manifest.ts , nodeResolution.ts , entityBuilder.ts , sceneSettin","text":"03 — the load pipeline levelloader.load(manifesturl) ( packages/engine/src/core/levelloader.ts ) is the orchestrator; each stage lives in core/loader/ ( manifest.ts , noderesolution.ts , entitybuilder.ts , scenesettings.ts , context.ts ). fetchandvalidatemanifest ( loader/manifest.ts ) — clear errors for the two classic failures: http 404, and the dev server returning index.html (html, not json). load input — `inputmanager.loadasset(manifest.scene.inputactions ?? default_input_asset, manifest.scene.defaultinputmap ?? &quot;player&quot;) so @inputmap fields and the scene-default behavior.input` fallback can be injected before behaviors are built. append the glb — scene.userighthandedsystem = true is set *first* so the loader skips the handedness-mirroring __root__ transform (the old collider-orientation bug; full story in physics ). neutralizegltfroot ( loader/noderesolution.ts ) remains as a guard that warns if a mirrored root ever reappears. requires the extrasasmetadata loader extension import — without it node.metadata stays empty and guid matching silently fails. applynodevisibility ( loader/noderesolution.ts ) — for each gltf node whose extras carry bjs_visible: false (blender viewport-hidden), set node.isvisible = false and disable descendant lights/cameras. render-disabled objects never reach this step — they were omitted at export. buildidindex ( loader/noderesolution.ts ) — walk every transform node + mesh, map metadata.gltf.extras.bjs_id → node. processentity ( loader/entitybuilder.ts ) per manifest entity: - resolve node (guid first, name fallback), create entity , register in level.entities , back-reference node.metadata.bjsentity = entity ; - applycomponents → classifycomponents sorts the component array, then: physics body from collider(s)/rigidbody ( buildphysics → compound physicsshapecontainer when multiple colliders, else single-shape paths → registerattachment per collider/rigidbody row), trigger-event registrations queued, audio/gui/particle async tasks queued, gui3d registrations queued (with manifest parent guid for panel nesting), instantiatescripts builds behaviors ( registerattachment per script), applies @exposed values, and injectinputmaps (entity refs deferred as pendingref s); tag rows register during classification; - processlightforentity / processcameraforentity (typed camera override via buildtypedcamera ; follow/arc/offset target bindings queued by queuecameratargets — geospatial resolves pose immediately). second pass — now every entity exists: resolveobjectreferences (entity-typed @exposed fields + list slots) and resolvecameratargets (follow lockedtarget / arc re-pivot / offset per-frame updater). finalizelevel — shadows ( setupshadows ), scene block ( await applyscenesettings → clear/ambient, async applyenvironment + fog), applyatmosphere when the manifest includes scene.atmosphere (sun lamp → @babylonjs/addons/atmosphere ; sets level.atmosphere ), applyautoplayanimations (stop the gltf loader's auto-started groups, start the chosen clips), settletasks for audio/gui/particle/msdf text promises ( promise.allsettled so one bad file logs instead of rejecting the load), wireparticleemittertracking (empty-node particle emitters → level.particleemittermanager ), wiremsdftextrendering (when any msdf labels exist), wire trigger events ( wiretriggerevents → level.triggerobserver ), build constraints ( buildconstraints → level.constraints + constraint rows on owner entities), build 3d gui ( buildgui3dcontrols → level.gui3dmanager + gui3d_* rows on owning entities), then level.begin() (behaviors' onstart , including any runtime camera creation), then applypostprocessing (default pipeline + ssao on scene.activecamera ), and if debugcolliders *and* the export's debug build flag allow, show collider wireframes. see 10 — ui for the 2d gui, particle, and 3d gui pipelines. enablehavokphysics(scene) must run before load — bodies are built in step 5. level ( core/level.ts ) is the runtime container: entities map, byid / bytag , activecamera , shadowgenerators , constraints , post , atmosphere , particleemittermanager , msdftextmanager , debugenabled , showcolliders , addupdater . begin attaches input , runs every onstart , then drives runframe each render: inputmanager.process first, all onupdate(deltaseconds) , registered updaters, then inputmanager.endframe last (so waspressed edges last one full frame). dispose detaches input, removes observers, disposes constraints and sounds, clears entity.attachments , runs ondestroy .","topics":["load"]},{"side":"engine","kind":"prose","href":"engine/04-SCRIPTING.html","title":"Scripting: Entity, Behavior, @exposed, @inputMap, Input","summary":"04 —  Entity ( core/Entity.ts ) The runtime wrapper around one Blender object: id (GUID), name , node (the glb TransformNode), tag , attachments (live registry — one row per successfully applied compo","text":"04 — scripting: entity, behavior, @exposed, @inputmap, input entity ( core/entity.ts ) the runtime wrapper around one blender object: id (guid), name , node (the glb transformnode), tag , attachments (live registry — one row per successfully applied component; types in core/attachments.ts ), behaviors , body? (havok), animations (its animationgroups), sounds (its staticsounds). component vs behavior: a *component* is authored data (tag, collider, script, …); a *behavior* is a runtime script class from a script component. attachments is the single source of truth for &quot;what components does this entity have?&quot; — each row pairs manifest data with its runtime object when one exists ( behavior , body , sound , texture , system , constraint , control ). query via getattachment(type) (first row), getattachmentsoftype(type) , or hasattachment(type) — e.g. getattachment(&quot;script&quot;)?.behavior . convenience lookups: getbehavior(ctor) (by class), getanimation(name) , getsound(name) (exact match then contains), and sendmessage(message, source) → every behavior's onmessage . there is no entity.manifest or getcomponent . three ways to reach another entity: an @exposed({type:&quot;entity&quot;}) field (cleanest), node.metadata.bjsentity from a node, or level.byid / bytag . behavior lifecycle ( scripting/behavior.ts ) onstart (once, after the whole level + all references resolved — cross-entity order unspecified, guard nulls) · onupdate(deltaseconds) (every frame; seconds) · ondestroy (level dispose; remove observers, dispose constraints) · onmessage(message, source) (a trigger event or sendmessage arrived). injected before onstart: entity , scene ; node is a getter for entity.node . names are pascalcase — a lowercase onstart silently never runs (it stops overriding the base hook). the registry contract ( scripting/behaviorregistry.ts ) behaviorregistry maps a script component's name → behavior class (it registers *behaviors*; tag/collider/etc. are applied directly by the loader). main.ts auto-registers every file in behaviors/ by filename stem via import.meta.glob + autoregisterbehaviors — exactly the key blender's &quot;open script…&quot; picker stores. hence the contract: one class per file, file named after the class, {{ph5}}. @exposed ( scripting/exposed.ts ) marks a field editable per-object in blender. the decorator only records name + ui hints in a weakmap; applyexposedvars writes the manifest's stored values onto the instance before onstart (entity refs deferred to the loader's second pass; lists handled per element type). types: float int bool string vector3 color entity enum list (+ of for list elements). blender can't run ts — core/script_parse.py regex-parses the source — so: single-line literal defaults only , explicit type:&quot;entity&quot; hints, entity lists start [] , and the decorator name stays lowercase (the cross-language contract; the one pascalcase exception, see style_guide ). press sync in blender after changing exposed fields. input ( src/input/ ) <a name=&quot;input&quot;></a> a unity input system clone: inputmanager owns the device state (keyboard + first gamepad, deadzoned) and the project-wide inputactionasset of action maps > actions > bindings (direct key/button/axis/stick reads, plus 1daxis / 2dvector composites). actions have a type ( button / value / passthrough ) and fire unity-style started / performed / canceled callbacks; polling: readvalue() , readvector2() , ispressed() , waspressedthisframe() , wasreleasedthisframe() , w
